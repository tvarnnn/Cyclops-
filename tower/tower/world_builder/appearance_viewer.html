<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="wb-representation" content="appearance">
<meta http-equiv="Content-Security-Policy" content="__WB_APPEARANCE_CSP__">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>World</title>
<style>
:root{
  --bg:#0b0d10; --ink:#e8e9ec; --dim:#9aa0a8; --line:#23262c; --accent:#64d2ff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior:none}
body{overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none}
canvas{display:block;width:100%;height:100%;touch-action:none;background:var(--bg)}
#wrap{position:fixed;inset:0}
/* Every fixed layer over the canvas owns its touches too. `touch-action` is
   not inherited, so `body{touch-action:none}` says nothing about these, and
   `#msg` covers the whole screen whenever an error, the withdrawal message or
   "Restoring…" is up -- which made the entire screen scrollable/zoomable at
   exactly the moments a person is most likely to prod it. Harmless only while
   the viewport meta carries `user-scalable=no`, and that stops being true the
   moment the app sets `ignoresViewportScaleLimits` (an accessibility
   setting). */
#bar,#caption,#status,#hint,#msg{touch-action:none}
#compass,#back{touch-action:manipulation}
/* Landscape on a notched phone: `viewport-fit=cover` puts the sensor housing
   over the left or right edge, and nothing here reserved for it. */
#bar{position:fixed;left:0;right:0;bottom:0;
  padding:10px calc(12px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom))
          calc(12px + env(safe-area-inset-left));
  background:linear-gradient(to top,rgba(11,13,16,.96),rgba(11,13,16,0));
  display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:#14171c;color:var(--ink);
  border-radius:8px;padding:8px 11px;font:inherit;font-size:13px;min-height:38px;touch-action:manipulation}
button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
button[disabled]{opacity:.4}
/* The scrim is a gradient that fades out over the top of the frame, and the
   About text is longer than the gradient: over a bright frame (the cream door)
   the tail of it was grey on cream and unreadable -- and it is the paragraph
   that keeps the page honest, so it is the one that must be legible on every
   frame. The head keeps the gradient; the expanded text carries its own
   plate. */
/* The right gutter is the orientation ring's. */
#caption{position:fixed;left:0;right:0;top:0;
  padding:calc(10px + env(safe-area-inset-top)) calc(78px + env(safe-area-inset-right)) 10px
          calc(12px + env(safe-area-inset-left));
  background:linear-gradient(to bottom,rgba(11,13,16,.96),rgba(11,13,16,.72) 55%,rgba(11,13,16,0));
  font-size:12px;color:var(--dim);pointer-events:none}
#caption b{color:var(--ink);font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.9)}
#caption button{pointer-events:auto;min-height:24px;padding:1px 8px;margin-left:6px;font-size:11px;border-radius:10px;vertical-align:baseline}
#caption .more{display:block;margin-top:6px;padding:8px 10px;border-radius:8px;
  background:rgba(8,10,13,.88);color:#d3d7dd;border:1px solid rgba(255,255,255,.08);
  text-shadow:0 1px 2px rgba(0,0,0,.85)}
#caption .more[hidden]{display:none}
/* The status line sits over the frame with no scrim of its own, which was
   fine while it only ever said "Loading the images…" over a black screen.
   It now says "Preparing the view…" over the opening, which is a photograph,
   so it carries the same plate the About text does -- and nothing at all when
   it has nothing to say. */
#status{position:fixed;left:calc(12px + env(safe-area-inset-left));
  bottom:calc(64px + env(safe-area-inset-bottom));font-size:12px;
  padding:3px 8px;border-radius:8px;background:rgba(8,10,13,.82);
  text-shadow:0 1px 2px rgba(0,0,0,.85);
  color:var(--dim);pointer-events:none;font-variant-numeric:tabular-nums}
#status:empty{display:none}
#msg{position:fixed;inset:0;display:none;place-content:center;padding:28px;text-align:center;
  color:var(--dim);background:var(--bg);z-index:5}
#msg.on{display:grid}
.spacer{flex:1}
#pos{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12px}
#hint{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:6px 12px;border-radius:14px;
  background:rgba(11,13,16,.55);color:var(--dim);font-size:12px;pointer-events:none;opacity:0;
  transition:opacity .35s ease}
/* THE ORIENTATION RING. Turning is free and on this capture more than half of
   a full turn was never photographed, so the page has to be able to say where
   the room is while you are pointed away from it -- otherwise five black
   frames in a row read as a crash rather than as the truth.
   The ring is a compass of COVERAGE: the lit arc is the directions a
   photograph exists in, from where you stand; the way you are looking is
   always at the top. When the lit arc is at the bottom, the room is behind
   you. It says nothing about whether there is anything worth seeing there. */
#compass{position:fixed;top:calc(8px + env(safe-area-inset-top));
  right:calc(10px + env(safe-area-inset-right));width:58px;height:58px;
  opacity:0;transition:opacity .4s ease;cursor:pointer}
#compass.on{opacity:.93}
/* The way back, at the edge of the frame, and only while the view is on
   nothing: a chevron toward the shorter turn to the nearest covered heading.
   Tapping it does what the button does. */
/* Drawn, not typed: a glyph would depend on a font the phone may not have,
   and a chevron that renders as a box is worse than no cue at all. */
#back{position:fixed;top:50%;transform:translateY(-50%);width:44px;height:64px;
  display:grid;place-content:center;color:var(--ink);
  opacity:0;pointer-events:none;transition:opacity .5s ease;
  filter:drop-shadow(0 1px 6px rgba(0,0,0,.95));cursor:pointer}
#back::before{content:"";display:block;width:0;height:0;
  border-top:13px solid transparent;border-bottom:13px solid transparent}
#back.right::before{border-left:17px solid currentColor}
#back.left::before{border-right:17px solid currentColor}
#back.on{opacity:.72;pointer-events:auto}
#back.left{left:calc(2px + env(safe-area-inset-left))}
#back.right{right:calc(2px + env(safe-area-inset-right))}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="caption"></div>
<div id="status"></div>
<div id="bar">
  <!-- NOT "Overview". On this capture there is no overview to give: the walk
       never stood back from the desk, so every vantage the envelope holds is
       a view FROM the desk. The button goes to the best-supported vantage
       there is, it says so, and it flies there. -->
  <button id="bOverview" aria-label="Fly to the clearest vantage">Best view</button>
  <!-- Turns, from where you stand, to the nearest heading the glasses actually
       photographed. It does not move you: that is what Best view does. -->
  <button id="bBack" aria-label="Turn to the nearest photographed direction">Face the room</button>
  <button id="bPrev" aria-label="Previous recorded view">&#8592;</button>
  <button id="bNext">&#8594;</button>
  <span id="pos"></span>
  <span class="spacer"></span>
  <button id="bReset">Reset</button>
</div>
<canvas id="compass" width="58" height="58" role="img"
  aria-label="Which directions were photographed from here"></canvas>
<div id="back" aria-hidden="true"></div>
<div id="hint" aria-live="polite">Not captured beyond here</div>
<div id="msg"></div>
<script>
"use strict";
/* The appearance viewer: the wearer's own redacted keyframes, blended view-
   dependently over the proxy surface they were prepared against.

   Contract: docs/contracts/WORLD-BUILDER-APPEARANCE.md (the artifact) and
   WORLD-BUILDER-WORLDS.md §4 (this page). The page is a small shell; the
   imagery arrives through `fetch` from CONFIG.base, which is the app's private
   scheme on the phone (every request passes a native whitelist) and the Tower's
   own origin only in the explicit desktop debug mode. Nothing is written
   anywhere: textures live in GPU memory for the life of the page. */
const CONFIG = __WB_APPEARANCE_CONFIG__;
const T0 = performance.now();
const S = {                          // what the page reports about itself
  phase: "starting", encoding: null, layers: 0, capacity: 0, keyframesInManifest: 0,
  wireBytes: 0, requests: 0, gpu: {}, gpuBytes: 0, revision: null, buildId: null,
  appends: 0, contextLosses: 0, errors: [], timing: {}, opening: null, choice: [],
};
window.__wbAppearance = S;

const $ = id => document.getElementById(id);
function fail(text){
  S.phase = "failed"; S.errors.push(String(text));
  const m = $("msg"); m.textContent = text; m.classList.add("on");
  $("wrap").style.display = "none"; $("bar").style.display = "none";
  $("caption").style.display = "none"; $("status").textContent = "";
}
function status(text){ $("status").textContent = text || ""; }
/* The second or so after the images land, while the support field is built.
   You can already look and walk; what the page cannot do yet is tell you why
   a direction is dark, or which vantage is best. It says so. */
const PREPARING = "Preparing the view…";

const DEBUG = CONFIG.transport === "tower";
const Q = DEBUG ? new URLSearchParams(location.search) : new URLSearchParams("");
const OPT = {
  // Candidate sources chosen per frame, and the ULR top-k blended per fragment
  // (k + 2 vote in the consensus).
  candidates: 8,
  k: Math.max(1, Math.min(5, +(Q.get("k") || CONFIG.k || 4))),
  // The blend's softmax temperature (radians of penalty), the width in CSS
  // pixels over which the drawn room fades out where it borders nothing, the
  // consensus strength, and how long a source takes to fade in or out of the
  // chosen set.
  temp: +(Q.get("temp") || CONFIG.blend_temperature || 0.07),
  fadePx: Math.max(0, Math.min(12, +(Q.get("fadepx") || CONFIG.edge_fade_px || 8))),
  // Where the highlight roll-off starts (display value, below the 0.97 ceiling).
  exposure: +(Q.get("gain") ?? CONFIG.exposure ?? 1.0),
  gamma: +(Q.get("gamma") ?? CONFIG.gamma ?? 1.0),
  knee: Math.max(0.3, Math.min(0.9, +(Q.get("knee") || CONFIG.tone_knee || 0.8))),
  // How far in from a source image's border its weight rises (source pixels):
  // wide, so a keyframe's rectangle never switches on as a hard step. Its
  // EVIDENCE (what the frame shows at all) keeps a narrow 20 px feather.
  border: +(Q.get("border") || CONFIG.border_feather_px || 80),
  exposureModel: Q.get("expo") || "full",
  consensus: Q.get("consensus") !== null ? +Q.get("consensus") : (CONFIG.consensus ?? 1),
  fadeMs: +(Q.get("fadems") || CONFIG.source_fade_ms || 280),
  // Thin cracks in the proxy closed on the screen (CSS px across, 0 = off),
  // and the look of a void: the unlit fog's strength and how much a large
  // void dims the room around it (WORLD-BUILDER-WORLDS.md §4).
  fillPx: Math.max(0, Math.min(8, +(Q.get("fill") ?? CONFIG.crack_fill_px ?? 4))),
  // How far past the capture's own frustum the page may draw, on each tangent.
  // The frame is the capture's plus a margin, not the capture's exactly: a
  // viewport cut to the keyframe made more than half of the reachable views a
  // clean, well-lit, empty rectangle (FINAL2 §7). Measured §"the sweep".
  viewMargin: Math.max(0.8, Math.min(2.0, +(Q.get("fov") ?? CONFIG.view_margin ?? 1.4))),
  viewMarginV: Math.max(0.8, Math.min(2.0, +(Q.get("fovv") ?? CONFIG.view_margin_v ?? 1.15))),
  // How close the camera may come to the proxy (scene units).
  standoff: Math.max(0.2, Math.min(4.0, +(Q.get("sd") ?? CONFIG.standoff ?? 1.0))),
  fog: +(Q.get("fog") ?? CONFIG.void_fog ?? 0.35),
  wide: +(Q.get("wide") ?? CONFIG.void_wide_fade ?? 0.2),
  // How badly a vertex has to be measured before its photograph is faded back
  // into the void (the proxy's confidence byte, 0..1). The band is the PHONE
  // LEVEL's: the channel is not comparable between levels of detail, and the
  // archive level's own band would fade a fifth of the opening view. Zero
  // disables the fade; `proxy.confidence.present === false` does too, and that
  // is NOT the same as "confidence zero".
  confLo: Math.max(0, Math.min(1, +(Q.get("clo") ?? CONFIG.confidence_lo ?? (24 / 255)))),
  confHi: Math.max(0, Math.min(1, +(Q.get("chi") ?? CONFIG.confidence_hi ?? (78 / 255)))),
  forceWebp: Q.get("enc") === "webp",
  debugMode: +(Q.get("dbg") || 0),
  preserve: Q.get("preserve") === "1",
};

/* ---------- transport ---------------------------------------------------- */
/* Every fetch is BOUNDED. On the phone `glasses-world:` is answered by the
   app's own `WKURLSchemeHandler`, so a request settles only if that handler
   answers it -- and a handler that loses a task (a torn-down web view, a
   killed content process) leaves a `fetch` that never rejects and never
   resolves. The retry loop below only fires on rejection, so before this
   timeout a single dropped task was a page waiting for ever: the reason
   "Restoring…" could stick (review 2, P-1 and M-3). The app end is fixed too;
   this end does not depend on it.

   Generous, because the bodies are large over Tailscale: a 1.6 MB bundle at a
   bad 200 kB/s is 8 s, and the app's own proxy timeout is 30 s. */
const FETCH_TIMEOUT_MS = 45000;
function url(route){ return (CONFIG.base || "") + route; }
async function fetchBytes(route, what){
  let lastError = null;
  for (let attempt = 0; attempt < 3; attempt++){
    const abort = new AbortController();
    const timer = setTimeout(() => abort.abort(), FETCH_TIMEOUT_MS);
    try {
      const r = await fetch(url(route), {cache: "no-store", credentials: "omit", signal: abort.signal});
      S.requests++;
      if (r.status === 404){
        let detail = null;
        try { detail = (await r.json()).detail; } catch (_) { /* not JSON */ }
        const e = new Error(detail || (what + " is not served"));
        e.absent = true; throw e;
      }
      if (!r.ok) throw new Error(what + ": HTTP " + r.status);
      const b = await r.arrayBuffer();
      S.wireBytes += b.byteLength;
      return b;
    } catch (e){
      if (e.absent) throw e;
      lastError = e && e.name === "AbortError"
        ? new Error(what + ": no answer in " + Math.round(FETCH_TIMEOUT_MS / 1000) + " s")
        : e;
      S.timeouts = (S.timeouts || 0) + (e && e.name === "AbortError" ? 1 : 0);
      await new Promise(res => setTimeout(res, 300 * (attempt + 1) * (attempt + 1)));
    } finally {
      clearTimeout(timer);
    }
  }
  throw new Error("could not fetch " + what + ": " + (lastError && lastError.message || lastError));
}
async function fetchJSON(route, what){
  const b = await fetchBytes(route, what);
  return JSON.parse(new TextDecoder().decode(b));
}

/* ---------- follower: what a revision poll means (pure; tested under node) ---------- */
/* Contract: WORLD-BUILDER-WORLDS.md §4 "Following" and WORLD-BUILDER-APPEARANCE.md §9.
   No DOM, no GL, no fetch: `decide` turns one poll's outcome into one action,
   `mustReplace` says whether a manifest's textures may be overwritten in place,
   `nextDelay` paces the polls. The page below only carries the actions out.

   Review 1, B1: `appearance.revision: null` used to be terminal. Every ordinary
   Stop turns the session label from `none` into the real one, the routes stop
   serving the walk's build until the final one lands, and the page deleted its
   textures and stopped polling for good. Now:
   - `rebuilding` (the label changed in a way the Tower says the textures carry
     over): keep drawing, keep polling, pick the next build up in place;
   - `withdrawn` / `absent` / a 404 naming a world or session that is gone: drop
     the textures NOW, say why, and keep polling (slowly) so a rebuild returns;
   - a served build whose `epoch` differs from the one on screen: drop first,
     then draw it (m7: a label change and a rebuild inside one poll). */
const FOLLOW = (() => {
  const BASE_MS = 10000, CEILING_MS = 120000;
  // How long the walk's images are kept on screen waiting for the final build.
  // The final stages run minutes after Stop; past this the page degrades.
  const HOLD_MAX_MS = 20 * 60 * 1000;
  const GONE = /^(no world |world .* has no session )/;
  function decide(poll, page){
    page = page || {};
    if (!poll || poll.error !== undefined) return {action: "none", live: null};
    if (poll.absent !== undefined){
      if (GONE.test(String(poll.absent || "")))
        return {action: "drop", live: false,
                reason: "This world is no longer on the Tower, so its images were removed from this view."};
      return {action: "none", live: null};
    }
    const body = poll.ok || {};
    const a = body.appearance || {};
    const live = body.live === undefined ? null : body.live;
    if (typeof a.revision === "string" && a.revision){
      return a.revision !== page.revision ? {action: "load", live, revision: a.revision}
                                          : {action: "none", live};
    }
    if (a.state === "rebuilding"){
      const since = page.holdingSince;
      if (since !== null && since !== undefined && (page.now - since) > HOLD_MAX_MS)
        return {action: "drop", live,
                reason: "The finished world's images did not arrive, so the walk's images were removed. "
                  + "Close and reopen the world to see what it has now."};
      return {action: "hold", live};
    }
    // A CRASH is not a privacy event (review 2, m-15). The Tower answers
    // `unavailable` when its own appearance code raised. The textures still go
    // -- nothing re-checked the redaction label, and a texture must not outlive
    // that check -- but the wearer is not told their redaction record changed
    // when what actually happened is that the Tower could not answer.
    if (a.state === "unavailable")
      return {action: "drop", live,
              reason: "The Tower could not answer for this world's images just now, so they were "
                + "removed from this view. It will show them again as soon as it can."};
    return {action: "drop", live,
            reason: "These images are no longer served for this world (its redaction record changed, "
              + "or its imagery was removed). This view will show them again if they are rebuilt."};
  }
  function epochOf(man){ return man && typeof man.epoch === "string" && man.epoch ? man.epoch : null; }
  function mustReplace(shown, next){
    if (!shown) return false;                       // nothing on screen to keep
    const a = epochOf(shown), b = epochOf(next);
    return a === null || b === null || a !== b;     // unknown is never "the same"
  }
  function nextDelay(result, delay){
    if (result && (result.action === "load" || result.action === "hold" || result.live === true)) return BASE_MS;
    return Math.min(CEILING_MS, Math.max(BASE_MS, (delay || BASE_MS) * 2));
  }
  return {decide, mustReplace, nextDelay, BASE_MS, CEILING_MS, HOLD_MAX_MS};
})();
/* ---------- end follower */

/* ---------- encoding: which texture set this phone gets (pure; tested under node) ---------- */
/* Contract: WORLD-BUILDER-APPEARANCE.md §5.5 and §9. No DOM, no GL, no fetch.
   Pulled out of `main()` so it can be tested at all (review 2): the ASTC
   fallback, the phone tier and the layer budget are three of the things only a
   device could check, and there was no unit for any of them.

   `choose` needs THREE agreements before it picks ASTC, because each is a real
   way to get a black room: the device's extension, the manifest's own
   `encodings` entry, and an actual `tier: "phone"` ASTC chunk to fetch. A
   Tower built without an encoder still publishes the manifest. */
const ENC = (() => {
  const ASTC = "astc-6x6-rgba", WEBP = "webp-rgba";
  function towerHas(man, encoding){
    const e = (man && man.encodings || {})[encoding];
    return !!(e && e.available !== false);
  }
  function hasChunks(man, encoding){
    return (man && man.chunks || []).some(c => c.encoding === encoding && c.tier === "phone");
  }
  function choose(man, device){
    device = device || {};
    if (device.forceWebp || !device.astc) return WEBP;
    return (towerHas(man, ASTC) && hasChunks(man, ASTC)) ? ASTC : WEBP;
  }
  /* Why a WebP fallback is never empty: the Tower emits a WebP chunk for every
     phone group unconditionally (`appearance_pipeline.py`). */
  function phoneKeyframes(man, encoding){
    return (man && man.keyframes || [])
      .filter(k => k.tier === "phone" && k.chunks && k.chunks[encoding])
      .sort((a, b) => (a.rank ?? 1e9) - (b.rank ?? 1e9));
  }
  /* The manifest's budget, this encoding's cap, and what the DEVICE will hold:
     `MAX_ARRAY_TEXTURE_LAYERS` is the last word, so no budget can ask for an
     array the driver would refuse. */
  function capacity(man, encoding, caps){
    caps = caps || {};
    const budget = (man && man.selection && man.selection.phone_budget) || 128;
    const cap = encoding === ASTC ? (caps.astc || 192) : (caps.rgba8 || 48);
    return Math.max(1, Math.min(budget, cap, caps.maxLayers || 1));
  }
  return {choose, phoneKeyframes, capacity, ASTC, WEBP};
})();
/* ---------- end encoding */

/* ---------- navigation: where the camera may go (pure; tested under node) ---------- */
/* Contract: WORLD-BUILDER-WORLDS.md §4 "Navigation". No DOM, no GL.
   This representation is photographic where the wearer stood and looked, and
   dark from anywhere else: the fix-it walkthrough found every orbit behind or
   outside the room 99-100% dark, and free orbit was the first thing a person
   tried. So the camera moves freely only inside a CAPTURE-SUPPORTED ENVELOPE:
   - a tube around the recorded walk (R_MAX across, V_MAX along the vertical),
     soft from R_SOFT;
   - a SUPPORT FIELD over position and look direction: on a grid of points in
     the tube (SPACING apart), which fraction of a view in each direction lands
     on proxy surface that a bound keyframe SAW (visible in its own depth) from
     within 85 degrees of that view's ray. It is built on the page from what
     the page itself can draw (the phone-tier layers and their depth), so it
     needs nothing new from the Tower and follows a new build.
   A step that makes things worse near the boundary is scaled down smoothly
   (never a wall, never a snap), a released camera drifts gently back inside,
   and the page shows a hint. The envelope ONLY limits the camera: it paints
   nothing, and the dark places inside it stay dark. */
const NAV = (() => {
  /* LOOKING IS FREE; MOVEMENT IS WHAT THE CAPTURE LIMITS.
     Revised 2026-09-17 (fix-it interaction lane), after an independent review
     measured what a finger can actually reach on this page: 24.1 degrees of
     yaw at the opening pose and then nothing for 57 frames of held drag;
     across 16 recorded poses a median leftward look of -7.3 degrees, a median
     upward look of +5.7, and 0.94 of 4.48 units for a deliberate forward push.
     The escape hatch (`lookAcross`) never fired once in ten 60-frame sweeps.
     The verdict was "a 24-degree slot you cannot get out of", and it is right:
     a control that answers a two-inch drag with four degrees reads as a broken
     page, not as a boundary.
     So the two are separated. ROTATION is free -- full 360 of yaw from any
     reachable position, pitch limited only by the neck -- because turning to a
     wall the glasses never photographed shows honest darkness, which is true
     and expected. A cage is not. WHERE THE CAMERA MAY BE is still limited, by
     the two limits that are physically true: the tube around the walk the
     wearer actually took, and how close a 360x640 frame may be magnified. */
  // The tube: widened from 1.0 x 0.6 (soft from 0.55 of it), which made the
  // first half of every sideways push resisted.
  const R_SOFT = 0.75, R_MAX = 1.5, V_MAX = 0.8;      // scene units (median scene depth ~4.7)
  // View support: how well the capture covers what a view looks at. It rates
  // QUALITY, not only coverage -- each source's incidence, one source or
  // several, and whether the point sits beside a large hole in the proxy -- at
  // the capture's field of view. Measured on the canonical world over 250
  // random views in the tube, a view is "good" (drawn >= 0.9, blotch <= 2.5%,
  // seam excess <= 8) for 96% of views at support >= 0.80, 75% at 0.70-0.80
  // and 64-68% at 0.60-0.70.
  // It NO LONGER RESISTS A LOOK (fix-it interaction lane). It is what the page
  // says a view is worth: below T_LO the page tells you, once and quietly,
  // that nothing was photographed this way -- and turns anyway. It still
  // chooses the Best view's candidates and it is still reported.
  const T_LO = 0.68, T_HI = 0.80;
  // How close the camera may come to the surface (scene units): nearer, a
  // 360x640 keyframe is magnified past its resolution (the review's keyboard
  // and monitor close-ups), and the frame fills with one blurred patch of wall
  // that scores as fully supported. Resisted from D_SOFT, stopped at D_MIN.
  // Measured over 200 reachable views at D_MIN 0.55 / 0.8 / 1.0 / 1.25 / 1.5
  // (FRAMING.md §3), which chose 1.0 -- and 1.0 is, on a bedroom whose median
  // scene depth is 4.7, a fifth of the room. With the view-quality term gone
  // from movement this is the limit a forward push actually meets, so it is
  // back to 0.6: the blurred close-up is a MINOR complaint in the review and
  // being unable to cross the room is a blocking one.
  // (NAV is lifted out of this page and run on its own under node by the tests,
  // where there is no OPT; the default is the same one OPT carries.)
  const STANDOFF = (typeof OPT === "object" && OPT && OPT.standoff) || 0.6;
  const D_MIN = STANDOFF, D_SOFT = STANDOFF + 0.30;
  // CONTENT. A view that is drawn and empty is a failure at the product's bar,
  // and support rated a covered blank wall exactly as highly as the desk. Each
  // proxy sample carries how much TEXTURE the keyframes that saw it hold there
  // (`navInput`, from the sources' own local contrast), the field keeps it per
  // direction beside the coverage, and a view's content is the mean over its
  // rays.
  // Calibrated on the canonical world against the review's own measure: over
  // 260 views (40 walk poses, 20 look-arounds, 200 reachable), the field's
  // content correlates 0.58 with the mean |Laplacian| of the 900x700 capture,
  // and the cut that best reproduces that measure's "clean but empty" call is
  // content 0.19 (agreeing on 76.5%).
  // Content NEVER RESISTS ANYTHING now (fix-it interaction lane). It chooses
  // the Best view's candidates, and it is the one thing that may still move
  // the camera on its own: see C_SETTLE below.
  const C_LO = 0.13, C_HI = 0.28;
  // THE SETTLE. Left alone on a featureless view, the look eases toward
  // something to see -- at most C_DRIFT_MAX radians in total, never while a
  // finger is down, and NEVER after a look of the person's own. A deliberate
  // look stays exactly where it was put, for as long as it is left there; the
  // settle exists for a camera the PAGE placed (an opening, a walk step, the
  // Best view) that landed on nothing.
  const C_DRIFT_MAX = 0.30, C_DRIFT_RATE = 0.30, C_SETTLE = 0.60, C_GRAD_EPS = 0.30;
  // Where the content gradient is flat because there is no content anywhere
  // near, the settle asks the same question of COVERAGE, over a wider angle.
  const C_GRAD_WIDE = 0.60;
  // Resistance scales a worsening step by (1 - smooth(B_FREE, 1, b))^2: free
  // over the first part of the band, so a push in a good place is not sluggish.
  // Raised from 0.35: the only bounds left are the tube and the standoff, and
  // both are real edges, so there is no reason to be sluggish before one.
  const B_FREE = 0.55;
  const SPACING = 0.5, FACE = 8, CELLS = 6 * FACE * FACE;
  const JUMP = 2.0;                                   // a longer gap in the recorded path is not a corridor
  // Pitch is limited by the NECK, not by the capture: 80 degrees each way,
  // eased over the last PITCH_SOFT so the limit is a stop and not a wall. It
  // used to be the recorded walk's own pitch range plus 0.2 rad, which on this
  // world gave nine of sixteen poses under 7 degrees of upward look.
  const PITCH_MAX = 1.396, PITCH_SOFT = 0.2;
  const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
  const nrm = v => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0]/l, v[1]/l, v[2]/l]; };
  const crs = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];

  /* A direction's cell on a cube map (no trigonometry: this runs millions of times). */
  function cellOf(x, y, z){
    const ax = Math.abs(x), ay = Math.abs(y), az = Math.abs(z);
    let f, u, v, m;
    if (ax >= ay && ax >= az){ m = ax; f = x > 0 ? 0 : 1; u = y; v = z; }
    else if (ay >= az){ m = ay; f = y > 0 ? 2 : 3; u = x; v = z; }
    else { m = az; f = z > 0 ? 4 : 5; u = x; v = y; }
    if (!(m > 0)) return -1;
    const i = Math.min(FACE - 1, Math.floor((u / m + 1) * 0.5 * FACE));
    const j = Math.min(FACE - 1, Math.floor((v / m + 1) * 0.5 * FACE));
    return (f * FACE + j) * FACE + i;
  }
  /* How well a source at angle `ang` (radians, between its ray and the view's
     ray to the same point) colours it: 1 to 60 degrees, half by 80, none by 85
     -- the blend's own tail (FS_BLEND). */
  function angleWeight(ang){ return 1 - 0.5 * smooth(1.0472, 1.40, ang) - 0.5 * smooth(1.40, 1.48, ang); }

  /* The recorded walk: points, and the segments short enough to be walked. */
  function makePath(cams, up){
    const n = cams.length, P = new Float64Array(n * 3), ok = new Uint8Array(Math.max(0, n - 1));
    for (let i = 0; i < n; i++){ P[i*3] = cams[i][0]; P[i*3+1] = cams[i][1]; P[i*3+2] = cams[i][2]; }
    for (let i = 0; i + 1 < n; i++){
      const d = Math.hypot(P[i*3+3]-P[i*3], P[i*3+4]-P[i*3+1], P[i*3+5]-P[i*3+2]);
      ok[i] = d <= JUMP ? 1 : 0;
    }
    return {n, P, ok, up: nrm(up)};
  }
  /* Distance to the walk in envelope units (1 = the edge): across / R_MAX and
     along the vertical / V_MAX, with the nearest recorded pose. */
  function pathDist(path, p){
    const {n, P, ok, up} = path;
    const ux = up[0], uy = up[1], uz = up[2], ir2 = 1 / (R_MAX * R_MAX), iv2 = 1 / (V_MAX * V_MAX);
    let best = Infinity, bi = 0, bx = 0, by = 0, bz = 0;
    for (let i = 0; i < n; i++){
      const dx = p[0]-P[i*3], dy = p[1]-P[i*3+1], dz = p[2]-P[i*3+2], dv = dx*ux + dy*uy + dz*uz;
      const e2 = Math.max(0, dx*dx + dy*dy + dz*dz - dv*dv) * ir2 + dv * dv * iv2;
      if (e2 < best){ best = e2; bi = i; bx = P[i*3]; by = P[i*3+1]; bz = P[i*3+2]; }
    }
    for (let i = 0; i + 1 < n; i++){
      if (!ok[i]) continue;
      const ax = P[i*3], ay = P[i*3+1], az = P[i*3+2];
      const sx = P[i*3+3]-ax, sy = P[i*3+4]-ay, sz = P[i*3+5]-az, ss = sx*sx + sy*sy + sz*sz;
      if (ss <= 1e-12) continue;
      const t = ((p[0]-ax)*sx + (p[1]-ay)*sy + (p[2]-az)*sz) / ss;
      if (!(t > 0 && t < 1)) continue;
      const cx = ax + sx*t, cy = ay + sy*t, cz = az + sz*t;
      const dx = p[0]-cx, dy = p[1]-cy, dz = p[2]-cz, dv = dx*ux + dy*uy + dz*uz;
      const e2 = Math.max(0, dx*dx + dy*dy + dz*dz - dv*dv) * ir2 + dv * dv * iv2;
      if (e2 < best){ best = e2; bi = t < 0.5 ? i : i + 1; bx = cx; by = cy; bz = cz; }
    }
    return {e: Math.sqrt(best), index: bi, closest: best < Infinity ? [bx, by, bz] : null};
  }

  /* The support field. `input`: {samples: Float32Array (x,y,z)*N on the proxy,
     seenOff: Int32Array N+1 and seenIdx: Int32Array (CSR: the sources that saw
     each sample), centres: Float32Array (x,y,z) per source, path}. Built in
     slices (`fieldWork`) so the page stays interactive. */
  /* `spacing` defaults to SPACING. A COARSER field is the same field on a
     wider lattice: it costs an eighth of the work at twice the spacing and it
     answers the same question a little more bluntly, which is the right trade
     for the second or two before the real one exists (the page cannot say why
     a direction is dark until some field is built, and widening the tube
     doubled how long that takes). The page builds a coarse one first, uses it,
     and swaps in the fine one when it lands. */
  function fieldJob(input, spacing){
    const sp = spacing > 0 ? spacing : SPACING;
    const {path} = input, pad = R_MAX + sp;
    const lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
    for (let i = 0; i < path.n; i++) for (let k = 0; k < 3; k++){
      lo[k] = Math.min(lo[k], path.P[i*3+k] - pad); hi[k] = Math.max(hi[k], path.P[i*3+k] + pad);
    }
    const dims = [0, 1, 2].map(k => Math.max(1, Math.ceil((hi[k] - lo[k]) / sp) + 1));
    const index = new Int32Array(dims[0] * dims[1] * dims[2]).fill(-1);
    const where = [];
    for (let z = 0; z < dims[2]; z++) for (let y = 0; y < dims[1]; y++) for (let x = 0; x < dims[0]; x++){
      const p = [lo[0] + x * sp, lo[1] + y * sp, lo[2] + z * sp];
      if (!path.n || pathDist(path, p).e > 1 + sp * 1.2) continue;   // a margin for interpolation
      index[(z * dims[1] + y) * dims[0] + x] = where.length / 3;
      where.push(p[0], p[1], p[2]);
    }
    const count = where.length / 3;
    return {input, lo, dims, index, spacing: sp, where: Float32Array.from(where), count,
            cov: new Uint8Array(count * CELLS), dist: new Uint8Array(count * CELLS),
            con: new Uint8Array(count * CELLS), near: null,
            next: 0, done: count === 0};
  }
  function fieldWork(F, budget){
    const {samples, seenOff, seenIdx, seenQ, sampleQ, sampleC, centres} = F.input;
    const N = samples.length / 3;
    const front = new Float32Array(CELLS), who = new Int32Array(CELLS);
    const end = Math.min(F.count, F.next + budget);
    for (let a = F.next; a < end; a++){
      const px = F.where[a*3], py = F.where[a*3+1], pz = F.where[a*3+2];
      front.fill(Infinity); who.fill(-1);
      for (let s = 0; s < N; s++){
        const dx = samples[s*3] - px, dy = samples[s*3+1] - py, dz = samples[s*3+2] - pz;
        const d2 = dx*dx + dy*dy + dz*dz;
        if (d2 < 0.0025) continue;
        const c = cellOf(dx, dy, dz);
        if (c >= 0 && d2 < front[c]){ front[c] = d2; who[c] = s; }
      }
      const base = a * CELLS;
      for (let c = 0; c < CELLS; c++){
        const s = who[c];
        if (s < 0) continue;
        const X0 = samples[s*3], X1 = samples[s*3+1], X2 = samples[s*3+2];
        const d = Math.sqrt(front[c]);
        const vx = (px - X0) / d, vy = (py - X1) / d, vz = (pz - X2) / d;
        let best = 0;
        for (let j = seenOff[s]; j < seenOff[s + 1]; j++){
          const k = seenIdx[j];
          let cx = centres[k*3] - X0, cy = centres[k*3+1] - X1, cz = centres[k*3+2] - X2;
          const l = Math.hypot(cx, cy, cz) || 1;
          const w = angleWeight(Math.acos(Math.max(-1, Math.min(1, (cx*vx + cy*vy + cz*vz) / l))))
            * (seenQ ? seenQ[j] / 255 : 1);
          if (w > best){ best = w; if (best >= 1) break; }
        }
        if (sampleQ) best *= sampleQ[s] / 255;
        F.cov[base + c] = Math.round(best * 255);
        F.dist[base + c] = Math.min(255, Math.round(d * 16));
        F.con[base + c] = sampleC ? sampleC[s] : 0;
      }
    }
    F.next = end; F.done = end >= F.count;
    return F.done;
  }

  /* The rays of a view (camera space: right, up, forward), cached per shape. */
  const rayCache = new Map();
  function viewRays(fy, aspect){
    const key = fy.toFixed(3) + "/" + aspect.toFixed(3);
    if (rayCache.has(key)) return rayCache.get(key);
    const t = Math.tan(fy / 2), nx = 12, ny = 9, out = [];
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++){
      out.push([((i + 0.5) / nx * 2 - 1) * t * aspect, ((j + 0.5) / ny * 2 - 1) * t, 1]);
    }
    if (rayCache.size > 16) rayCache.clear();
    rayCache.set(key, out);
    return out;
  }
  /* Support of the view from `p` looking along `fwd`: the fraction of its rays
     a kept source colours (trilinear over the grid; outside the grid is 0), and
     the mean distance to what they land on. */
  function support(F, p, fwd, up, fy, aspect){
    if (!F || !F.done || !F.count) return {s: 0, dist: 0, c: 0};
    const f = nrm(fwd), r = nrm(crs(f, up)), u = crs(r, f);
    const rays = viewRays(fy, aspect), cells = new Int32Array(rays.length);
    for (let i = 0; i < rays.length; i++){
      const q = rays[i];
      cells[i] = cellOf(r[0]*q[0] + u[0]*q[1] + f[0], r[1]*q[0] + u[1]*q[1] + f[1], r[2]*q[0] + u[2]*q[1] + f[2]);
    }
    const g = [0, 1, 2].map(k => (p[k] - F.lo[k]) / (F.spacing || SPACING));
    const g0 = g.map(Math.floor), fr = g.map((v, k) => v - g0[k]);
    let s = 0, dsum = 0, dw = 0, cs2 = 0, cw = 0;
    for (let dz = 0; dz < 2; dz++) for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++){
      const w = (dx ? fr[0] : 1 - fr[0]) * (dy ? fr[1] : 1 - fr[1]) * (dz ? fr[2] : 1 - fr[2]);
      if (w <= 0) continue;
      const x = g0[0] + dx, y = g0[1] + dy, z = g0[2] + dz;
      if (x < 0 || y < 0 || z < 0 || x >= F.dims[0] || y >= F.dims[1] || z >= F.dims[2]) continue;
      const a = F.index[(z * F.dims[1] + y) * F.dims[0] + x];
      if (a < 0) continue;
      let cs = 0, ds = 0, dn = 0, con = 0;
      for (const c of cells){
        if (c < 0) continue;
        const v = F.cov[a * CELLS + c];
        cs += v;
        if (v > 0){ ds += F.dist[a * CELLS + c] / 16; dn++; if (F.con) con += F.con[a * CELLS + c] / 255; }
      }
      s += w * cs / 255 / cells.length;
      if (dn){ dsum += w * ds / dn; dw += w; cs2 += w * con / dn; cw += w; }
    }
    // Content is the mean over the rays that land on something: a view that is
    // half empty is judged on the half it shows, not diluted by the void, which
    // `s` already answers for.
    return {s, dist: dw ? dsum / dw : 0, c: cw ? cs2 / cw : 0};
  }
  /* How rich a view is, 0 (featureless) .. 1 (the desk), from its content. */
  function richness(c){ return smooth(C_LO, C_HI, c); }

  /* THE ORIENTATION RING: which way the glasses looked, from where you stand.
     A look is free now, and on a capture like this one a full turn is more than
     half black -- five consecutive 30-degree steps of nothing at all. That is
     the truth about the capture, but with nothing on screen it reads as a
     crash, so the page has to be able to say where the room IS while you are
     pointed away from it.
     `ringProfile` is the support of the view at `bins` headings on the horizon
     from one position -- the same `support` the rest of the page uses, at the
     same field of view, so the ring reports COVERAGE and only coverage. It
     never says there is something worth seeing; it says a photograph exists. */
  function ringProfile(F, p, V, bins){
    const n = Math.max(4, bins | 0), out = new Float32Array(n);
    if (!F || !F.done || !F.count) return out;
    for (let i = 0; i < n; i++)
      out[i] = support(F, p, V.dir(i * 2 * Math.PI / n, 0), V.up, V.fy, V.aspect).s;
    return out;
  }
  /* The nearest well-covered heading: the best supported one, discounted by how
     far you would have to turn to reach it, so a direction half a turn away has
     to be RING_TURN_PENALTY better supported than one at your elbow. The yaw is
     returned continuous with the one passed in, so a glide turns the short way.
     Null when nothing from here is covered at all -- there is no way back to
     offer, and the page must not invent one. */
  const RING_TURN_PENALTY = 0.25, RING_FLOOR = 0.06;
  function bestHeading(prof, yaw){
    const n = prof && prof.length;
    if (!n) return null;
    let best = null;
    for (let i = 0; i < n; i++){
      let d = i * 2 * Math.PI / n - yaw;
      d = Math.atan2(Math.sin(d), Math.cos(d));
      const score = prof[i] - RING_TURN_PENALTY * Math.abs(d) / Math.PI;
      if (!best || score > best.score) best = {yaw: yaw + d, delta: d, support: prof[i], score};
    }
    return best && best.support > RING_FLOOR ? best : null;
  }

  /* The distance from p to the nearest proxy sample, and how close that is to
     the limit, 0 (free) .. 1 (at D_MIN). A uniform hash grid over the samples,
     so this is a handful of cells rather than all 6,000 (the standoff is asked
     for at every sub-step of every move, and by the reachable sampler). */
  function sampleGrid(A){
    if (!A || !A.length) return null;
    const cell = 0.5, g = new Map();
    for (let i = 0; i < A.length; i += 3){
      const k = Math.floor(A[i]/cell) + "," + Math.floor(A[i+1]/cell) + "," + Math.floor(A[i+2]/cell);
      let v = g.get(k); if (!v){ v = []; g.set(k, v); }
      v.push(i);
    }
    return {cell, g, A};
  }
  function nearest(F, p){
    const S0 = F && F.input && F.input.samples;
    if (!S0) return Infinity;
    // rebuilt whenever the samples change, so a stale grid can never answer
    if (!F.near || F.near.A !== S0) F.near = sampleGrid(S0);
    const {cell, g, A} = F.near;
    const i0 = Math.floor(p[0]/cell), j0 = Math.floor(p[1]/cell), k0 = Math.floor(p[2]/cell);
    // widen until something is found or the ring is already past the answer
    let b = Infinity;
    for (let r = 0; r <= 12; r++){
      for (let a = -r; a <= r; a++) for (let bb = -r; bb <= r; bb++) for (let c = -r; c <= r; c++){
        if (r > 0 && Math.max(Math.abs(a), Math.abs(bb), Math.abs(c)) !== r) continue;
        const list = g.get((i0+a) + "," + (j0+bb) + "," + (k0+c));
        if (!list) continue;
        for (const i of list){
          const dx = A[i]-p[0], dy = A[i+1]-p[1], dz = A[i+2]-p[2], d2 = dx*dx + dy*dy + dz*dz;
          if (d2 < b) b = d2;
        }
      }
      if (b < Infinity && Math.sqrt(b) <= r * cell) break;
    }
    return Math.sqrt(b);
  }
  function closeBound(F, p){ return 1 - smooth(D_MIN, D_SOFT, nearest(F, p)); }
  /* How far past the soft edge a camera is, 0 (inside) .. 1 (at the limit). */
  function positionBound(e){ return smooth(R_SOFT / R_MAX, 1, e); }
  /* How far off the capture a view is, 0 (well covered) .. 1 (nothing was
     photographed this way). It no longer resists anything: it is what the page
     SAYS, and what a measurement reads. */
  function lookBound(s, floor){
    const hi = Math.min(T_HI, floor ?? 1), lo = Math.min(T_LO, hi - 0.06);
    return 1 - smooth(lo, hi, s);
  }
  /* HOW DARK a view is -- whether it is on ANYTHING, which is a different
     question from whether it is a GOOD view, and the page had been asking the
     second one and saying the first.
     Found 2026-09-20 (fix-it orient lane) while wiring the orientation cue:
     `dark` was `lookBound`, i.e. 1 below T_LO (0.68), and T_LO is the quality
     band -- the support at which 75% of views are "good" (drawn >= 0.9,
     blotch <= 2.5%, seam excess <= 8). On the canonical world that made
     `dark` exactly 1 at EIGHT of nine sampled recorded poses, including ones
     the page draws 99.4% of, and thirty frames of drag at the opening pose --
     97% drawn, the first thing anybody sees -- raised *Nothing was
     photographed this way* five times. A page that says that over a
     photograph of the room is not being careful, it is crying wolf, and the
     sentence stops meaning anything by the time it is true.
     DARK_LO / DARK_HI are the band for the question actually being asked,
     swept against the page's own `coverage()` over 200 reachable views
     (ORIENT.md section 2.3). Those 200 separate cleanly: every view that is
     at least 95% background has support at most 0.088, and every view that
     draws at least half the frame has support at least 0.183 -- an empty gap
     the old band sat far above. 0.07-0.25 puts the hint's own 0.9 crossing in
     the middle of that gap, so over the 200 the sentence is said over none of
     the 116 views that draw half the frame (the old band said it over 97 of
     them) and over all 24 that are essentially black. */
  const DARK_LO = 0.07, DARK_HI = 0.25;
  function darkness(s){ return 1 - smooth(DARK_LO, DARK_HI, s); }

  /* One frame of camera motion. `cam` {p, yaw, pitch, floor, aimed}; `ctl`
     {look: [dyaw, dpitch], move: [right, up, forward] (scene units, camera
     frame), held: a finger or key is down}; `V` {dir(yaw, pitch), up, fy,
     aspect}. Returns the next camera, how hard it was resisted (0..1), and how
     far off the capture the view it ends on is (`dark`).

     A LOOK IS NEVER RESISTED. Yaw is free through a full turn; pitch is free
     to the neck's limit. The capture's edge is shown, not enforced.
     A MOVE is resisted only by the tube and the standoff -- the two limits
     that are true about where a camera may stand. How good the view is from
     where you are going is not one of them: it was, and it is what turned a
     4.48-unit push into 0.94. */
  function step(F, path, cam, ctl, dt, V){
    const out = {p: cam.p.slice(), yaw: cam.yaw, pitch: cam.pitch, floor: cam.floor ?? 1,
                 cdrift: cam.cdrift || 0, aimed: !!cam.aimed, resisted: 0, hard: 0, dark: 0};
    const ready = !!(F && F.done && F.count);
    // The field says where the capture COVERS; it is not needed to know where
    // the camera may stand, so a finger is answered from the first frame (the
    // review: the page looked ready, answered buttons and ignored the finger).
    // `waiting` is reported, and nothing waits on it.
    out.waiting = !ready;
    const at = (p, yaw, pitch) => ready ? support(F, p, V.dir(yaw, pitch), V.up, V.fy, V.aspect)
                                        : {s: 1, dist: 0, c: 0};
    const posB = p => path && path.n ? positionBound(pathDist(path, p).e) : 0;
    const look = ctl.look || [0, 0], move = ctl.move || [0, 0, 0];
    const clampP = x => Math.max(-PITCH_MAX, Math.min(PITCH_MAX, x));
    const pitchB = x => smooth(PITCH_MAX - PITCH_SOFT, PITCH_MAX, Math.abs(x));
    // Large inputs (a fast flick, a slow frame) are taken in small sub-steps,
    // so the resistance feels the same whatever the frame rate.
    const resistOnce = (b0, b1, h1) => {
      if (b1 <= b0) return 1;
      out.resisted = Math.max(out.resisted, b1);
      out.hard = Math.max(out.hard || 0, h1 || 0);

    // evidence 0.5 -- routine where few sources saw a wall -- that is 1.94 and
    // the fog came out around 0.68 grey, BRIGHTER than the wall it was meant
    // to be a hole beside. That inverts the one thing a void must never do
    // (review 2, P-2).
    vec3 near = coarse.rgb;
    float lum = dot(near, vec3(0.299, 0.587, 0.114));
    base = mix(base, uFog * mix(vec3(lum), near, 0.1), nearby);
  }
  o = vec4(mix(background(), mix(base, ink, alpha), uShow), 1.0);
}`;

const FS_NOTHING = `#version 300 es
precision mediump float; out vec4 o; void main(){ o = vec4(0.0); }`;

/* Distance from the eye, packed into RGBA8: the probe the CPU reads to learn
   which surface points are on screen before choosing sources. */
const FS_PROBE = `#version 300 es
precision highp float;
uniform vec3 uEye; uniform float uFar; in vec3 vX; out vec4 o;
void main(){ float d = clamp(length(vX - uEye) / uFar, 0.0, 1.0) * 16777215.0;
  o = vec4(floor(d / 65536.0), mod(floor(d / 256.0), 256.0), mod(d, 256.0), 255.0) / 255.0; }`;

/* A keyframe's own view of the proxy: camera z, quantised to u16, rendered
   through that keyframe's intrinsics so texel (i, j) is pixel (i, j) of the
   image (the §4.2 convention: row 0 is the top). */
const VS_SOURCE = `#version 300 es
precision highp float;
in vec3 aQ;
uniform vec3 uLo; uniform vec3 uSpan; uniform mat3 uR; uniform vec3 uT;
uniform vec4 uIntr; uniform vec2 uWH; uniform vec2 uNF;
out float vZ;
void main(){
  vec3 p = uLo + aQ * uSpan; vec3 pc = uR * p + uT; vZ = pc.z;
  float n = uNF.x, f = uNF.y;
  gl_Position = vec4(2.0 * (uIntr.x * pc.x + uIntr.z * pc.z) / uWH.x - pc.z,
                     2.0 * (uIntr.y * pc.y + uIntr.w * pc.z) / uWH.y - pc.z,
                     (pc.z * (f + n) - 2.0 * f * n) / (f - n), pc.z);
}`;
const FS_SOURCE = `#version 300 es
precision highp float; precision highp int;
uniform float uZmax; in float vZ; out uvec4 o;
void main(){ o = uvec4(uint(clamp(vZ / uZmax, 0.0, 1.0) * 65534.0 + 0.5), 0u, 0u, 0u); }`;

/* 4x4 MIN pool: the nearest surface in a block wins, so a background point
   beside a foreground edge is rejected rather than painted with the edge. */
const VS_FULL = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID == 1) ? 3.0 : -1.0, (gl_VertexID == 2) ? 3.0 : -1.0);
  gl_Position = vec4(p, 0.0, 1.0); }`;
const FS_POOL = `#version 300 es
precision highp float; precision highp int; precision highp usampler2D;
uniform usampler2D uSrc; uniform ivec2 uSrcSize; out uvec4 o;
void main(){
  ivec2 b = ivec2(gl_FragCoord.xy) * 4; uint m = 65535u;
  for (int j = 0; j < 4; j++) for (int i = 0; i < 4; i++){
    ivec2 q = min(b + ivec2(i, j), uSrcSize - 1);
    m = min(m, texelFetch(uSrc, q, 0).r);
  }
  o = uvec4(m, 0u, 0u, 0u);
}`;

/* How much there is TO SEE in a keyframe, per 4x4 block of its own pixels: the
   standard deviation of luma over the block, over the pixels the artifact's
   alpha keeps (a redaction box is not content). This is the page's cheap stand
   -in for the review's "mean |Laplacian| over the drawn region": it is measured
   once per source, on the source's own pixels, and the navigation envelope
   carries it to every proxy sample and every direction (`navInput`). R is the
   contrast, G how much of the block was kept. */
const FS_DETAIL = `#version 300 es
precision highp float; precision highp sampler2DArray;
uniform sampler2DArray uCol; uniform int uLayer; uniform ivec2 uSrcSize; uniform float uScale;
out vec4 o;
void main(){
  ivec2 b = ivec2(gl_FragCoord.xy) * 4;
  float n = 0.0, m = 0.0, m2 = 0.0;
  for (int j = 0; j < 4; j++) for (int i = 0; i < 4; i++){
    ivec2 q = min(b + ivec2(i, j), uSrcSize - 1);
    vec4 c = texelFetch(uCol, ivec3(q, uLayer), 0);
    if (c.a < 0.5) continue;
    float y = dot(c.rgb, vec3(0.299, 0.587, 0.114));
    n += 1.0; m += y; m2 += y * y;
  }
  if (n < 4.0){ o = vec4(0.0, n / 16.0, 0.0, 1.0); return; }
  float sd = sqrt(max(0.0, m2 / n - (m / n) * (m / n)));
  o = vec4(clamp(sd * uScale, 0.0, 1.0), n / 16.0, 0.0, 1.0);
}`;

/* The blend. For every bound source: project; a confidence in [0, 1] that is
   the product of SOFT tests -- in frame (a border feather: uBorder source px
   for the weight, 20 px for the evidence), opaque in
   that source (the artifact's alpha, feathered inward from every mask:
   redaction, hands, disagreement), visible from that source (its depth, the
   test bilinear over the 2x2 depth blocks where the nearest block is in
   doubt), within 60 degrees of the viewing ray (fading from 46; a low tail
   to 85 for a source that did not see the surface edge-on, judged by the
   proxy's smooth vertex normal), and present (fading in or out of the chosen
   set). No test switches a source on or off between two neighbouring pixels,
   so neighbouring pixels never change sources abruptly.

   Weights: the k best penalties blend, with a softmax of the penalty
   (temperature uTemp) and a smooth cut just below the (k+1)-th penalty; a
   low-confidence sample is pushed down the ranking continuously. Then a robust
   CONSENSUS over the best few sources: a colour most of them agree on keeps
   its weight, a minority colour (a door that stood open in a few frames, an
   object moved during the walk) is down-weighted. Each sample is divided by
   its keyframe's photometric model: per-channel gain x exp(tilt . (xn, yn) +
   vignette(r2)) (WORLD-BUILDER-APPEARANCE.md §5.4).

   Measured and NOT kept (fix-it blotch lane, 16 views): down-weighting and
   blurring sources by the anisotropy of their projection (no measurable
   change in speckle, blotch or seam, and no visible change to the oblique
   smears), sharpening the weights toward the strongest source where sources
   disagree (the doubled phone stayed doubled; seam excess +1.4), and a
   visibility tolerance scaled by the source's incidence (no change in speckle;
   seam excess +0.5), and pulling the weights toward the keyframes nearest in the
   walk to the strongest one where sources disagree (the chair legs painted
   from two passes stayed two; seam excess +0.7 on 9 reviewer views).

   Output: the colour, with alpha = the evidence 1 - prod(1 - confidence), so
   a place every source masked fades to the background; the composite then
   softens the border with nothing drawn (above). Fading is only ever INWARD:
   no pixel beyond the evidence gains colour.
   UNSHADED: the images carry their own light; the surface normal is used only
   to judge how obliquely a source saw the surface, never as light.

   The same `shade` runs for the proxy's own fragments (FS_BLEND) and for a
   THIN CRACK in the proxy (FS_FILL): the phone proxy is decimated and filtered,
   and about a third of its edges are open, so a wall seen at a grazing angle
   shows its pinholes and cracks as black speckle. FS_FILL finds a pixel with
   no surface whose both sides, along a row or a column and within uFillR
   pixels, are the SAME plane (each side's slope predicts the other), places
   the point on that plane, and shades it exactly like the proxy: from real
   source pixels that see it, or not at all. A real void, an occluding edge or
   anything wider stays empty. */
const GLSL_SHADE = `
#define MAXC ${MAXC}
#define NS 7
#define TONE_CEILING 0.97
uniform sampler2DArray uCol; uniform usampler2DArray uDep;
uniform int uN; uniform int uK;
uniform float uLayer[MAXC]; uniform mat3 uR[MAXC]; uniform vec3 uT[MAXC];
uniform vec3 uC[MAXC]; uniform vec3 uGain[MAXC]; uniform vec2 uSlope[MAXC]; uniform vec4 uIntr[MAXC];
uniform float uQ[MAXC]; uniform float uPres[MAXC];
uniform vec2 uVig;
uniform vec2 uWH; uniform ivec2 uDWH; uniform float uZmax; uniform vec3 uEye;
uniform float uExposure; uniform float uGamma; uniform int uMode; uniform float uFar;
uniform float uTemp; uniform float uConsensus; uniform float uBorder; uniform float uKnee;
uniform float uConfLo; uniform float uConfHi; uniform float uConfOn;
${GLSL_BACKGROUND}
/* THE CONFIDENCE FADE (the geometry-confidence lane's recommendation, §7).
   The proxy carries one byte a vertex saying how well that vertex was measured
   -- the fusion's own see-through and disagreement counters, plus the level's
   own triangle shape. Where it is low the geometry is wrong and the blend tears
   real photographs over it: the fan-blade cross in the ceiling, the ridge beside
   it, the ragged third at the door. Those pixels are honest imagery on
   dishonest geometry, and the honest thing to draw there is what the page
   already draws where it knows nothing: the void.
   So the colour is mixed toward the void across a BAND, per fragment. Never a
   hard cut, and never transparent: the alpha is EVIDENCE, it is untouched, the
   depth still hides what is behind, and no pixel becomes see-through.
   uConfOn is 0 when the proxy carries no channel -- "unknown", which is not
   "confidence zero" -- and the fade does nothing at all. */
float gConf = 1.0;                 // the fragment's confidence; 1 where unknown
float confKeep(){
  return uConfOn > 0.5 ? smoothstep(uConfLo, uConfHi, gConf) : 1.0;
}
vec3 tone(vec3 x){
  // Hue-preserving highlight roll-off on the largest channel: linear to the
  // knee, then an exponential shoulder that approaches TONE_CEILING and never
  // reaches white, so a bright doorway keeps its gradation instead of clipping.
  float m = max(max(x.r, x.g), x.b);
  if (m <= uKnee) return x;
  float span = TONE_CEILING - uKnee;
  float y = uKnee + span * (1.0 - exp(-(m - uKnee) / span));
  return x * (y / m);
}
float depthZ(uint q){ return float(q) / 65534.0 * uZmax; }
float gTaps = 0.0;   // texture fetches this fragment (debug mode 5)
float visibility(float layer, float z, vec2 uv){
  vec2 dp = uv * 0.25;
  gTaps += 1.0;
  uint q0 = texelFetch(uDep, ivec3(min(ivec2(dp), uDWH - 1), int(layer)), 0).r;
  if (q0 < 65535u){
    float z0 = depthZ(q0);
    if ((z - z0 - 0.015) / max(z0, 1e-3) < 0.015) return 1.0;   // plainly the nearest surface
  }
  // In doubt (an occluding edge, or a block the source did not see): the test
  // itself, soft, interpolated over the 2x2 neighbouring depth blocks.
  vec2 p = dp - 0.5; vec2 fl = floor(p); vec2 f = p - fl; ivec2 b0 = ivec2(fl);
  float v = 0.0;
  gTaps += 4.0;
  for (int j = 0; j < 2; j++) for (int i = 0; i < 2; i++){
    ivec2 tt = clamp(b0 + ivec2(i, j), ivec2(0), uDWH - 1);
    uint q = texelFetch(uDep, ivec3(tt, int(layer)), 0).r;
    if (q >= 65535u) continue;
    float zs = depthZ(q);
    float vv = 1.0 - smoothstep(0.015, 0.045, (z - zs - 0.015) / max(zs, 1e-3));
    v += vv * (i == 0 ? 1.0 - f.x : f.x) * (j == 0 ? 1.0 - f.y : f.y);
  }
  return v;
}
float cdist(vec3 a, vec3 b){
  // colour difference relative to brightness: exposure noise is small, a door
  // against a wall is large
  return length(a - b) / (0.08 + 0.5 * (dot(a, vec3(0.3333)) + dot(b, vec3(0.3333))));
}
void shade(vec3 P, vec3 N, out vec4 o){
  vec3 dv = uEye - P; float distv = max(length(dv), 1e-6); dv /= distv;
  vec3 facing = N;
  float pen[MAXC]; float conf[MAXC]; vec3 col[MAXC]; float sat[MAXC];
  int n = 0; float pmin = 1e9; float miss = 1.0;
  float dAll = 1.0, dNoMask = 1.0, dNoVis = 1.0, dNoTail = 1.0;
  for (int i = 0; i < uN; i++){
    pen[i] = -1.0;
    if (uPres[i] <= 0.0) continue;
    vec3 pc = uR[i] * P + uT[i];
    if (pc.z < 0.02) continue;
    vec2 uv = vec2(uIntr[i].x * pc.x / pc.z + uIntr[i].z, uIntr[i].y * pc.y / pc.z + uIntr[i].w);
    float e = min(min(uv.x, uWH.x - uv.x), min(uv.y, uWH.y - uv.y));
    float bf = smoothstep(0.5, uBorder, e);
    if (bf <= 0.0) continue;
    vec3 ds = uC[i] - P; float dists = length(ds); ds /= max(dists, 1e-6);
    float ang = acos(clamp(dot(ds, dv), -1.0, 1.0));
    // Weight: full to 46 degrees, fading by 60, then a low TAIL out to 85, so
    // a surface only an oblique source saw is still drawn from it (the tail
    // loses to any source within 60 degrees through the penalty's softmax).
    // the tail only for a source that saw the surface from well off its plane
    float cosI = abs(dot(facing, ds));
    float edgeOn = smoothstep(0.12, 0.35, cosI);
    float tail = mix(1.0, edgeOn, smoothstep(1.0, 1.1, ang));
    float aw = max(1.0 - smoothstep(0.80, 1.0472, ang), 0.08 * (1.0 - smoothstep(1.30, 1.48, ang)) * tail);
    if (uMode >= 6){
      // attribution: the evidence this pixel would have without one test
      vec4 cD = texture(uCol, vec3(uv / uWH, uLayer[i]));
      float aD = clamp((cD.a - 0.02) / 0.96, 0.0, 1.0);
      float fD = 1.0 - smoothstep(1.40, 1.48, ang);
      float visD = fD > 0.0 ? visibility(uLayer[i], pc.z, uv) : 0.0;
      float g0 = smoothstep(0.5, 20.0, e) * fD * uPres[i];
      dAll *= 1.0 - g0;
      dNoMask *= 1.0 - g0 * visD * tail;
      dNoVis *= 1.0 - g0 * aD * tail;
      dNoTail *= 1.0 - g0 * aD * visD;
    }
    if (aw <= 0.0) continue;
    vec4 c = texture(uCol, vec3(uv / uWH, uLayer[i]));
    gTaps += 1.0;
    float a = clamp((c.a - 0.02) / 0.96, 0.0, 1.0);
    if (a <= 0.0) continue;
    float vis = visibility(uLayer[i], pc.z, uv);
    if (vis <= 0.0) continue;
    vec2 h = 0.5 * uWH; vec2 q = (uv - h) / h;
    float r2 = dot(uv - h, uv - h) / dot(h, h);
    vec3 g = uGain[i] * exp(dot(uSlope[i], q) + uVig.x * r2 + uVig.y * r2 * r2);
    col[i] = c.rgb / max(g, vec3(1e-3));
    sat[i] = max(max(c.r, c.g), c.b) > 0.975 ? 1.0 : 0.0;
    conf[i] = a * bf * vis * aw * uPres[i];
    float lc = 1.0 - conf[i];
    // Evidence says only that the source SAW the point: its angle lowers the
    // weight (aw) but not the evidence, except in the last 5 degrees to 85.
    float ev = a * smoothstep(0.5, 20.0, e) * vis * (1.0 - smoothstep(1.40, 1.48, ang)) * tail * uPres[i];
    pen[i] = ang + 0.15 * min(max(dists / distv - 1.0, 0.0), 3.0) + 0.10 * (1.0 - uQ[i])
           + 2.0 * lc * lc * lc;
    pmin = min(pmin, pen[i]);
    miss *= 1.0 - ev;
    n++;
  }
  // the NS smallest penalties, in order
  float s[NS];
  for (int j = 0; j < NS; j++) s[j] = 1e9;
  for (int i = 0; i < uN; i++){
    if (pen[i] < 0.0) continue;
    float p = pen[i];
    for (int j = 0; j < NS; j++){ if (p < s[j]){ float t = s[j]; s[j] = p; p = t; } }
  }
  int k = min(uK, NS - 2);
  float thr = (n > k) ? s[k] : 1e9;
  float vthr = (n > k + 2) ? s[k + 2] : 1e9;
  float w[MAXC]; float v[MAXC];
  float wmax = 0.0;
  for (int i = 0; i < uN; i++){
    w[i] = 0.0; v[i] = 0.0;
    if (pen[i] < 0.0) continue;
    float soft = exp(-(pen[i] - pmin) / uTemp);
    if (pen[i] < thr) w[i] = conf[i] * soft * smoothstep(0.0, 0.08, thr - pen[i]) * (sat[i] > 0.5 ? 0.3 : 1.0);
    if (pen[i] < vthr) v[i] = conf[i] * exp(-(pen[i] - pmin) / (3.0 * uTemp)) * smoothstep(0.0, 0.08, vthr - pen[i]);
    wmax = max(wmax, w[i]);
  }
  // Consensus: a soft medoid of the voters, then weights by agreement with it.
  vec3 m0 = vec3(0.0); float mw = 0.0;
  if (uConsensus > 0.0){
    for (int j = 0; j < uN; j++){
      if (v[j] <= 0.0) continue;
      float D = 0.0, V = 0.0;
      for (int i = 0; i < uN; i++){ if (v[i] <= 0.0) continue; D += v[i] * min(cdist(col[i], col[j]), 2.0); V += v[i]; }
      float sw = v[j] * exp(-4.0 * D / max(V, 1e-6));
      m0 += sw * col[j]; mw += sw;
    }
  }
  bool robust = mw > 1e-6;
  if (robust) m0 /= mw;
  vec3 acc = vec3(0.0); float ws = 0.0; int used = 0; int top = -1; float btop = 0.0;
  for (int i = 0; i < uN; i++){
    if (w[i] <= 0.0 && v[i] <= 0.0) continue;
    float b = w[i];
    if (robust){
      float d = cdist(col[i], m0) / 0.35;
      b = (w[i] + 0.05 * wmax * v[i]) * mix(1.0, 1.0 / (1.0 + d * d), uConsensus);
    }
    if (b <= 0.0) continue;
    if (b > btop){ btop = b; top = i; }
    acc += b * col[i]; ws += b; used++;
  }
  bool observed = ws > 1e-7;
  float alpha = observed ? 1.0 - miss : 0.0;
  if (uMode == 1){ float t = float(used) / float(max(uK + 2, 1));
    o = vec4(observed ? vec3(t, t, 1.0 - t) : vec3(0.55, 0.0, 0.0), 1.0); return; }
  if (uMode == 2){ o = vec4(observed ? vec3(1.0) : vec3(1.0, 0.0, 0.0), 1.0); return; }
  if (uMode == 3){
    float d = clamp(distv / uFar, 0.0, 1.0) * 65535.0;
    o = vec4(alpha, floor(d / 256.0) / 255.0, mod(d, 256.0) / 255.0, 1.0); return;
  }
  if (uMode == 5){ o = vec4(gTaps / 255.0, float(uN) / 255.0, 0.0, 1.0); return; }
  if (uMode == 4){ o = vec4(observed ? float(int(uLayer[top]) + 1) / 255.0 : 0.0, 0.0, 0.0, 1.0); return; }
  if (uMode == 6){ o = vec4(alpha, 1.0 - dNoTail, 1.0 - dNoVis, 1.0); return; }
  if (uMode == 7){ o = vec4(1.0 - dNoMask, 1.0 - dAll, observed ? 1.0 : 0.0, 1.0); return; }
  // 11: what the confidence fade TAKES. R = the drawn area it removes
  // (alpha x 1 - keep), G = the drawn area, so a measurement reads the faded
  // share of what is drawn straight off the two sums.
  if (uMode == 11){ o = vec4(alpha * (1.0 - confKeep()), alpha, gConf, 1.0); return; }
  if (uMode == 8){ o = vec4(observed ? mix(background(), pow(tone(max(acc / ws, 0.0) * uExposure), vec3(1.0 / uGamma)), confKeep()) : vec3(1.0, 0.0, 1.0), 1.0); return; }
  // The layer: colour and evidence. Proxy no kept image covers is alpha 0:
  // drawn exactly as "nothing" (the background), while its depth still hides
  // what is behind it.
  if (!observed){ o = vec4(0.0); return; }
  vec3 c = pow(tone(max(acc / ws, 0.0) * uExposure), vec3(1.0 / uGamma));
  // where the geometry under the photograph is not trusted, the photograph
  // gives way to the void -- across the band, never at a step
  c = mix(background(), c, confKeep());
  // PREMULTIPLIED. The composite divides it straight back out for the pixel's
  // own colour, so nothing about the drawn room changes -- but the layer's MIP
  // CHAIN, which the void fog reads, is then the mean of what is actually
  // INKED nearby rather than the mean of colours weighted by nothing. This is
  // what WORLD-BUILDER-APPEARANCE.md 3 already requires of any mip a client
  // builds ("must be premultiplied: sum(rgb*a) / sum(a)"), and it is the only
  // way the fog can be bounded by its surroundings: unpremultiplied, a wall
  // one frame barely saw carries full colour at evidence 0.03, and a fog
  // derived from it was six times brighter than the wall itself (review 2,
  // P-2).
  o = vec4(c * alpha, alpha);
}`;
const FS_BLEND = `#version 300 es
precision highp float; precision highp int;
precision highp sampler2DArray; precision highp usampler2DArray;
${GLSL_SHADE}
in vec3 vX; in vec3 vN; in float vConf; out vec4 o;
void main(){
  // the smooth vertex normal where the proxy carries one, else the facet's
  vec3 N = length(vN) > 0.2 ? normalize(vN) : cross(dFdx(vX), dFdy(vX));
  if (length(N) < 1e-12) N = uEye - vX;
  gConf = vConf;                 // interpolated across the triangle
  shade(vX, normalize(N), o);
  if (uMode == 10) o = vec4(0.0, 1.0, 0.0, 1.0);
}`;
const FS_FILL = `#version 300 es
precision highp float; precision highp int;
precision highp sampler2DArray; precision highp usampler2DArray;
${GLSL_SHADE}
uniform highp sampler2D uDepthT; uniform mat4 uInvVP; uniform ivec2 uSize; uniform vec2 uNF; uniform int uFillR;
out vec4 o;
float dAt(ivec2 q){
  if (q.x < 0 || q.y < 0 || q.x >= uSize.x || q.y >= uSize.y) return 1.0;
  return texelFetch(uDepthT, q, 0).r;
}
float lin(float d){ return uNF.x * uNF.y / max(uNF.y - d * (uNF.y - uNF.x), 1e-9); }
vec3 unproj(vec2 pix, float d){
  vec4 h = uInvVP * vec4(pix / vec2(uSize) * 2.0 - 1.0, d * 2.0 - 1.0, 1.0);
  return h.xyz / h.w;
}
/* A thin gap along one axis: the nearest surface pixel on each side within
   uFillR, two surface pixels deep on each side, and the two sides one plane
   (window depth is linear across a plane in screen space, so each side's
   slope must predict the other side to 3% of the distance). */
bool across(ivec2 p, ivec2 ax, out float d, out float gap, out vec3 A, out vec3 B, out int ia, out int ib){
  int a = 0, b = 0; ia = 0; ib = 0;
  for (int k = 1; k <= 8; k++){
    if (k > uFillR) break;
    if (a == 0 && dAt(p - ax * k) < 1.0) a = k;
    if (b == 0 && dAt(p + ax * k) < 1.0) b = k;
    if (a > 0 && b > 0) break;
  }
  d = 1.0; gap = 1e9; A = vec3(0.0); B = vec3(0.0);
  if (a == 0 || b == 0) return false;
  float da = dAt(p - ax * a), da2 = dAt(p - ax * (a + 1));
  float db = dAt(p + ax * b), db2 = dAt(p + ax * (b + 1));
  if (da2 >= 1.0 || db2 >= 1.0) return false;
  float span = float(a + b);
  float pa = da + (da - da2) * span, pb = db + (db - db2) * span;
