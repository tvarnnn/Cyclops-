      L.depthReady = true;
    }
    S.cpuDepthBytes = layers.filter(x => x.cpuDepth).length * CW * CH * 3;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.deleteFramebuffer(fbSrc); gl.deleteFramebuffer(fbDst); gl.deleteFramebuffer(fbDet);
    gl.deleteTexture(tex); gl.deleteTexture(detTex); gl.deleteRenderbuffer(rb);
    S.timing.sourceDepthMs = (S.timing.sourceDepthMs || 0) + performance.now() - t;
  }

  /* One depth pass at a time. Three upload workers run concurrently and each
     asks for this after its chunk lands; while it was synchronous they could
     not interleave, and now that it yields they could -- two passes sharing
     one set of framebuffer bindings would corrupt both. The list is computed
     inside, at the moment the pass actually starts, so a layer an earlier pass
     already measured is not measured twice. */
  let depthChain = Promise.resolve();
  function renderPendingSourceDepth(){
    const p = depthChain.then(
      () => renderSourceDepth(layers.filter(x => x.ready && !x.depthReady)));
    depthChain = p.catch(() => {});
    return p;
  }

  /* -------- loading and live append ------------------------------------- */
  const R = CONFIG.routes;
  function chooseEncoding(man){ return ENC.choose(man, {astc: !!ext, forceWebp: OPT.forceWebp}); }
  function phoneKeyframes(man){ return ENC.phoneKeyframes(man, encoding); }

  async function uploadSlot(chunk, slot, L){
    // The texture array's shape is frozen at the FIRST manifest (`KW`/`KH`),
    // and a chunk carries its own. A mismatch is an INVALID_VALUE that leaves
    // the layer holding its OLD pixels while it is marked ready, and the only
    // trace is a lumped "GL error N after upload" long afterwards -- a page
    // silently drawing the wrong room (review 2, P-10). Probably unreachable,
    // since both derive from the session's camera; two lines to be sure.
    if (chunk.w !== KW || chunk.h !== KH)
      throw new Error("an image bundle is " + chunk.w + "x" + chunk.h
                      + ", not this session's " + KW + "x" + KH);
    const bytes = chunk.slots[slot];
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D_ARRAY, G.col);
    if (encoding === "astc-6x6-rgba"){
      if (chunk.encoding !== 1) throw new Error("expected an ASTC chunk");
      gl.compressedTexSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, L.index, KW, KH, 1, 0x93B4, bytes);
    } else {
      if (chunk.encoding !== 2) throw new Error("expected a WebP chunk");
      const bmp = await createImageBitmap(new Blob([bytes], {type: "image/webp"}),
                                          {premultiplyAlpha: "none", colorSpaceConversion: "none"});
      if (!G) { bmp.close(); return; }
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D_ARRAY, G.col);
      gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
      gl.texSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, L.index, KW, KH, 1, gl.RGBA, gl.UNSIGNED_BYTE, bmp);
      bmp.close();
    }
  }

  function samePose(a, b){
    if (!a || !b) return false;
    for (let i = 0; i < 9; i++) if (a.rotation[i] !== b.rotation[i]) return false;
    for (let i = 0; i < 3; i++) if (a.translation[i] !== b.translation[i]) return false;
    return true;
  }

  /* Bring the layers in line with a manifest. The camera is never touched. */
  async function applyManifest(man, generation){
    if (!man || man.format !== "wb-appearance-keyframes/1") throw new Error("the appearance manifest is not in a format this page reads");
    const first = !manifest;
    pendingVignette = (man.exposure && Array.isArray(man.exposure.vignette)) ? man.exposure.vignette : null;
    let proxyChanged = !mesh || !manifest || manifest.proxy.digest !== man.proxy.digest;
    if (first){
      encoding = chooseEncoding(man);
      KW = man.camera.width; KH = man.camera.height;
      const cf = man.camera;
      if (cf.fx > 0 && cf.fy > 0) KT = {v: KH / 2 / cf.fy, h: KW / 2 / cf.fx};
      DW = Math.ceil(KW / 4); DH = Math.ceil(KH / 4);
      capacity = ENC.capacity(man, encoding, {
        astc: CONFIG.astc_layer_cap || 192, rgba8: CONFIG.rgba8_layer_cap || 48,
        maxLayers: S.gl.maxLayers,
      });
      S.encoding = encoding; S.capacity = capacity;
    }
    if (proxyChanged){
      status("Loading the room's surface…");
      const buf = await fetchBytes(R.proxy + man.proxy.digest, "the proxy surface");
      if (generation !== loadGeneration) return;
      mesh = decodeMesh(buf);
      // Which colour byte, if any, is the geometry confidence. A proxy built
      // before the channel existed, or with it off, sends three zero bytes:
      // `present: false` must be read as "nothing is known", never as
      // "confidence zero", or the page would fade the whole room away.
      const cfd = man.proxy.confidence;
      confChannel = (cfd && cfd.present === true && (cfd.version ?? 1) === 1)
        ? ({r: 0, g: 1, b: 2}[String(cfd.channel || "r").toLowerCase()] ?? null) : null;
      uploadMesh();
      if (first) allocateLayers();
      for (const L of layers) L.depthReady = false;
    }
    const wanted = phoneKeyframes(man).slice(0, capacity);
    // The PHONE tier only. Counting the Tower tier here made the caption read
    // "128 of 374" about a set of 128 the phone was ever offered, which reads
    // as two thirds thrown away rather than as the whole phone budget.
    S.keyframesInManifest = phoneKeyframes(man).length;
    S.keyframesInTowerTier = (man.keyframes || []).length;
    const wantedIds = new Set(wanted.map(k => k.id));
    // Free layers whose keyframe left the phone tier.
    for (const L of layers){ if (L.id && !wantedIds.has(L.id)){ L.id = null; L.ready = false; L.kf = null; } }
    while (layers.length < capacity) layers.push({index: layers.length, id: null, ready: false, depthReady: false});
    const byId = new Map(layers.filter(L => L.id).map(L => [L.id, L]));
    const uploads = [];                 // [layer, keyframe, chunk ref]
    for (const kf of wanted){
      const ref = kf.chunks[encoding];
      let L = byId.get(kf.id);
      if (L && L.digest === ref.digest && L.slot === ref.slot){
        // Same bytes. New pose or gain are uniforms; a moved pose needs depth.
        if (!samePose(L.kf, kf)) L.depthReady = false;
        L.kf = kf;
        continue;
      }
      if (!L){ L = layers.find(x => !x.id); if (!L) break; L.id = kf.id; L.ready = false; L.depthReady = false; }
      uploads.push([L, kf, ref]);
    }
    // Group by chunk, fetch a few at a time, draw as layers land.
    const groups = new Map();
    for (const u of uploads){ const d = u[2].digest; if (!groups.has(d)) groups.set(d, []); groups.get(d).push(u); }
    const queue = [...groups.entries()];
    let done = 0;
    const total = uploads.length;
    const worker = async () => {
      while (queue.length){
        const [digest, items] = queue.shift();
        const buf = await fetchBytes(R.chunk + digest, "an image bundle");
        if (generation !== loadGeneration || !G) return;
        const chunk = decodeChunk(buf);
        for (const [L, kf, ref] of items){
          if (L.id !== kf.id) continue;
          await uploadSlot(chunk, ref.slot, L);
          if (generation !== loadGeneration || !G) return;
          // A layer's CONTENT is measured from its own pixels, so a new image in
          // the same slot must be measured again, not only a moved camera.
          if (!samePose(L.kf, kf) || L.digest !== ref.digest) L.depthReady = false;
          L.kf = kf; L.digest = ref.digest; L.slot = ref.slot; L.ready = true;
          done++;
        }
        await renderPendingSourceDepth();
        if (generation !== loadGeneration || !G) return;
        S.layers = layers.filter(x => x.ready).length;
        chosenFor = null;
        status(total ? "Placing images " + done + " / " + total : "");
        requestDraw();
      }
    };
    await Promise.all([worker(), worker(), worker()]);
    if (generation !== loadGeneration || !G) return;
    await renderPendingSourceDepth();
    if (generation !== loadGeneration || !G) return;
    const glErr = gl.getError();
    if (glErr !== gl.NO_ERROR) S.errors.push("GL error " + glErr + " after upload");
    manifest = man;
    chosenFor = null;
    S.buildId = man.build_id; S.layers = layers.filter(x => x.ready).length;
    if (S.phase === "ready" || S.phase === "withdrawn") buildNav();
    gpuTotal();
    status("");
    updateCaption();
    requestDraw();
  }

  let loadGeneration = 0;
  let pendingVignette = null;   // the photometric model of the manifest being applied
  let chosen = [], chosenFor = null;
  /* Presence: every source bound to the blend fades in when it is chosen and
     out when it is dropped, so a changed choice crossfades instead of popping.
     layer -> {p: 0..1, target: 0|1}. */
  const active = new Map();
  let clockMs = null, lastFrameT = 0;
  let shownAt = null;           // when the opening first drew (the fade-in)
  function setChosen(next, instant){
    const want = new Set(next);
    for (const [L, e] of active){ if (!want.has(L)){ if (instant) active.delete(L); else e.target = 0; } }
    for (const L of next){
      const e = active.get(L);
      if (!e) active.set(L, {p: instant ? 1 : 0, target: 1});
      else { e.target = 1; if (instant) e.p = 1; }
    }
  }
  function updatePresence(dt){
    let moving = false;
    const step = dt / Math.max(1, OPT.fadeMs);
    for (const [L, e] of active){
      if (!L.ready){ active.delete(L); continue; }
      e.p = e.target ? Math.min(1, e.p + step) : Math.max(0, e.p - step);
      if (!e.target && e.p <= 0){ active.delete(L); continue; }
      if (e.p !== e.target) moving = true;
    }
    return moving;
  }
  function bound(){
    const on = chosen.filter(L => active.has(L)).map(L => ({L, p: active.get(L).p}));
    const off = [...active].filter(([, e]) => !e.target).map(([L, e]) => ({L, p: e.p}))
      .sort((a, b) => b.p - a.p);
    return on.concat(off).slice(0, MAXC);
  }
  let busy = Promise.resolve();
  function serial(fn){ const p = busy.then(fn, fn); busy = p.catch(() => {}); return p; }

  /* Bring the page to the manifest the Tower serves NOW. Always a fresh fetch
     of the manifest, so the Tower's redaction check runs again (boot, a new
     build, a restored context). A build under another epoch drops what is on
     screen first (FOLLOW.mustReplace). A chunk or proxy that 404s -- the next
     build published while this one loaded and the file left its grace --
     refetches the manifest and tries once more (review 1, M4). */
  async function loadRevision(revision){
    for (let attempt = 0; ; attempt++){
      const gen0 = loadGeneration;
      const man = await fetchJSON(R.manifest, "the appearance manifest");
      if (gen0 !== loadGeneration) return;
      if (FOLLOW.mustReplace(manifest, man)) clearTextures();
      const gen = loadGeneration;
      try {
        await applyManifest(man, gen);
      } catch (e){
        if (e && e.absent && attempt === 0){
          S.refetches = (S.refetches || 0) + 1;
          loadGeneration++;          // the first attempt's workers stop at their next check
          continue;
        }
        throw e;
      }
      if (gen !== loadGeneration) return;
      S.revision = revision || S.revision;
      S.epoch = man.epoch || null;
      return;
    }
  }

  /* Free every texture and forget which keyframe is where; the page, the
     camera and the proxy mesh stay. The next manifest is applied as a first. */
  function clearTextures(){
    loadGeneration++;
    if (G && G.col){ gl.deleteTexture(G.col); gl.deleteTexture(G.dep); G.col = null; G.dep = null; }
    layers.length = 0;
    active.clear(); chosen = []; chosenFor = null;
    manifest = null; S.layers = 0; S.gpu.colour = 0; S.gpu.depth = 0; gpuTotal();
  }

  /* The imagery was withdrawn (a changed redaction record, a purge, a world
     that is gone): the textures go, now, and the page says why rather than
     showing old images. NOT terminal: the page keeps asking, and a rebuild
     that is served again is drawn again. */
  function dropAppearance(reason){
    clearTextures();
    S.phase = "withdrawn"; S.drops = (S.drops || 0) + 1; S.revision = null; S.epoch = null;
    holdingSince = null;
    const m = $("msg"); m.textContent = reason; m.classList.add("on");
    status("");
  }

  /* -------- following new appearance builds (no reload, no camera reset) - */
  let pollDelay = FOLLOW.BASE_MS;
  let holdingSince = null;       // when `rebuilding` was first seen, while it lasts
  async function pollOnce(){
    if (!G) return {action: "none", live: null};      // a lost context restores first
    let poll;
    try { poll = {ok: await fetchJSON(R.revision, "the render revision")}; }
    catch (e){ poll = e && e.absent ? {absent: e.message} : {error: String(e && e.message || e)}; }
    const r = FOLLOW.decide(poll, {revision: S.revision, holdingSince, now: Date.now()});
    S.lastAction = r.action;
    const a = (poll.ok && poll.ok.appearance) || {};
    if (r.action === "hold"){
      if (holdingSince === null) holdingSince = Date.now();
      S.holding = true;
      updateCaption();
      return r;
    }
    holdingSince = null; S.holding = false;
    if (r.action === "drop"){
      if (S.phase !== "withdrawn" || manifest) dropAppearance(r.reason);
      return r;
    }
    if (r.action === "load"){
      CONFIG.current = !!a.current;
      const before = S.revision;
      await loadRevision(r.revision);
      if (S.revision !== before) S.appends++;
      if (S.layers && S.phase === "withdrawn"){
        $("msg").classList.remove("on");
        // A page that never had an opening pose (the M-0 boot) finishes
        // booting here; one that had its textures taken away and given back
        // keeps the camera exactly where the reader left it.
        if (shownAt === null) await finishOpening();
        else { S.phase = "ready"; requestDraw(); }
      }
      updateCaption();
      return r;
    }
    if (a.current !== undefined) CONFIG.current = !!a.current;
    updateCaption();
    return r;
  }
  async function follow(){
    for (;;){
      await new Promise(res => setTimeout(res, pollDelay));
      if (S.phase === "failed") return;
      let r;
      try { r = await serial(pollOnce); } catch (e){ S.errors.push(String(e && e.message || e)); r = {action: "none", live: null}; }
      pollDelay = FOLLOW.nextDelay(r, pollDelay);
    }
  }
  S.refresh = () => serial(pollOnce);

  /* -------- camera: a free camera inside the capture envelope (NAV) ------- */
  /* One camera, {p, yaw, pitch}, levelled to UP. The recorded walk is where it
     starts and what prev/next glide along; look and move are free inside the
     envelope NAV describes. Stepping between recorded poses GLIDES (eased, the
     short way round) instead of jumping: the walkthrough's worst flicker steps
     were path jumps. */
  let ci = 0, opening = -1;
  let override = null;          // verification: an exact camera
  let B = null;
  let cam = {p: [0, 0, 0], yaw: 0, pitch: 0, floor: 1};
  let glideState = null;        // {from, to, t, ms, index}
  let navPath = null, navField = null, navJob = null, navGeneration = 0, overviewPose = null;
  // whether the field in hand is the fine one (the Best view's candidates are
  // its lattice points, and a coarse lattice does not hold enough of them)
  let navFine = false;
  const ctl = {look: [0, 0], move: [0, 0, 0], held: false};
  const vel = {look: [0, 0], move: [0, 0, 0]};   // inertia, per ms
  const keys = new Set();
  function basis(){
    const ref = Math.abs(UP[0]) < 0.9 ? [1,0,0] : [0,0,1];
    const e1 = norm3(cross3(UP, ref)), e2 = cross3(e1, UP);
    B = {e1, e2};
  }
  function dirFrom(yaw, pitch){
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    return norm3([cp*(Math.cos(yaw)*B.e1[0] + Math.sin(yaw)*B.e2[0]) + sp*UP[0],
                  cp*(Math.cos(yaw)*B.e1[1] + Math.sin(yaw)*B.e2[1]) + sp*UP[1],
                  cp*(Math.cos(yaw)*B.e1[2] + Math.sin(yaw)*B.e2[2]) + sp*UP[2]]);
  }
  function yawPitchOf(d){
    d = norm3(d);
    return {yaw: Math.atan2(dot3(d, B.e2), dot3(d, B.e1)),
            pitch: Math.asin(Math.max(-1, Math.min(1, dot3(d, UP))))};
  }
  function poseOf(i, yaw = 0, pitch = 0){
    if (!cams.length){
      const yp = {yaw: 0.6, pitch: -0.35}, d = dirFrom(yp.yaw, yp.pitch);
      return {p: [centre[0]-d[0]*diag*0.9, centre[1]-d[1]*diag*0.9, centre[2]-d[2]*diag*0.9], yaw: yp.yaw, pitch: yp.pitch};
    }
    const c = cams[Math.max(0, Math.min(cams.length-1, i))];
    const yp = yawPitchOf([c[3],c[4],c[5]]);
    return {p: [c[0], c[1], c[2]], yaw: yp.yaw + yaw,
            pitch: Math.max(-NAV.PITCH_MAX, Math.min(NAV.PITCH_MAX, yp.pitch + pitch))};
  }
  function currentCamera(aspectOverride){
    const aspect = aspectOverride || canvas.width / Math.max(1, canvas.height);
    if (override){
      return {eye: override.eye, at: override.target, up: override.up, fy: override.fovY, aspect,
              near: 0.02, far: diag * 12};
    }
    const d = dirFrom(cam.yaw, cam.pitch), eye = cam.p.slice();
    return {eye, at: [eye[0]+d[0], eye[1]+d[1], eye[2]+d[2]], fy: viewFovY(aspect), aspect,
            near: Math.max(0.02, diag * 0.0015), far: diag * 12};
  }
  /* The display field of view is the CAPTURE's frame plus a MARGIN: no taller
     than OPT.viewMarginV times a keyframe's vertical tangent and no wider than
     OPT.viewMargin times its horizontal one. The first page drew 72 degrees
     vertical in landscape (~85 horizontal) and 97 in portrait -- twice what
     any photo framed -- and that margin is where the black, the speckle and
     the oblique smears lived. Cutting it to the keyframe exactly (margin 1.25,
     which in landscape is width-limited and in portrait is the keyframe's own
     vertical) took the damage out and left a viewfinder so tight that 61% of
     reachable views were a clean, well-lit, empty wall (FINAL2 §7).
     Measured here over the 40 walk poses + 20 look-arounds at 900x700, margin
     1.0 / 1.15 / 1.25 / 1.4 / 1.6: drawn 98.2 / 97.5 / 96.9 / 95.9 / 94.3%
     (walk), speckle 0.093 / 0.124 / 0.144 / 0.168 / 0.207%, blotch 1.25 / 1.45
     / 1.55 / 1.70 / 1.88%, detail 5.17 / 5.80 / 6.40 / 7.16 / 8.01, featureless
     30 / 20 / 20 / 17.5 / 12.5%. 1.6 buys the most content and breaks 13 of the
     61 shots by more than 5 points of drawn (walk060 -15, walk070 -16: the
     ragged torn band at the door frame comes back); 1.4 breaks two, by 7.
     FOV_MAX caps both tangents so no canvas shape can make the frame look like
     a fisheye whatever the margin is. */
  const FOV_MAX_V = 1.48, FOV_MAX_H = 1.75;          // 85 and 100 degrees
  function viewFovY(aspect){
    if (!KT) return Math.min(1.75, Math.max(1.25, 2 * Math.atan(Math.tan(1.12 / 2) / aspect)));
    const t = Math.min(OPT.viewMarginV * KT.v, OPT.viewMargin * KT.h / aspect,
                       Math.tan(FOV_MAX_V / 2), Math.tan(FOV_MAX_H / 2) / aspect);
    return 2 * Math.atan(t);
  }
  function navView(){
    const c = currentCamera();
    return {dir: dirFrom, up: UP, fy: c.fy, aspect: c.aspect};
  }
  /* The pitch the recorded walk looked at. It used to be the LIMIT on looking
     up and down (plus 0.2 rad each way), which on this world left nine of
     sixteen poses with under 7 degrees of upward look. The limit is now the
     neck's (NAV.PITCH_MAX); this is kept because a measurement wants to know
     where the capture's own pitch ended, and it is reported, not enforced. */
  let pitchRange = [-NAV.PITCH_MAX, NAV.PITCH_MAX];
  function recordedPitch(){
    if (!cams.length) return;
    let lo = Infinity, hi = -Infinity;
    for (const c of cams){ const p = yawPitchOf([c[3], c[4], c[5]]).pitch; lo = Math.min(lo, p); hi = Math.max(hi, p); }
    pitchRange = [lo, hi];
    S.pitchRange = pitchRange;
    S.pitchLimit = [-NAV.PITCH_MAX, NAV.PITCH_MAX];
  }
  function supportOf(pose){
    if (!navField || !navField.done) return null;
    const V = navView();
    return NAV.support(navField, pose.p, dirFrom(pose.yaw, pose.pitch), UP, V.fy, V.aspect);
  }
  /* Arriving at a recorded pose: its own support is the floor, so a partly
     dark recorded view is never "beyond" and never pushed away. */
  function floorAt(pose){
    const s = supportOf(pose);
    return s && s.s < NAV.T_HI ? Math.max(0.05, s.s) : 1;
  }
  function setPose(pose){
    override = null; glideState = null;
    cam = {p: pose.p.slice(), yaw: pose.yaw, pitch: pose.pitch, floor: 1};
    cam.floor = floorAt(cam);
    vel.look = [0, 0]; vel.move = [0, 0, 0];
  }
  function glideTo(pose, index){
    override = null;
    const from = {p: cam.p.slice(), yaw: cam.yaw, pitch: cam.pitch};
    glideState = {from, to: pose, t: 0, ms: NAV.glideMs(from, pose), index};
    vel.look = [0, 0]; vel.move = [0, 0, 0];
    requestDraw();
  }
  /* The hint: subtle, and gone a moment after. Two things it says, and they
     are different things. The EDGE hint is for a push the envelope resisted --
     there is a limit there and the page enforces it. The DARK hint is for a
     look that has turned off the capture: nothing is enforced, the turn
     happened, and this only says why the room went dark. */
  const HINT_EDGE = "Not captured beyond here";
  const HINT_DARK = "Nothing was photographed this way";
  let hintTimer = null, hintSaid = 0;
  function hint(level, text){
    if (level < 0.35) return;
    const h = $("hint");
    h.textContent = text || HINT_EDGE;
    h.style.opacity = String(Math.min(0.9, 0.3 + level));
    S.hints = (S.hints || 0) + 1;
    S.lastHint = h.textContent;
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => { h.style.opacity = "0"; }, 1100);
  }
  /* -------- the orientation ring, and the way back ----------------------- */
  /* The profile is the support of the view at RING_BINS headings on the
     horizon FROM ONE POSITION, so it is recomputed only when the camera has
     actually moved (turning on the spot does not change it -- the ring just
     rotates). One profile is RING_BINS calls to `support`, about 1 ms on
     SwiftShader, which is why it is not per frame.

     Everything here reads the pose that is DRAWN, not `cam`: a verification
     hook can pin an exact camera (`S.setView`), and a compass that keeps
     pointing where `cam` happens to be while the screen shows somewhere else
     is worse than no compass. On a phone `override` is always null and the
     two are the same object. */
  const RING_BINS = 36, RING_MOVE = 0.22;
  let ringProf = null, ringAt = null, ringFor = null;
  function shownPose(){
    if (!override) return cam;
    const d = norm3([override.target[0] - override.eye[0], override.target[1] - override.eye[1],
                     override.target[2] - override.eye[2]]);
    const yp = yawPitchOf(d);
    return {p: override.eye.slice(), yaw: yp.yaw, pitch: yp.pitch};
  }
  function updateRing(force){
    if (!navField || !navField.done){ ringProf = null; ringAt = null; ringFor = null; return; }
    const at = shownPose().p;
    if (!force && ringProf && ringFor === navField && ringAt
        && Math.hypot(at[0]-ringAt[0], at[1]-ringAt[1], at[2]-ringAt[2]) < RING_MOVE) return;
    const t = performance.now();
    ringProf = NAV.ringProfile(navField, at, navView(), RING_BINS);
    ringAt = at.slice(); ringFor = navField;
    // "covered" is bins the page would not call dark, which is the question
    // the ring answers. T_LO is the QUALITY band and on some worlds -- this

    gl.uniform3fv(P.u.uT, U3a); gl.uniform3fv(P.u.uC, U3b); gl.uniform3fv(P.u.uGain, U3c);
    gl.uniform4fv(P.u.uIntr, U4); gl.uniform1fv(P.u.uQ, UQ);
    gl.uniform2f(P.u.uWH, KW, KH); gl.uniform2i(P.u.uDWH, DW, DH);
    gl.uniform1f(P.u.uZmax, zmax); gl.uniform3f(P.u.uEye, cam.eye[0], cam.eye[1], cam.eye[2]);
    gl.uniform1f(P.u.uExposure, OPT.exposure); gl.uniform1f(P.u.uGamma, OPT.gamma);
    gl.uniform1i(P.u.uMode, mode);
    gl.uniform1f(P.u.uFar, zmax * 3);
  }
  function blendPass(cam, MVP, list, mode, lay, w, h, dpr){
    gl.bindFramebuffer(gl.FRAMEBUFFER, lay.fb1); gl.viewport(0, 0, w, h);
    gl.clearColor(0, 0, 0, mode === 0 ? 0 : 1);
    gl.depthMask(true); gl.colorMask(true, true, true, true);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    if (!mesh) return;
    gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LESS);
    gl.colorMask(false, false, false, false);
    gl.useProgram(G.view.p); meshUniforms(G.view); gl.uniformMatrix4fv(G.view.u.uMVP, false, MVP);
    drawMesh();
    gl.colorMask(true, true, true, true); gl.depthFunc(gl.LEQUAL); gl.depthMask(false);
    const P = G.blend;
    gl.useProgram(P.p);
    shadeUniforms(P, cam, list, mode, w, h);
    gl.uniformMatrix4fv(P.u.uMVP, false, MVP);
    drawMesh();
    gl.depthMask(true); gl.depthFunc(gl.LESS);
    const fillR = Math.min(8, Math.round(OPT.fillPx * dpr));
    if (fillR > 0){
      // thin cracks in the proxy: the same shading at the plane across them
      gl.bindFramebuffer(gl.FRAMEBUFFER, lay.fb3); gl.viewport(0, 0, w, h);
      gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
      gl.bindVertexArray(null);
      const F = G.fill;
      gl.useProgram(F.p);
      shadeUniforms(F, cam, list, mode, w, h);
      gl.activeTexture(gl.TEXTURE5); gl.bindTexture(gl.TEXTURE_2D, lay.dt);
      gl.uniform1i(F.u.uDepthT, 5);
      gl.uniformMatrix4fv(F.u.uInvVP, false, M.inv(MVP));
      gl.uniform2i(F.u.uSize, w, h); gl.uniform2f(F.u.uNF, cam.near, cam.far);
      gl.uniform1i(F.u.uFillR, fillR);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.activeTexture(gl.TEXTURE5); gl.bindTexture(gl.TEXTURE_2D, null);
      gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  let pending = false, asyncProbe = null;
  function requestDraw(){
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => { pending = false; frame(); });
  }
  /* The probe is read back ASYNCHRONOUSLY on the phone: a synchronous
     readPixels stalls the GPU every drag frame. The frame draws with the
     previous choice and redraws once the new one is known. */
  function startAsyncProbe(cam, MVP){
    if (asyncProbe) return true;
    if (G.noAsync || typeof gl.fenceSync !== "function") return false;
    renderProbe(cam, MVP);
    if (!G.pbo){ G.pbo = gl.createBuffer(); gl.bindBuffer(gl.PIXEL_PACK_BUFFER, G.pbo);
                 gl.bufferData(gl.PIXEL_PACK_BUFFER, G.probeW * G.probeH * 4, gl.STREAM_READ); }
    gl.bindBuffer(gl.PIXEL_PACK_BUFFER, G.pbo);
    gl.readPixels(0, 0, G.probeW, G.probeH, gl.RGBA, gl.UNSIGNED_BYTE, 0);
    gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    const sync = gl.fenceSync(gl.SYNC_FENCE, 0);
    if (!sync){
      // Some implementations (SwiftShader here) refuse sync objects: read
      // synchronously from now on.
      gl.getError(); G.noAsync = true; return false;
    }
    asyncProbe = {sync, cam, key: camKey(cam)};
    const poll = () => {
      if (!G || !asyncProbe) return;
      const st = gl.clientWaitSync(asyncProbe.sync, 0, 0);
      if (st === gl.TIMEOUT_EXPIRED){ setTimeout(poll, 4); return; }
      if (st === gl.WAIT_FAILED){ gl.deleteSync(asyncProbe.sync); asyncProbe = null; return; }
      gl.deleteSync(asyncProbe.sync);
      const px = new Uint8Array(G.probeW * G.probeH * 4);
      gl.bindBuffer(gl.PIXEL_PACK_BUFFER, G.pbo);
      gl.getBufferSubData(gl.PIXEL_PACK_BUFFER, 0, px);
      gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
      const probe = asyncProbe; asyncProbe = null;
      const next = choose(probe.cam, probePoints(probe.cam, px));
      const changed = next.length !== chosen.length || next.some((L, i) => L !== chosen[i]);
      chosen = next; chosenFor = probe.key; setChosen(next, !active.size);
      if (changed || camKey(currentCamera()) !== probe.key) requestDraw();
    };
    setTimeout(poll, 0);
    return true;
  }
  function camKey(cam){ return [...cam.eye, ...cam.at, cam.fy, cam.aspect].map(v => v.toFixed(4)).join(","); }
  function chooseSync(cam, MVP, sticky = true){
    renderProbe(cam, MVP);
    const px = new Uint8Array(G.probeW * G.probeH * 4);
    gl.readPixels(0, 0, G.probeW, G.probeH, gl.RGBA, gl.UNSIGNED_BYTE, px);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return choose(cam, probePoints(cam, px), sticky);
  }
  function frame(sync){
    if (!G || gl.isContextLost() || !mesh || !G.col) return;
    // nothing is drawn until the opening pose is chosen; then it fades in
    if (shownAt === null) return;
    resize();
    const now = performance.now();
    const dt = clockMs !== null ? clockMs : (lastFrameT ? Math.min(100, now - lastFrameT) : 0);
    lastFrameT = now;
    // Under a verification clock only the verification's own frames advance
    // time; the page's animation frames just redraw.
    const tick = clockMs !== null && !sync ? 0 : dt;
    const navMoving = tick > 0 || clockMs === null ? navUpdate(tick) : false;
    const cam = currentCamera(), MVP = matrices(cam), key = camKey(cam);
    // A verification hook without a clock asks for the settled picture.
    const instant = (sync && clockMs === null) || !active.size;
    if (sync || !chosen.length){ chosen = chooseSync(cam, MVP); chosenFor = key; setChosen(chosen, instant); }
    else if (chosenFor !== key && !startAsyncProbe(cam, MVP)){
      chosen = chooseSync(cam, MVP); chosenFor = key; setChosen(chosen, instant);
    }
    const fading = updatePresence(tick);
    drawBlend(cam, MVP, bound());
    if ((fading || navMoving) && !sync) requestDraw();
    // The orientation cue, after the camera for this frame is final. The ring
    // itself is recomputed only when the camera has MOVED; what happens every
    // frame is one `support` for the view in front of you and a 58 px 2D draw.
    updateRing();
    const dk = currentDark();
    S.dark = dk;
    updateBack(dk);
    drawCompass();
    S.choice = chosen.map(L => L.kf && L.kf.ki);
    S.bound = bound().map(({L, p}) => [L.kf && L.kf.ki, +p.toFixed(3)]);
    $("pos").textContent = !override && cams.length ? (ci + 1) + " / " + cams.length : "";
    if (S.timing.firstFrameMs === undefined && S.layers > 0) S.timing.firstFrameMs = performance.now() - T0;
  }

  /* How much of a small render of `cam`, at the canvas's own aspect, is DRAWN:
     the mean of the evidence alpha, and the
     mean viewing distance of what is drawn. */
  function drawnFraction(cam, w, h, content, wantFaded){
    const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, w, h);
    const rb = gl.createRenderbuffer(); gl.bindRenderbuffer(gl.RENDERBUFFER, rb);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
    const fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, rb);
    const MVP = matrices(cam);
    const picks = chooseSync(cam, MVP, false).map(L => ({L, p: 1}));
    drawBlend(cam, MVP, picks, 3, {fb, w, h});
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    const px = new Uint8Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
    // optionally how much there is to see: the spread of the drawn colour, and
    // its DETAIL -- the mean |Laplacian| of luma over the drawn part, which is
    // the review's own measure (FINAL2 §5) at this small size. Spread cannot
    // tell a bright door beside a dark wall (high spread, nothing in it) from
    // the desk; the Laplacian can, so the scores below use `detail`.
    let spread = 0, detail = 0;
    if (content){
      drawBlend(cam, MVP, picks, 8, {fb, w, h});
      gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
      const col = new Uint8Array(w * h * 4);
      gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, col);
      const Y = new Float32Array(w * h);
      let n = 0, m = 0, m2 = 0;
      for (let i = 0, k = 0; i < col.length; i += 4, k++){
        Y[k] = (0.299 * col[i] + 0.587 * col[i+1] + 0.114 * col[i+2]) / 255;
        if (px[i] < 128) continue;
        n++; m += Y[k]; m2 += Y[k] * Y[k];
      }
      if (n) spread = Math.sqrt(Math.max(0, m2 / n - (m / n) * (m / n)));
      // one pixel in from the drawn edge, so the hard step at a void's rim is
      // not counted as detail
      let dn = 0, ds = 0;
      for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++){
        const k = y * w + x, o = k * 4;
        if (px[o] < 128 || px[o - 4] < 128 || px[o + 4] < 128
            || px[o - w * 4] < 128 || px[o + w * 4] < 128) continue;
        ds += Math.abs(4 * Y[k] - Y[k-1] - Y[k+1] - Y[k-w] - Y[k+w]);
        dn++;
      }
      detail = dn ? ds / dn : 0;
    }
    // How much of what this view draws the confidence fade takes: mode 11
    // writes the removed area in R and the drawn area in G, so the share is
    // the ratio of the two sums -- the same "alpha-weighted area actually
    // removed" the confidence lane predicted, measured on the real render.
    let faded = 0;
    if (wantFaded){
      drawBlend(cam, MVP, picks, 11, {fb, w, h});
      gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
      const fp = new Uint8Array(w * h * 4);
      gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, fp);
      let took = 0, all = 0;
      for (let i = 0; i < fp.length; i += 4){ took += fp[i]; all += fp[i+1]; }
      faded = all > 0 ? took / all : 0;
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.deleteFramebuffer(fb); gl.deleteTexture(tex); gl.deleteRenderbuffer(rb);
    let drawn = 0, dsum = 0;
    const far = zmax * 3, dists = [];
    for (let i = 0; i < px.length; i += 4){
      const a = px[i] / 255;
      if (a <= 0) continue;
      const d = (px[i+1] * 256 + px[i+2]) / 65535 * far;
      drawn += a; dsum += a * d;
      if (a > 0.5) dists.push(d);
    }
    // How much of the ROOM a view holds: the 10-90 spread of the distance to
    // what it draws. A close-up of one shelf sits at ONE distance however far
    // the camera is from it; a view of the room runs from the near furniture to
    // the far wall. Drawn, mean distance and detail all liked the shelf.
    let depthSpread = 0;
    if (dists.length > 20){
      dists.sort((a, b) => a - b);
      depthSpread = dists[Math.floor(dists.length * 0.9)] - dists[Math.floor(dists.length * 0.1)];
    }
    return {drawn: drawn / (w * h), distance: drawn > 0 ? dsum / drawn : 0, spread, detail,
            depthSpread, faded};
  }
  /* The opening view: the recorded pose whose rendered frame is most DRAWN and
     has the most IN it. Drawn alone opened the page on poses that were 100%
     drawn and featureless; the detail term is what separates the desk from a
     clean wall, and it is deliberately the larger of the two shaping terms.
     Scored at the canvas's real aspect; coarse over the walk, then refined
     around the best.

     Two numbers, both measured (FRAMING.md §4): EMPTY_DETAIL is the cut at
     which this small render reproduces the review's "clean but empty" call --
     0.0574, agreeing on 90.4% of 260 views, correlation 0.876 with the offline
     measure on the full 900x700 frame. DETAIL_REF is what a good room view of
     this world measures (the walk poses' median), so the score's ramp spans
     "nothing" to "the desk" rather than saturating at the first pose. */
  const EMPTY_DETAIL = 0.0574, DETAIL_REF = 0.12;
  function detailTerm(d){ return Math.max(0, Math.min(1, d / DETAIL_REF)); }
  function openingScore(r){
    const ref = CONFIG.median_scene_depth || diag * 0.25;
    const wide = Math.max(0, Math.min(1, r.distance / (2.5 * ref)));
    return r.drawn * (0.85 + 0.15 * wide) * (0.35 + 0.65 * detailTerm(r.detail || 0));
  }
  /* Sliced for the same reason as `renderSourceDepth` (review 2, P-3): each
     `score` is a small render plus a synchronous readback, and the thirty-odd
     of them measured 2.9 s of unbroken main thread on SwiftShader -- the
     single largest block in the whole boot. Nothing is drawn while it runs
     (`frame` returns before `drawBlend` until `shownAt` is set), so yielding
     costs nothing and cannot show the reader the scoring camera. */
  const OPENING_SLICE_MS = 12;
  async function chooseOpening(){
    if (!cams.length) return -1;
    const t = performance.now();
    const aspect = canvas.width / Math.max(1, canvas.height) || 390 / 844;
    const w = aspect >= 1 ? 64 : Math.max(24, Math.round(64 * aspect));
    const h = aspect >= 1 ? Math.max(24, Math.round(64 / aspect)) : 64;
    const step = Math.max(1, Math.ceil(cams.length / 32));
    const saveCam = cam, saveOverride = override;
    override = null;
    const seen = new Map();
    let sliceStart = performance.now();
    const score = async i => {
      if (!seen.has(i)){
        if (performance.now() - sliceStart > OPENING_SLICE_MS){
          await new Promise(res => setTimeout(res, 0));
          sliceStart = performance.now();
        }
        const q = poseOf(i); cam = {p: q.p, yaw: q.yaw, pitch: q.pitch, floor: 1};
        const r = drawnFraction(currentCamera(aspect), w, h, true);
        seen.set(i, {score: openingScore(r), drawn: r.drawn, distance: r.distance, detail: r.detail});
      }
      return seen.get(i).score;
    };
    let best = -1, bestScore = -1;
    for (let i = 0; i < cams.length; i += step){ const s = await score(i); if (s > bestScore){ bestScore = s; best = i; } }
    const fine = Math.max(1, Math.round(step / 3));
    for (let i = Math.max(0, best - step + fine); i <= Math.min(cams.length - 1, best + step - fine); i += fine){
      const s = await score(i); if (s > bestScore){ bestScore = s; best = i; }
    }
    cam = saveCam; override = saveOverride;
    S.timing.openingMs = performance.now() - t;
    const b = seen.get(best) || {};
    if (poseQ.length !== cams.length){ poseQ = new Array(cams.length).fill(-1); poseC = new Array(cams.length).fill(-1); }
    for (const [k, v] of seen){ poseQ[k] = v.drawn; poseC[k] = v.detail || 0; }
    S.opening = {index: best, step, fine, tested: seen.size, score: bestScore,
                 drawn: b.drawn, distance: b.distance, detail: b.detail, size: [w, h]};
    return best;
  }

  /* -------- context loss ---------------------------------------------------- */
  /* WebKit often never fires `webglcontextrestored` after a real loss (review 1,
     m8). So: ask for the context back after RESTORE_ASK_MS, and reload the page
     after RESTORE_RELOAD_MS -- the app lets exactly this page reload itself
     (WORLD-BUILDER-IOS.md §10) -- rather than sit on "Restoring…" for good. */
  /* The reload is a WATCHDOG, not a one-shot (review 2, P-1). It used to be
     cancelled by the FIRST statement of `webglcontextrestored`, before
     `buildGL()` and before the manifest and every chunk were fetched again --
     so the whole restore, the slowest and least reliable thing this page does,
     ran with no escape hatch at all. Now `webglcontextrestored` re-arms it and
     only a restore that actually finished clears it: whatever goes wrong in
     between, the page reloads instead of sitting on "Restoring…". The app
     allows exactly this navigation (WORLD-BUILDER-IOS.md §10), and bounds how
     many times. */
  const RESTORE_ASK_MS = 3000, RESTORE_RELOAD_MS = 10000, RESTORE_FINISH_MS = 90000;
  let restoreTimers = [];
  let restoring = false;         // between the loss and a restore that finished
  function clearRestoreTimers(){ for (const t of restoreTimers) clearTimeout(t); restoreTimers = []; }
  function armReloadWatchdog(ms){
    restoreTimers.push(setTimeout(() => {
      if (!restoring) return;    // the restore finished, or ended in a message
      S.reloadRequested = true;
      location.reload();
    }, ms));
  }
  /* The page is usable again, however it got there: by drawing, or by saying
     truthfully that there is nothing to draw. Either way it is not stuck. */
  function restoreSettled(){ restoring = false; clearRestoreTimers(); }
  canvas.addEventListener("webglcontextlost", e => {
    e.preventDefault();
    S.contextLosses++;
    loadGeneration++;
    G = null; asyncProbe = null; chosen = []; active.clear();
    for (const L of layers){ L.ready = false; L.depthReady = false; L.digest = null; }
    S.layers = 0;
    const m = $("msg");
    m.textContent = "The graphics context was taken away (usually memory pressure). Restoring…";
    m.classList.add("on");
    restoring = true;
    clearRestoreTimers();
    restoreTimers.push(setTimeout(() => {
      // Asked on the CURRENT context's extension. `loseExt` used to be cached
      // across contexts (`loseExt = loseExt || ...`) while `buildGL` refetched
      // everything else, so a second loss asked a dead object (review 2, P-5).
      try { if (loseExt) loseExt.restoreContext(); } catch (_) { /* not lost any more, or not allowed */ }
    }, RESTORE_ASK_MS));
    armReloadWatchdog(RESTORE_RELOAD_MS);
  }, false);
  canvas.addEventListener("webglcontextrestored", () => {
    // The 10 s reload is replaced by a LONGER one, not cancelled: the restore
    // below fetches the manifest and every chunk again, which is exactly where
    // it can hang, and cancelling here left it with no escape (review 2, P-1).
    clearRestoreTimers();
    armReloadWatchdog(RESTORE_FINISH_MS);
    // Imagery is not kept in page memory, and neither is the MANIFEST: it is
    // fetched again, through the same transport and the same redaction check
    // (a label changed or a purge while the context was gone is honoured, and
    // so is a build that published meanwhile), and the camera stays where it
    // was. Reapplying the old in-page manifest skipped that check and 404ed on
    // every chunk a newer build had replaced (review 1, M4 and M5).
    manifest = null;
    layers.length = 0;
    serial(async () => {
      try {
        buildGL();
        await loadRevision(S.revision);
        if (S.phase !== "withdrawn") $("msg").classList.remove("on");
        restoreSettled();
        requestDraw();
      } catch (e){
        if (e && e.absent){
          dropAppearance("These images are no longer served for this world (its redaction record "
                         + "changed, or its imagery was removed). This view will show them again if "
                         + "they are rebuilt.");
          restoreSettled();
          return;
        }
        fail("The graphics context came back but the images could not be placed again: " + e.message);
        restoreSettled();
      }
    });
  }, false);

  /* -------- input ------------------------------------------------------------ */
  /* Touch: one finger drags the look, two fingers drag to move sideways and
     up/down (the room follows the fingers), pinch moves forward and back.
     Desktop (debug): left drag looks, right or shift drag moves, the wheel
     moves forward/back, W A S D Q E fly, arrow keys step the walk, O overview.
     Every input goes through NAV.step, and motion coasts after release. */
  const pts = new Map();
  let gesture = null, lastMoveT = 0, mouseMove = false;
  function two(){ const v = [...pts.values()];
    return {d: Math.hypot(v[0].x-v[1].x, v[0].y-v[1].y), x:(v[0].x+v[1].x)/2, y:(v[0].y+v[1].y)/2}; }
  const MOVE_PER_PX = 0.004, PINCH_UNITS = 2.0;
  function lookPerPx(){ return currentCamera().fy / Math.max(1, canvas.clientHeight); }
  function feel(look, move, now){
    // input this frame, and a running estimate of its velocity for the coast
    const ms = Math.max(8, Math.min(60, now - lastMoveT)); lastMoveT = now;
    for (let i = 0; i < 2; i++){ ctl.look[i] += look[i]; vel.look[i] = 0.5 * vel.look[i] + 0.5 * look[i] / ms; }
    for (let i = 0; i < 3; i++){ ctl.move[i] += move[i]; vel.move[i] = 0.5 * vel.move[i] + 0.5 * move[i] / ms; }
  }
  function interrupt(){ glideState = null; }
  canvas.addEventListener("pointerdown", e => {
    try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* synthetic */ }
    pts.set(e.pointerId, {x: e.clientX, y: e.clientY});
    gesture = pts.size >= 2 ? two() : null;
    mouseMove = e.pointerType === "mouse" && (e.button === 2 || e.shiftKey);
    ctl.held = true; vel.look = [0, 0]; vel.move = [0, 0, 0]; lastMoveT = performance.now();
    if (glideState) interrupt();
    override = null;
    e.preventDefault();
  }, {passive: false});
  canvas.addEventListener("pointermove", e => {
    const p = pts.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    const now = performance.now();
    if (pts.size === 1 && !mouseMove){
      const k = lookPerPx();
      feel([-dx * k, dy * k], [0, 0, 0], now);      // the room follows the finger
    } else if (pts.size === 1 && mouseMove){
      feel([0, 0], [-dx * MOVE_PER_PX, dy * MOVE_PER_PX, 0], now);
    } else if (pts.size >= 2 && gesture){
      const g = two();
      feel([0, 0], [-(g.x - gesture.x) * MOVE_PER_PX, (g.y - gesture.y) * MOVE_PER_PX,
                    Math.log(Math.max(1, g.d) / Math.max(1, gesture.d)) * PINCH_UNITS], now);
      gesture = g;
    }
    requestDraw(); e.preventDefault();
  }, {passive: false});
  function up(e){
    pts.delete(e.pointerId); gesture = pts.size >= 2 ? two() : null;
    if (!pts.size){
      ctl.held = false; mouseMove = false;
      if (performance.now() - lastMoveT > 90){ vel.look = [0, 0]; vel.move = [0, 0, 0]; }   // a pause is not a flick
    }
    requestDraw();
  }
  canvas.addEventListener("pointerup", up);
  canvas.addEventListener("pointercancel", up);
  canvas.addEventListener("lostpointercapture", up);
  canvas.addEventListener("contextmenu", e => e.preventDefault());
  canvas.addEventListener("touchmove", e => e.preventDefault(), {passive: false});
  for (const n of ["gesturestart", "gesturechange", "gestureend"])
    document.addEventListener(n, e => e.preventDefault(), {passive: false});
  canvas.addEventListener("wheel", e => {
    if (glideState) interrupt();
    override = null;
    ctl.move[2] += -e.deltaY * 0.0025;
    requestDraw(); e.preventDefault();
  }, {passive: false});
  addEventListener("keydown", e => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (k === "ArrowRight") step(1); else if (k === "ArrowLeft") step(-1);
    else if (k === "o") overview();
    else if ("wasdqe".includes(k) && k.length === 1){ if (glideState) interrupt(); override = null; keys.add(k); requestDraw(); }
  });
  addEventListener("keyup", e => { keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key); });
  addEventListener("blur", () => { keys.clear(); ctl.held = false; pts.clear(); });

  /* Prev/next walk only through recorded poses that render well: a pose whose
     drawn fraction (the opening's measure, at this canvas) is below POSE_MIN
     is skipped (review: 35 of 198 poses under 70% drawn, 59-94 half black). */
  /* A pose is worth arriving at when it renders well (POSE_MIN of the frame
     drawn) and there is something in it (POSE_CONTENT of a room view's detail).
     Skipping is capped at NAV.MAX_SKIP in one press -- see NAV.nextPose. */
  const POSE_MIN = 0.8, POSE_CONTENT = EMPTY_DETAIL;
  function step(d){
    if (!cams.length) return;
    const r = NAV.nextPose(poseQ, ci, d, POSE_MIN, poseC, POSE_CONTENT);
    if (r.index === ci){ hint(0.6); return; }
    S.lastStep = {from: ci, to: r.index, skipped: r.skipped, capped: r.capped};
    glideTo(poseOf(r.index), r.index); ci = r.index;
  }
  let poseQ = [], poseC = [], poseJob = 0, scoredAspect = null;
  function scorePoses(){
    const gen = ++poseJob, t0 = performance.now();
    scoredAspect = canvas.width / Math.max(1, canvas.height) || 1;
    if (poseQ.length !== cams.length){ poseQ = new Array(cams.length).fill(-1); poseC = new Array(cams.length).fill(-1); }
    let i = 0;
    const slice = () => {
      if (gen !== poseJob || !G) return;
      const t = performance.now();
      while (i < cams.length && performance.now() - t < 12){
        if (!(poseQ[i] >= 0) || !(poseC[i] >= 0)){
          const aspect = canvas.width / Math.max(1, canvas.height) || 390 / 844;
          const w = aspect >= 1 ? 64 : Math.max(24, Math.round(64 * aspect));
          const h = aspect >= 1 ? Math.max(24, Math.round(64 / aspect)) : 64;
          const save = cam, saveOverride = override; override = null;
          const q = poseOf(i); cam = {p: q.p, yaw: q.yaw, pitch: q.pitch, floor: 1};
          const r = drawnFraction(currentCamera(aspect), w, h, true);
          poseQ[i] = r.drawn; poseC[i] = r.detail || 0;
          cam = save; override = saveOverride;
        }
        i++;
      }
      if (i < cams.length){ setTimeout(slice, 16); return; }
      S.poses = {ms: Math.round(performance.now() - t0), below: poseQ.filter(x => x < POSE_MIN).length,
                 empty: poseC.filter(x => x >= 0 && x < POSE_CONTENT).length,
                 skipped: poseQ.filter((x, k) => x < POSE_MIN || poseC[k] < POSE_CONTENT).length,
                 min: POSE_MIN, content: POSE_CONTENT, maxSkip: NAV.MAX_SKIP};
    };
    setTimeout(slice, 0);
  }
  function reset(){
    const i = opening >= 0 ? opening : 0;
    glideTo(poseOf(i), i); ci = i;
  }
  $("bOverview").onclick = () => overview();
  $("bBack").onclick = () => faceTheRoom();
  // the ring and the edge chevron are the same control, where the eye already is
  $("compass").onclick = () => faceTheRoom();
  $("back").onclick = () => faceTheRoom();
  $("bPrev").onclick = () => step(-1);
  $("bNext").onclick = () => step(1);
  $("bReset").onclick = reset;
  $("bOverview").disabled = true;
  $("bBack").disabled = true;
  if (!cams.length){ $("bPrev").disabled = true; $("bNext").disabled = true; }
  /* A rotation changes which poses render well. `drawnFraction` is explicitly
     aspect-dependent, and the arrows, the opening and the Overview all rank on
     it -- so after a rotation the arrows were skipping poses by how they had
     looked in the PREVIOUS orientation (review 2, P-9). Rescored once the
     rotation has settled, and only when the shape really changed (a keyboard
     or a URL bar appearing is not a rotation). */
  let rescoreTimer = null;
  addEventListener("resize", () => {
    requestDraw();
    const aspect = canvas.width / Math.max(1, canvas.height) || 1;
    if (!scoredAspect || Math.abs(Math.log(aspect / scoredAspect)) < 0.15) return;
    clearTimeout(rescoreTimer);
    rescoreTimer = setTimeout(() => { if (navField && navField.done) scorePoses(); }, 300);
  });

  /* -------- caption: exactly what this is ---------------------------------- */
  let captionOpen = false;
  function updateCaption(){
    const cap = $("caption");
    cap.textContent = "";
    const head = document.createElement("b");
    head.textContent = "Captured images on reconstructed geometry";
    const bits = [];
    if (manifest){
      bits.push(S.layers + " of " + S.keyframesInManifest + " keyframes shown");
      if (S.holding) bits.push("finishing the world: these are the walk's images until the final ones arrive");
      else if (manifest.quality === "live") bits.push("still building as you walk");
    }
    if (CONFIG.current === false){
      const reason = manifest && manifest.currency && manifest.currency.reason || CONFIG.currency_reason;
      bits.push(reason ? String(reason) : "built from an earlier reconstruction");
    }
    if (encoding === "webp-rgba"){
      // WHICH side lacks it. `chooseEncoding` falls back to WebP both when the
      // device has no ASTC and when the TOWER built without an ASTC encoder,
      // and this line blamed the device for both -- so a Tower missing its
      // encoder was going to be filed as a phone bug (review 2, P-8). The
      // manifest says which; `encoding_notes` carries the Tower's own reason.
      const encs = (manifest && manifest.encodings) || {};
      const towerHasAstc = !!(encs["astc-6x6-rgba"] && encs["astc-6x6-rgba"].available !== false);
      const notes = manifest && manifest.encoding_notes;
      bits.push(towerHasAstc
        ? "reduced set: this device has no compressed-texture support"
        : "reduced set: the Tower built no compressed textures for this world"
          + (notes ? " (" + String(notes) + ")" : ""));
    }
    // One short line by default; what it is and what the grey areas mean on
    // tap (the review: four lines covered 11-13% of the frame).
    //
    // The old sentence ended "...nothing there is filled
    // in", which was true until the crack fill and the void
    // fog landed, and the sentence was not revisited (review 2, M-5). What
    // replaces it is bounded rather than absolute, and it is the bound a
    // wearer can act on: a grey haze is a place to distrust, a seam a few
    // pixels wide may have been closed from its neighbours.
    let note = "These are the camera's own frames, with faces redacted, placed on the reconstructed room. "
      + "A grey haze is a place no kept frame saw, or that was masked as unreliable (redaction, hands, "
      + "views that disagreed) -- it is always darker than the room around it and it is never an image "
      + "of anything. Cracks a few pixels wide between two parts of one surface are closed from the "
      + "frames on either side; nothing wider is. Where the geometry underneath is wrong, "
      + "images smear or double.";
    note += " The arrows step through the recorded walk and pass over poses that render badly or show"
      + " nothing, at most " + NAV.MAX_SKIP + " in a row -- so the walk you are shown is shorter than the one"
      + " that was recorded, but never skips a whole stretch of it.";
    // What the controls will and will not do, said plainly, because the
    // difference between them is the whole shape of this thing.
    note += " Turning is free: you can look all the way round and straight up, and where the glasses"
      + " never looked you will find the room simply dark rather than a wall you cannot turn past."
      + " Moving is not free -- the camera stays near the path that was actually walked, and a push"
      + " that slows to nothing has reached the edge of it."
      + " The ring at the top right is a compass of what was photographed from where you stand: the"
      + " lit part of it is the directions a frame exists in, the way you are looking is always at"
      + " the top, and when the lit part is behind you so is the room. It says a photograph exists,"
      + " not that there is anything worth seeing."
      + " “Face the room” turns you -- without moving you -- to the nearest direction that was"
      + " photographed, and the arrow at the edge of the frame does the same thing."
      + " “Best view” flies to the best-supported vantage in that path; on this capture the wearer"
      + " never stood back from the desk, so it is a view from the desk and not a view of the whole room.";
    if ((CONFIG.scale_state || "unknown") === "unknown") note += " Scale is unknown, so distances are relative.";
    const more = document.createElement("span");
    more.className = "more";
    more.textContent = (bits.length ? bits.join(" · ") + ". " : "") + note;
    more.hidden = !captionOpen;
    const toggle = document.createElement("button");
    toggle.id = "bInfo"; toggle.textContent = captionOpen ? "Less" : "About";
    toggle.setAttribute("aria-expanded", String(captionOpen));
    toggle.onclick = () => { captionOpen = !captionOpen; updateCaption(); };
    cap.append(head, toggle, more);
  }

  /* -------- verification hooks (read-only, and harmless on the phone) ------- */
  S.setView = (v) => { override = {eye: v.eye, target: v.target, up: v.up ? norm3(v.up) : null,
    fovY: (v.fovYDeg || 70) * Math.PI / 180}; frame(true); return S.choice; };
  S.walk = (i, yawDeg = 0, pitchDeg = 0) => { ci = Math.max(0, Math.min(cams.length - 1, i));
    setPose(poseOf(ci, yawDeg * Math.PI / 180, pitchDeg * Math.PI / 180)); frame(true);
    return {index: ci, of: cams.length}; };
  /* The free orbit this page USED to offer (orbit about the point a recorded
     pose looked at), kept only so a measurement can show where it went. */
  S.orbitView = (yawDeg, pitchDeg, distScale = 1, around = null) => {
    const i = around !== null ? around : (opening >= 0 ? opening : 0);
    const c = cams[Math.max(0, Math.min(cams.length - 1, i))], f = norm3([c[3], c[4], c[5]]);
    const d = CONFIG.median_scene_depth || diag * 0.2;
    const target = [c[0]+f[0]*d, c[1]+f[1]*d, c[2]+f[2]*d], yp = yawPitchOf(f);
    const dir = dirFrom(yp.yaw + yawDeg * Math.PI / 180,
                        Math.max(-1.45, Math.min(1.45, yp.pitch + pitchDeg * Math.PI / 180)));
    const dist = d * distScale;
    override = {eye: [target[0]-dir[0]*dist, target[1]-dir[1]*dist, target[2]-dir[2]*dist], target, up: null,
                fovY: 0.95};
    frame(true); return true; };
  S.reset = () => { reset(); if (glideState){ glideState.t = glideState.ms; } frame(true); };
  S.coverage = () => {
    const cam = currentCamera(), MVP = matrices(cam);
    const w = canvas.width, h = canvas.height, px = new Uint8Array(w * h * 4);
    drawBlend(cam, MVP, bound(), 2);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
    let obs = 0, un = 0;
    for (let i = 0; i < px.length; i += 4){
      if (px[i] === 255 && px[i+1] === 255) obs++; else if (px[i] === 255 && px[i+1] === 0) un++;
    }
    drawBlend(cam, MVP, bound(), 3);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
    let drawn = 0;
    for (let i = 0; i < px.length; i += 4) drawn += px[i];
    drawBlend(cam, MVP, bound());
    return {observed: obs / (w*h), unobserved: un / (w*h), background: 1 - (obs + un) / (w*h),
            drawn: drawn / 255 / (w*h)};
  };
  /* What the confidence fade costs this view, at the canvas's own size: the
     share of the DRAWN area it removes and the share of the whole frame, which
     are the two columns the confidence lane predicted (CONFIDENCE.md §7). */
  S.fadeCost = () => {
    const c = currentCamera(), MVP = matrices(c), w = canvas.width, h = canvas.height;
    drawBlend(c, MVP, bound(), 11);
    const px = new Uint8Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
    let took = 0, all = 0;
    for (let i = 0; i < px.length; i += 4){ took += px[i]; all += px[i+1]; }
    drawBlend(c, MVP, bound());
    return {ofDrawn: all > 0 ? took / all : 0, ofFrame: took / 255 / (w * h),
            drawn: all / 255 / (w * h), on: !!(S.confidence && S.confidence.present),
            lo: OPT.confLo, hi: OPT.confHi};
  };
  // Verification only: the camera as drawn, one debug mode as an image, and a
  // fixed frame clock so a captured sequence shows the crossfades a phone would.
  S.camera = () => { const c = currentCamera(); return {eye: c.eye, at: c.at, up: c.up || UP, fy: c.fy,
    aspect: c.aspect, near: c.near, far: c.far, zfar: zmax * 3, w: canvas.width, h: canvas.height}; };
  S.shotMode = (m) => { const cam = currentCamera(), MVP = matrices(cam);
    drawBlend(cam, MVP, bound(), m); const u = canvas.toDataURL("image/png");
    drawBlend(cam, MVP, bound()); return u; };
  S.clock = (ms) => { clockMs = ms === null || ms === undefined ? null : +ms; return clockMs; };
  S.snapshot = () => { frame(true); return canvas.toDataURL("image/png"); };
  // Navigation, for verification: the pose, the envelope, a scripted input
  // (the same path a finger takes: NAV.step inside frame()), one clocked frame.
  S.pose = () => ({p: cam.p.slice(), yaw: cam.yaw, pitch: cam.pitch, floor: cam.floor, index: ci,
                   gliding: !!glideState, resisted: S.resisted || 0});
  S.setPose = (pose) => { setPose(pose); frame(true); return S.pose(); };
  S.navStats = () => S.nav || null;
  S.navReady = () => !!(navField && navField.done);
  S.support = (pose) => { const r = supportOf(pose || cam); if (!r) return null;
    const pd = navPath && navPath.n ? NAV.pathDist(navPath, (pose || cam).p) : null;
    return {support: r.s, dist: r.dist, content: r.c, rich: NAV.richness(r.c),
            standoff: navField ? NAV.nearest(navField, (pose || cam).p) : null,
            envelope: pd ? pd.e : null}; };
  // the constants a measurement needs to name what it swept
  S.navConst = () => ({viewMargin: OPT.viewMargin, viewMarginV: OPT.viewMarginV,
    D_MIN: NAV.D_MIN, D_SOFT: NAV.D_SOFT, C_LO: NAV.C_LO, C_HI: NAV.C_HI,
    C_DRIFT_MAX: NAV.C_DRIFT_MAX, C_SETTLE: NAV.C_SETTLE, B_FREE: NAV.B_FREE,
    R_MAX: NAV.R_MAX, R_SOFT: NAV.R_SOFT, V_MAX: NAV.V_MAX, PITCH_MAX: NAV.PITCH_MAX,
    MAX_SKIP: NAV.MAX_SKIP, POSE_MIN, POSE_CONTENT, DETAIL_REF,
    DARK_LO: NAV.DARK_LO, DARK_HI: NAV.DARK_HI, RING_BINS,
    CONF_LO: OPT.confLo, CONF_HI: OPT.confHi,
    T_LO: NAV.T_LO, T_HI: NAV.T_HI});
  S.poseContent = () => poseC.slice();
  S.detailOf = (w = 96) => { const aspect = canvas.width / Math.max(1, canvas.height);
    const hh = Math.max(24, Math.round(w / aspect));
    return drawnFraction(currentCamera(aspect), w, hh, true, true); };
  // `minSupport` 0 (the default) is what a person can now reach: every
  // direction, from every position in the tube. Pass NAV.T_LO for the
  // support-filtered set the old envelope allowed, so the two are comparable.
  S.sampleReachable = (n, seed = 1, minSupport = 0) => { if (!navField || !navField.done) return [];
    const rand = mulberry(seed), V = navView(), out = [];
    for (let i = 0; i < n; i++){
      const r = NAV.sampleReachable(navField, navPath, V, rand, 4000, minSupport);
      if (r) out.push(r);
    }
    return out; };
  S.input = (c) => { override = null;
    if (c.look){ ctl.look[0] += c.look[0]; ctl.look[1] += c.look[1]; }
    if (c.move){ for (let i = 0; i < 3; i++) ctl.move[i] += c.move[i]; }
    if (c.vel){ vel.look = (c.vel.look || [0, 0]).slice(); vel.move = (c.vel.move || [0, 0, 0]).slice(); }
    if (c.held !== undefined) ctl.held = !!c.held;
    return true; };
  S.step = (d) => { step(d); return ci; };
  S.poseQuality = () => poseQ.slice();
  S.overview = () => overview();
  // the orientation cue, for verification: the coverage profile the ring draws,
  // where it says the room is, and the control itself
  S.ring = null;
  S.ringProfile = () => { updateRing(true); return ringProf ? Array.from(ringProf) : null; };
  S.heading = () => { updateRing(); const b = ringProf && NAV.bestHeading(ringProf, shownPose().yaw);
    return b ? {yaw: b.yaw, delta: b.delta, support: b.support} : null; };
  S.faceTheRoom = () => faceTheRoom();
  S.frame = () => { frame(true); return S.pose(); };

  /* Choose where the page opens, put the camera there, draw, and start the
     navigation field. Split out of the start block because a page that booted
     with nothing placed (M-0) reaches this LATER, when a build it can draw is
     finally served -- and without it that recovery would have textures, no
     opening pose and `shownAt === null`, which draws nothing at all. */
  async function finishOpening(){
    resize();
    opening = await chooseOpening();
    ci = opening >= 0 ? opening : 0;
    setPose(poseOf(ci));
    updateCaption();
    // verification captures want the settled picture; a person sees a fade
    shownAt = DEBUG && OPT.preserve ? -1e9 : performance.now();
    frame(true);
    S.phase = "ready";
    S.timing.bootMs = performance.now() - T0;
    gpuTotal();
    buildNav();
  }

  /* -------- start ------------------------------------------------------------ */
  try {
    buildGL();
    basis();
    navPath = cams.length ? NAV.makePath(cams, UP) : null;
    recordedPitch();
    S.phase = "loading";
    status("Loading the images…");
    await serial(() => loadRevision(CONFIG.appearance_revision || null));
    if (S.phase === "failed") return;
    if (!S.layers){
      // **Not a dead end** (review 2, M-0). `fail()` hides the page, stops the
      // script here and never reaches `follow()` below, so a boot that placed
      // nothing never asked again -- and the app cannot tell, because the page
      // reported `didFinish` like any other, so the screen is ready and its
      // failure view is not shown. The wearer was left with a sentence and a
      // Close. This is the same state a withdrawal reaches, and it recovers
      // the same way: say so, keep polling, draw a build that is served.
      //
      // Reachable whenever the manifest's phone keyframes carry no chunk under
      // the chosen encoding: a rebuild in flight, a partly published build, an
      // ASTC device against a manifest built without ASTC.
      dropAppearance("No image of this world could be placed yet. This view will show them as "
                     + "soon as the Tower serves them.");
      follow();
      return;
    }
    await finishOpening();
    follow();
  } catch (e){
    if (S.phase !== "failed") fail("The images could not be placed: " + (e && e.message ? e.message : e));
  }
}

main().catch(e => fail("The world viewer failed to start: " + (e && e.message ? e.message : e)));
</script>
</body>
</html>
