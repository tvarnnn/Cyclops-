<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="wb-representation" content="appearance">
<meta http-equiv="Content-Security-Policy" content="__WB_APPEARANCE_CSP__">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>World</title>
<style>
:root{
  --bg:#0b0d10; --ink:#e8e9ec; --dim:#9aa0a8; --line:#23262c; --accent:#64d2ff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior:none}
body{overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none}
canvas{display:block;width:100%;height:100%;touch-action:none;background:var(--bg)}
#wrap{position:fixed;inset:0}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(11,13,16,.96),rgba(11,13,16,0));
  display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:#14171c;color:var(--ink);
  border-radius:8px;padding:8px 11px;font:inherit;font-size:13px;min-height:38px;touch-action:manipulation}
button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
button[disabled]{opacity:.4}
#caption{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
  background:linear-gradient(to bottom,rgba(11,13,16,.96),rgba(11,13,16,0));
  font-size:12px;color:var(--dim);pointer-events:none}
#caption b{color:var(--ink);font-weight:600}
#status{position:fixed;left:12px;bottom:calc(64px + env(safe-area-inset-bottom));font-size:12px;
  color:var(--dim);pointer-events:none;font-variant-numeric:tabular-nums}
#msg{position:fixed;inset:0;display:none;place-content:center;padding:28px;text-align:center;
  color:var(--dim);background:var(--bg);z-index:5}
#msg.on{display:grid}
.spacer{flex:1}
#pos{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="caption"></div>
<div id="status"></div>
<div id="bar">
  <button id="bOrbit" aria-pressed="false">Orbit</button>
  <button id="bWalk" aria-pressed="false">Walk</button>
  <button id="bPrev">&#8592;</button>
  <button id="bNext">&#8594;</button>
  <span id="pos"></span>
  <span class="spacer"></span>
  <button id="bReset">Reset</button>
</div>
<div id="msg"></div>
<script>
"use strict";
/* The appearance viewer: the wearer's own redacted keyframes, blended view-
   dependently over the proxy surface they were prepared against.

   Contract: docs/contracts/WORLD-BUILDER-APPEARANCE.md (the artifact) and
   WORLD-BUILDER-WORLDS.md §4 (this page). The page is a small shell; the
   imagery arrives through `fetch` from CONFIG.base, which is the app's private
   scheme on the phone (every request passes a native whitelist) and the Tower's
   own origin only in the explicit desktop debug mode. Nothing is written
   anywhere: textures live in GPU memory for the life of the page. */
const CONFIG = __WB_APPEARANCE_CONFIG__;
const T0 = performance.now();
const S = {                          // what the page reports about itself
  phase: "starting", encoding: null, layers: 0, capacity: 0, keyframesInManifest: 0,
  wireBytes: 0, requests: 0, gpu: {}, gpuBytes: 0, revision: null, buildId: null,
  appends: 0, contextLosses: 0, errors: [], timing: {}, opening: null, choice: [],
};
window.__wbAppearance = S;

const $ = id => document.getElementById(id);
function fail(text){
  S.phase = "failed"; S.errors.push(String(text));
  const m = $("msg"); m.textContent = text; m.classList.add("on");
  $("wrap").style.display = "none"; $("bar").style.display = "none";
  $("caption").style.display = "none"; $("status").textContent = "";
}
function status(text){ $("status").textContent = text || ""; }

const DEBUG = CONFIG.transport === "tower";
const Q = DEBUG ? new URLSearchParams(location.search) : new URLSearchParams("");
const OPT = {
  // Candidate sources chosen per frame, and the ULR top-k blended per fragment
  // (k + 2 vote in the consensus).
  candidates: 8,
  k: Math.max(1, Math.min(5, +(Q.get("k") || CONFIG.k || 4))),
  // The blend's softmax temperature (radians of penalty), the width in CSS
  // pixels over which the drawn room fades out where it borders nothing, the
  // consensus strength, and how long a source takes to fade in or out of the
  // chosen set.
  temp: +(Q.get("temp") || CONFIG.blend_temperature || 0.07),
  fadePx: Math.max(0, Math.min(12, +(Q.get("fadepx") || CONFIG.edge_fade_px || 8))),
  // Where the highlight roll-off starts (display value, below the 0.97 ceiling).
  knee: Math.max(0.3, Math.min(0.9, +(Q.get("knee") || CONFIG.tone_knee || 0.6))),
  // How far in from a source image's border its weight rises (source pixels):
  // wide, so a keyframe's rectangle never switches on as a hard step. Its
  // EVIDENCE (what the frame shows at all) keeps a narrow 20 px feather.
  border: +(Q.get("border") || CONFIG.border_feather_px || 80),
  exposureModel: Q.get("expo") || "full",
  consensus: Q.get("consensus") !== null ? +Q.get("consensus") : (CONFIG.consensus ?? 1),
  fadeMs: +(Q.get("fadems") || CONFIG.source_fade_ms || 280),
  forceWebp: Q.get("enc") === "webp",
  debugMode: +(Q.get("dbg") || 0),
  preserve: Q.get("preserve") === "1",
};

/* ---------- transport ---------------------------------------------------- */
function url(route){ return (CONFIG.base || "") + route; }
async function fetchBytes(route, what){
  let lastError = null;
  for (let attempt = 0; attempt < 3; attempt++){
    try {
      const r = await fetch(url(route), {cache: "no-store", credentials: "omit"});
      S.requests++;
      if (r.status === 404){
        let detail = null;
        try { detail = (await r.json()).detail; } catch (_) { /* not JSON */ }
        const e = new Error(detail || (what + " is not served"));
        e.absent = true; throw e;
      }
      if (!r.ok) throw new Error(what + ": HTTP " + r.status);
      const b = await r.arrayBuffer();
      S.wireBytes += b.byteLength;
      return b;
    } catch (e){
      if (e.absent) throw e;
      lastError = e;
      await new Promise(res => setTimeout(res, 300 * (attempt + 1) * (attempt + 1)));
    }
  }
  throw new Error("could not fetch " + what + ": " + (lastError && lastError.message || lastError));
}
async function fetchJSON(route, what){
  const b = await fetchBytes(route, what);
  return JSON.parse(new TextDecoder().decode(b));
}

/* ---------- follower: what a revision poll means (pure; tested under node) ---------- */
/* Contract: WORLD-BUILDER-WORLDS.md §4 "Following" and WORLD-BUILDER-APPEARANCE.md §9.
   No DOM, no GL, no fetch: `decide` turns one poll's outcome into one action,
   `mustReplace` says whether a manifest's textures may be overwritten in place,
   `nextDelay` paces the polls. The page below only carries the actions out.

   Review 1, B1: `appearance.revision: null` used to be terminal. Every ordinary
   Stop turns the session label from `none` into the real one, the routes stop
   serving the walk's build until the final one lands, and the page deleted its
   textures and stopped polling for good. Now:
   - `rebuilding` (the label changed in a way the Tower says the textures carry
     over): keep drawing, keep polling, pick the next build up in place;
   - `withdrawn` / `absent` / a 404 naming a world or session that is gone: drop
     the textures NOW, say why, and keep polling (slowly) so a rebuild returns;
   - a served build whose `epoch` differs from the one on screen: drop first,
     then draw it (m7: a label change and a rebuild inside one poll). */
const FOLLOW = (() => {
  const BASE_MS = 10000, CEILING_MS = 120000;
  // How long the walk's images are kept on screen waiting for the final build.
  // The final stages run minutes after Stop; past this the page degrades.
  const HOLD_MAX_MS = 20 * 60 * 1000;
  const GONE = /^(no world |world .* has no session )/;
  function decide(poll, page){
    page = page || {};
    if (!poll || poll.error !== undefined) return {action: "none", live: null};
    if (poll.absent !== undefined){
      if (GONE.test(String(poll.absent || "")))
        return {action: "drop", live: false,
                reason: "This world is no longer on the Tower, so its images were removed from this view."};
      return {action: "none", live: null};
    }
    const body = poll.ok || {};
    const a = body.appearance || {};
    const live = body.live === undefined ? null : body.live;
    if (typeof a.revision === "string" && a.revision){
      return a.revision !== page.revision ? {action: "load", live, revision: a.revision}
                                          : {action: "none", live};
    }
    if (a.state === "rebuilding"){
      const since = page.holdingSince;
      if (since !== null && since !== undefined && (page.now - since) > HOLD_MAX_MS)
        return {action: "drop", live,
                reason: "The finished world's images did not arrive, so the walk's images were removed. "
                  + "Close and reopen the world to see what it has now."};
      return {action: "hold", live};
    }
    return {action: "drop", live,
            reason: "These images are no longer served for this world (its redaction record changed, "
              + "or its imagery was removed). This view will show them again if they are rebuilt."};
  }
  function epochOf(man){ return man && typeof man.epoch === "string" && man.epoch ? man.epoch : null; }
  function mustReplace(shown, next){
    if (!shown) return false;                       // nothing on screen to keep
    const a = epochOf(shown), b = epochOf(next);
    return a === null || b === null || a !== b;     // unknown is never "the same"
  }
  function nextDelay(result, delay){
    if (result && (result.action === "load" || result.action === "hold" || result.live === true)) return BASE_MS;
    return Math.min(CEILING_MS, Math.max(BASE_MS, (delay || BASE_MS) * 2));
  }
  return {decide, mustReplace, nextDelay, BASE_MS, CEILING_MS, HOLD_MAX_MS};
})();
/* ---------- end follower */

/* ---------- formats ------------------------------------------------------- */
function view(Type, buffer, offset, count){
  if (offset % Type.BYTES_PER_ELEMENT === 0) return new Type(buffer, offset, count);
  return new Type(buffer.slice(offset, offset + count * Type.BYTES_PER_ELEMENT));
}
/* wb-surface-mesh/1 (WORLD-BUILDER-SURFACE.md §5); only positions and indices
   are used -- the proxy's own vertex colours are the rejected product and are
   never drawn. */
function decodeMesh(buf){
  if (buf.byteLength < 48) throw new Error("proxy mesh is shorter than its header");
  const dv = new DataView(buf);
  let magic = ""; for (let i = 0; i < 8; i++) magic += String.fromCharCode(dv.getUint8(i));
  if (magic !== "WBSURF01") throw new Error("the proxy is not a surface mesh");
  const nV = dv.getUint32(8, true), nI = dv.getUint32(12, true);
  const flags = dv.getUint32(16, true), version = dv.getUint32(20, true);
  if (version !== 1) throw new Error("proxy mesh schema " + version + ", expected 1");
  const lo = [dv.getFloat32(24,true), dv.getFloat32(28,true), dv.getFloat32(32,true)];
  const hi = [dv.getFloat32(36,true), dv.getFloat32(40,true), dv.getFloat32(44,true)];
  const hasN = (flags & 1) !== 0, u16 = (flags & 2) !== 0;
  if (nI % 3 !== 0) throw new Error("proxy index count is not a multiple of 3");
  let off = 48;
  const need = off + nV * (6 + 3 + (hasN ? 3 : 0)) + nI * (u16 ? 2 : 4);
  if (buf.byteLength !== need) throw new Error("proxy mesh length mismatch");
  const pos = view(Uint16Array, buf, off, nV * 3); off += nV * 6 + nV * 3 + (hasN ? nV * 3 : 0);
  const idx = u16 ? view(Uint16Array, buf, off, nI) : view(Uint32Array, buf, off, nI);
  const span = [Math.max(hi[0]-lo[0],1e-9), Math.max(hi[1]-lo[1],1e-9), Math.max(hi[2]-lo[2],1e-9)];
  return {pos, idx, lo, hi, span, nV, nI, u32: !u16};
}
/* WBAPCK01 (WORLD-BUILDER-APPEARANCE.md §4.1). */
function decodeChunk(buf){
  const dv = new DataView(buf);
  let magic = ""; for (let i = 0; i < 8; i++) magic += String.fromCharCode(dv.getUint8(i));
  if (magic !== "WBAPCK01") throw new Error("not an appearance chunk");
  if (dv.getUint32(8, true) !== 1) throw new Error("appearance chunk schema is not 1");
  const encoding = dv.getUint32(12, true), n = dv.getUint32(16, true);
  const w = dv.getUint32(20, true), h = dv.getUint32(24, true);
  const payload = 32 + 8 * n, slots = [];
  for (let i = 0; i < n; i++){
    const o = dv.getUint32(32 + 8 * i, true), len = dv.getUint32(36 + 8 * i, true);
    if (payload + o + len > buf.byteLength) throw new Error("appearance chunk slot out of range");
    slots.push(new Uint8Array(buf, payload + o, len));
  }
  return {encoding, w, h, slots};
}

/* ---------- small maths -------------------------------------------------- */
const M = {
  mul(a,b){const o=new Float32Array(16);
    for(let r=0;r<4;r++)for(let c=0;c<4;c++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}return o;},
  persp(fy,asp,n,f){const t=1/Math.tan(fy/2),o=new Float32Array(16);
    o[0]=t/asp;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o;},
  look(eye,at,up){
    let z=[eye[0]-at[0],eye[1]-at[1],eye[2]-at[2]];let l=Math.hypot(...z)||1;z=z.map(v=>v/l);
    let x=[up[1]*z[2]-up[2]*z[1],up[2]*z[0]-up[0]*z[2],up[0]*z[1]-up[1]*z[0]];
    l=Math.hypot(...x);
    if (l < 1e-6){ x=[1,0,0]; } else { x=x.map(v=>v/l); }
    const y=[z[1]*x[2]-z[2]*x[1],z[2]*x[0]-z[0]*x[2],z[0]*x[1]-z[1]*x[0]];
    const o=new Float32Array(16);
    o[0]=x[0];o[4]=x[1];o[8]=x[2];o[1]=y[0];o[5]=y[1];o[9]=y[2];o[2]=z[0];o[6]=z[1];o[10]=z[2];
    o[12]=-(x[0]*eye[0]+x[1]*eye[1]+x[2]*eye[2]);
    o[13]=-(y[0]*eye[0]+y[1]*eye[1]+y[2]*eye[2]);
    o[14]=-(z[0]*eye[0]+z[1]*eye[1]+z[2]*eye[2]);
    o[15]=1;return o;}
};
const norm3 = v => { const l = Math.hypot(v[0],v[1],v[2]) || 1; return [v[0]/l, v[1]/l, v[2]/l]; };
const cross3 = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const dot3 = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];

/* ---------- shaders -------------------------------------------------------- */
/* Sources bound per frame: OPT.candidates chosen for this view plus the ones
   still fading out of the last choice (a changed choice crossfades, it never
   pops). */
const MAXC = 12;
/* One vertex shader for the depth prepass, the probe and the blend, with an
   invariant position, so the blend's LEQUAL test matches the prepass exactly
   and the expensive fragment shader runs once per visible pixel. */
const VS_VIEW = `#version 300 es
precision highp float;
invariant gl_Position;
in vec3 aQ;
uniform mat4 uMVP; uniform vec3 uLo; uniform vec3 uSpan;
out vec3 vX;
void main(){ vec3 p = uLo + aQ * uSpan; vX = p; gl_Position = uMVP * vec4(p, 1.0); }`;

/* What "not captured" looks like: a dark, smooth vignette. Never a texture. */
const GLSL_BACKGROUND = `
uniform vec2 uRes;
vec3 background(){
  vec2 p = gl_FragCoord.xy / uRes;
  vec2 d = (p - vec2(0.5, 0.56)) * vec2(uRes.x / uRes.y, 1.0);
  float r = clamp(length(d) / 0.9, 0.0, 1.0);
  return mix(vec3(0.078, 0.084, 0.094), vec3(0.031, 0.035, 0.043), r * r * (3.0 - 2.0 * r));
}`;
/* The frame is the blended layer -- the captured colour, with the evidence
   that anyone saw it as alpha -- composited over that background with a SOFT
   edge: where anything is drawn (evidence > 0.02) is blurred over uRadius
   pixels (horizontally here, vertically in the composite), and alpha rises
   from 0 at the border with nothing drawn to 1 at uRadius pixels inside. So
   where the proxy ends, where a hole opens, and where there IS proxy but no
   kept image saw it, the room fades out over a few pixels into the same calm
   background instead of a stair-stepped cut or a dark surface -- and only
   inward: a pixel with no evidence never gains colour. Proxy nobody's image
   covers still writes depth, so it still hides what is behind it. */
const FS_COVER_H = `#version 300 es
precision highp float;
uniform sampler2D uL; uniform int uRadius; uniform ivec2 uSize;
out vec4 o;
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy);
  float s = 0.0, n = 0.0;
  for (int i = -12; i <= 12; i++){
    if (i < -uRadius || i > uRadius) continue;
    float w = float(uRadius + 1 - (i < 0 ? -i : i));
    s += w * step(0.02, texelFetch(uL, ivec2(clamp(p.x + i, 0, uSize.x - 1), p.y), 0).a); n += w;
  }
  o = vec4(s / n, 0.0, 0.0, 1.0);
}`;
const FS_COMPOSITE = `#version 300 es
precision highp float;
uniform sampler2D uL; uniform sampler2D uCover; uniform int uRadius; uniform ivec2 uSize;
${GLSL_BACKGROUND}
out vec4 o;
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy);
  vec4 layer = texelFetch(uL, p, 0);
  float alpha = layer.a;
  if (alpha > 0.0 && uRadius > 0){
    float s = 0.0, n = 0.0;
    for (int j = -12; j <= 12; j++){
      if (j < -uRadius || j > uRadius) continue;
      float w = float(uRadius + 1 - (j < 0 ? -j : j));
      s += w * texelFetch(uCover, ivec2(p.x, clamp(p.y + j, 0, uSize.y - 1)), 0).r; n += w;
    }
    alpha *= smoothstep(0.5, 0.97, s / n);
  }
  o = vec4(mix(background(), layer.rgb, alpha), 1.0);
}`;

const FS_NOTHING = `#version 300 es
precision mediump float; out vec4 o; void main(){ o = vec4(0.0); }`;

/* Distance from the eye, packed into RGBA8: the probe the CPU reads to learn
   which surface points are on screen before choosing sources. */
const FS_PROBE = `#version 300 es
precision highp float;
uniform vec3 uEye; uniform float uFar; in vec3 vX; out vec4 o;
void main(){ float d = clamp(length(vX - uEye) / uFar, 0.0, 1.0) * 16777215.0;
  o = vec4(floor(d / 65536.0), mod(floor(d / 256.0), 256.0), mod(d, 256.0), 255.0) / 255.0; }`;

/* A keyframe's own view of the proxy: camera z, quantised to u16, rendered
   through that keyframe's intrinsics so texel (i, j) is pixel (i, j) of the
   image (the §4.2 convention: row 0 is the top). */
const VS_SOURCE = `#version 300 es
precision highp float;
in vec3 aQ;
uniform vec3 uLo; uniform vec3 uSpan; uniform mat3 uR; uniform vec3 uT;
uniform vec4 uIntr; uniform vec2 uWH; uniform vec2 uNF;
out float vZ;
void main(){
  vec3 p = uLo + aQ * uSpan; vec3 pc = uR * p + uT; vZ = pc.z;
  float n = uNF.x, f = uNF.y;
  gl_Position = vec4(2.0 * (uIntr.x * pc.x + uIntr.z * pc.z) / uWH.x - pc.z,
                     2.0 * (uIntr.y * pc.y + uIntr.w * pc.z) / uWH.y - pc.z,
                     (pc.z * (f + n) - 2.0 * f * n) / (f - n), pc.z);
}`;
const FS_SOURCE = `#version 300 es
precision highp float; precision highp int;
uniform float uZmax; in float vZ; out uvec4 o;
void main(){ o = uvec4(uint(clamp(vZ / uZmax, 0.0, 1.0) * 65534.0 + 0.5), 0u, 0u, 0u); }`;

/* 4x4 MIN pool: the nearest surface in a block wins, so a background point
   beside a foreground edge is rejected rather than painted with the edge. */
const VS_FULL = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID == 1) ? 3.0 : -1.0, (gl_VertexID == 2) ? 3.0 : -1.0);
  gl_Position = vec4(p, 0.0, 1.0); }`;
const FS_POOL = `#version 300 es
precision highp float; precision highp int; precision highp usampler2D;
uniform usampler2D uSrc; uniform ivec2 uSrcSize; out uvec4 o;
void main(){
  ivec2 b = ivec2(gl_FragCoord.xy) * 4; uint m = 65535u;
  for (int j = 0; j < 4; j++) for (int i = 0; i < 4; i++){
    ivec2 q = min(b + ivec2(i, j), uSrcSize - 1);
    m = min(m, texelFetch(uSrc, q, 0).r);
  }
  o = uvec4(m, 0u, 0u, 0u);
}`;

/* The blend. For every bound source: project; a confidence in [0, 1] that is
   the product of SOFT tests -- in frame (a border feather: uBorder source px
   for the weight, 20 px for the evidence), opaque in
   that source (the artifact's alpha, feathered inward from every mask:
   redaction, hands, disagreement), visible from that source (its depth, the
   test bilinear over the 2x2 depth blocks where the nearest block is in
   doubt), within 60 degrees of the viewing ray (fading from 46), and present
   (fading in or out of the chosen set). No test switches a source on or off
   between two neighbouring pixels, so neighbouring pixels never change sources
   abruptly.

   Weights: the k best penalties blend, with a softmax of the penalty
   (temperature uTemp) and a smooth cut just below the (k+1)-th penalty; a
   low-confidence sample is pushed down the ranking continuously. Then a
   robust CONSENSUS over the best few sources: a colour most of them agree on
   keeps its weight, a minority colour (a door that stood open in a few frames,
   an object moved during the walk) is down-weighted. Each sample is divided by
   its keyframe's photometric model: per-channel gain x exp(tilt . (xn, yn) +
   vignette(r2)) (WORLD-BUILDER-APPEARANCE.md §5.4).

   Output: the colour, with alpha = the evidence 1 - prod(1 - confidence), so
   a place every source masked fades to the background; the composite then
   softens the border with nothing drawn (above). Fading is only ever INWARD:
   no pixel beyond the evidence gains colour.
   UNSHADED: the images carry their own light; no lighting term is applied. */
const FS_BLEND = `#version 300 es
precision highp float; precision highp int;
precision highp sampler2DArray; precision highp usampler2DArray;
#define MAXC ${MAXC}
#define NS 7
#define TONE_CEILING 0.97
uniform sampler2DArray uCol; uniform usampler2DArray uDep;
uniform int uN; uniform int uK;
uniform float uLayer[MAXC]; uniform mat3 uR[MAXC]; uniform vec3 uT[MAXC];
uniform vec3 uC[MAXC]; uniform vec3 uGain[MAXC]; uniform vec2 uSlope[MAXC]; uniform vec4 uIntr[MAXC];
uniform float uQ[MAXC]; uniform float uPres[MAXC];
uniform vec2 uVig;
uniform vec2 uWH; uniform ivec2 uDWH; uniform float uZmax; uniform vec3 uEye;
uniform float uExposure; uniform float uGamma; uniform int uMode; uniform float uFar;
uniform float uTemp; uniform float uConsensus; uniform float uBorder; uniform float uKnee;
in vec3 vX; out vec4 o;
${GLSL_BACKGROUND}
vec3 tone(vec3 x){
  // Hue-preserving highlight roll-off on the largest channel: linear to the
  // knee, then an exponential shoulder that approaches TONE_CEILING and never
  // reaches white, so a bright doorway keeps its gradation instead of clipping.
  float m = max(max(x.r, x.g), x.b);
  if (m <= uKnee) return x;
  float span = TONE_CEILING - uKnee;
  float y = uKnee + span * (1.0 - exp(-(m - uKnee) / span));
  return x * (y / m);
}
float depthZ(uint q){ return float(q) / 65534.0 * uZmax; }
float gTaps = 0.0;   // texture fetches this fragment (debug mode 5)
float visibility(float layer, float z, vec2 uv){
  vec2 dp = uv * 0.25;
  gTaps += 1.0;
  uint q0 = texelFetch(uDep, ivec3(min(ivec2(dp), uDWH - 1), int(layer)), 0).r;
  if (q0 < 65535u){
    float z0 = depthZ(q0);
    if ((z - z0 - 0.015) / max(z0, 1e-3) < 0.015) return 1.0;   // plainly the nearest surface
  }
  // In doubt (an occluding edge, or a block the source did not see): the test
  // itself, soft, interpolated over the 2x2 neighbouring depth blocks.
  vec2 p = dp - 0.5; vec2 fl = floor(p); vec2 f = p - fl; ivec2 b0 = ivec2(fl);
  float v = 0.0;
  gTaps += 4.0;
  for (int j = 0; j < 2; j++) for (int i = 0; i < 2; i++){
    ivec2 tt = clamp(b0 + ivec2(i, j), ivec2(0), uDWH - 1);
    uint q = texelFetch(uDep, ivec3(tt, int(layer)), 0).r;
    if (q >= 65535u) continue;
    float zs = depthZ(q);
    float vv = 1.0 - smoothstep(0.015, 0.045, (z - zs - 0.015) / max(zs, 1e-3));
    v += vv * (i == 0 ? 1.0 - f.x : f.x) * (j == 0 ? 1.0 - f.y : f.y);
  }
  return v;
}
float cdist(vec3 a, vec3 b){
  // colour difference relative to brightness: exposure noise is small, a door
  // against a wall is large
  return length(a - b) / (0.08 + 0.5 * (dot(a, vec3(0.3333)) + dot(b, vec3(0.3333))));
}
void main(){
  vec3 dv = uEye - vX; float distv = max(length(dv), 1e-6); dv /= distv;
  float pen[MAXC]; float conf[MAXC]; vec3 col[MAXC]; float sat[MAXC];
  int n = 0; float pmin = 1e9; float miss = 1.0;
  for (int i = 0; i < uN; i++){
    pen[i] = -1.0;
    if (uPres[i] <= 0.0) continue;
    vec3 pc = uR[i] * vX + uT[i];
    if (pc.z < 0.02) continue;
    vec2 uv = vec2(uIntr[i].x * pc.x / pc.z + uIntr[i].z, uIntr[i].y * pc.y / pc.z + uIntr[i].w);
    float e = min(min(uv.x, uWH.x - uv.x), min(uv.y, uWH.y - uv.y));
    float bf = smoothstep(0.5, uBorder, e);
    if (bf <= 0.0) continue;
    vec3 ds = uC[i] - vX; float dists = length(ds); ds /= max(dists, 1e-6);
    float ang = acos(clamp(dot(ds, dv), -1.0, 1.0));
    float aw = 1.0 - smoothstep(0.80, 1.0472, ang);
    if (aw <= 0.0) continue;
    vec4 c = texture(uCol, vec3(uv / uWH, uLayer[i]));
    gTaps += 1.0;
    float a = clamp((c.a - 0.02) / 0.96, 0.0, 1.0);
    if (a <= 0.0) continue;
    float vis = visibility(uLayer[i], pc.z, uv);
    if (vis <= 0.0) continue;
    vec2 h = 0.5 * uWH; vec2 q = (uv - h) / h;
    float r2 = dot(uv - h, uv - h) / dot(h, h);
    vec3 g = uGain[i] * exp(dot(uSlope[i], q) + uVig.x * r2 + uVig.y * r2 * r2);
    col[i] = c.rgb / max(g, vec3(1e-3));
    sat[i] = max(max(c.r, c.g), c.b) > 0.975 ? 1.0 : 0.0;
    conf[i] = a * bf * vis * aw * uPres[i];
    float lc = 1.0 - conf[i];
    // Evidence says only that the source SAW the point: its angle lowers the
    // weight (aw) but not the evidence, except in the last 3 degrees to 60.
    float ev = a * smoothstep(0.5, 20.0, e) * vis * (1.0 - smoothstep(1.0, 1.0472, ang)) * uPres[i];
    pen[i] = ang + 0.15 * min(max(dists / distv - 1.0, 0.0), 3.0) + 0.10 * (1.0 - uQ[i])
           + 2.0 * lc * lc * lc;

  // the NS smallest penalties, in order
  float s[NS];
  for (int j = 0; j < NS; j++) s[j] = 1e9;
  for (int i = 0; i < uN; i++){
    if (pen[i] < 0.0) continue;
    float p = pen[i];
    for (int j = 0; j < NS; j++){ if (p < s[j]){ float t = s[j]; s[j] = p; p = t; } }
  }
  int k = min(uK, NS - 2);
  float thr = (n > k) ? s[k] : 1e9;
  float vthr = (n > k + 2) ? s[k + 2] : 1e9;
  float w[MAXC]; float v[MAXC];
  float wmax = 0.0;
  for (int i = 0; i < uN; i++){
    w[i] = 0.0; v[i] = 0.0;
    if (pen[i] < 0.0) continue;
    float soft = exp(-(pen[i] - pmin) / uTemp);
    if (pen[i] < thr) w[i] = conf[i] * soft * smoothstep(0.0, 0.08, thr - pen[i]) * (sat[i] > 0.5 ? 0.3 : 1.0);
    if (pen[i] < vthr) v[i] = conf[i] * exp(-(pen[i] - pmin) / (3.0 * uTemp)) * smoothstep(0.0, 0.08, vthr - pen[i]);
    wmax = max(wmax, w[i]);
  }
  // Consensus: a soft medoid of the voters, then weights by agreement with it.
  vec3 m0 = vec3(0.0); float mw = 0.0;
  if (uConsensus > 0.0){
    for (int j = 0; j < uN; j++){
      if (v[j] <= 0.0) continue;
      float D = 0.0, V = 0.0;
      for (int i = 0; i < uN; i++){ if (v[i] <= 0.0) continue; D += v[i] * min(cdist(col[i], col[j]), 2.0); V += v[i]; }
      float sw = v[j] * exp(-4.0 * D / max(V, 1e-6));
      m0 += sw * col[j]; mw += sw;
    }
  }
  bool robust = mw > 1e-6;
  if (robust) m0 /= mw;
  vec3 acc = vec3(0.0); float ws = 0.0; int used = 0; int top = -1; float btop = 0.0;
  for (int i = 0; i < uN; i++){
    if (w[i] <= 0.0 && v[i] <= 0.0) continue;
    float b = w[i];
    if (robust){
      float d = cdist(col[i], m0) / 0.35;
      b = (w[i] + 0.05 * wmax * v[i]) * mix(1.0, 1.0 / (1.0 + d * d), uConsensus);
    }
    if (b <= 0.0) continue;
    if (b > btop){ btop = b; top = i; }
    acc += b * col[i]; ws += b; used++;
  }
  bool observed = ws > 1e-7;
  float alpha = observed ? 1.0 - miss : 0.0;
  if (uMode == 1){ float t = float(used) / float(max(uK + 2, 1));
    o = vec4(observed ? vec3(t, t, 1.0 - t) : vec3(0.55, 0.0, 0.0), 1.0); return; }
  if (uMode == 2){ o = vec4(observed ? vec3(1.0) : vec3(1.0, 0.0, 0.0), 1.0); return; }
  if (uMode == 3){
    float d = clamp(distv / uFar, 0.0, 1.0) * 65535.0;
    o = vec4(alpha, floor(d / 256.0) / 255.0, mod(d, 256.0) / 255.0, 1.0); return;

  if (uMode == 4){ o = vec4(observed ? float(int(uLayer[top]) + 1) / 255.0 : 0.0, 0.0, 0.0, 1.0); return; }
  // The layer: colour and evidence. Proxy no kept image covers is alpha 0:
  // drawn exactly as "nothing" (the background), while its depth still hides
  // what is behind it.
  if (!observed){ o = vec4(0.0); return; }
  vec3 c = pow(tone(max(acc / ws, 0.0) * uExposure), vec3(1.0 / uGamma));
  o = vec4(c, alpha);
}`;

/* ---------- main --------------------------------------------------------- */
async function main(){
  const canvas = $("c");
  const attrs = {antialias: false, depth: true, alpha: false,
                 preserveDrawingBuffer: DEBUG && OPT.preserve, powerPreference: "high-performance"};
  let gl = canvas.getContext("webgl2", attrs);
  if (!gl){
    fail("This world is shown with the captured images and needs WebGL 2, which this viewer could not start.");
    return;
  }
  const cams = CONFIG.cameras || [];
  let UP = Array.isArray(CONFIG.up) && CONFIG.up.length === 3 ? norm3(CONFIG.up) : [0, -1, 0];

  /* -------- GL state that a context loss takes away ---------------------- */
  let G = null;                 // programs, buffers, textures
  let ext = null;
  let loseExt = null;           // WEBGL_lose_context: asks a lost context back
  let mesh = null;              // decoded proxy (kept: a restored context rebuilds from it)
  let manifest = null;          // the manifest the layers were filled from
  const layers = [];            // per texture layer: {id, digest, slot, ready, depthReady, kf}
  let capacity = 0, encoding = null, KW = 0, KH = 0, DW = 0, DH = 0, zmax = 1;
  let centre = [0,0,0], diag = 1;

  function compile(type, src){
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function program(vs, fs){
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.bindAttribLocation(p, 0, "aQ");
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++){
      const info = gl.getActiveUniform(p, i);
      const name = info.name.replace(/\[0\]$/, "");
      u[name] = gl.getUniformLocation(p, info.name);
    }
    return {p, u};
  }

  function buildGL(){
    ext = gl.getExtension("WEBGL_compressed_texture_astc");
    loseExt = loseExt || gl.getExtension("WEBGL_lose_context");
    G = {
      view: program(VS_VIEW, FS_NOTHING),
      probe: program(VS_VIEW, FS_PROBE),
      blend: program(VS_VIEW, FS_BLEND),
      source: program(VS_SOURCE, FS_SOURCE),
      pool: program(VS_FULL, FS_POOL),
      coverH: program(VS_FULL, FS_COVER_H),
      composite: program(VS_FULL, FS_COMPOSITE),
      lay: null,
      vao: null, vbo: null, ibo: null, col: null, dep: null,
      probeFB: null, probeTex: null, probeRB: null, pbo: null,
    };
    S.gl = {astc: !!ext, maxLayers: gl.getParameter(gl.MAX_ARRAY_TEXTURE_LAYERS),
            maxTexture: gl.getParameter(gl.MAX_TEXTURE_SIZE)};
    // probe target
    G.probeW = 32; G.probeH = 24;
    G.probeTex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, G.probeTex);
    gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, G.probeW, G.probeH);
    G.probeRB = gl.createRenderbuffer(); gl.bindRenderbuffer(gl.RENDERBUFFER, G.probeRB);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, G.probeW, G.probeH);
    G.probeFB = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, G.probeFB);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, G.probeTex, 0);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, G.probeRB);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  }
  function nearest(target){
    for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.NEAREST], [gl.TEXTURE_MAG_FILTER, gl.NEAREST],
                          [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]])
      gl.texParameteri(target, k, v);
  }
  /* The surface layer and its horizontally blurred coverage, at canvas size. */
  function ensureLayers(w, h){
    if (G.lay && G.lay.w === w && G.lay.h === h) return G.lay;
    if (G.lay){ gl.deleteTexture(G.lay.c1); gl.deleteTexture(G.lay.c2); gl.deleteRenderbuffer(G.lay.rb);
                gl.deleteFramebuffer(G.lay.fb1); gl.deleteFramebuffer(G.lay.fb2); }
    const make = (fmt) => { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texStorage2D(gl.TEXTURE_2D, 1, fmt, w, h); nearest(gl.TEXTURE_2D); return t; };
    const c1 = make(gl.RGBA8), c2 = make(gl.R8);
    const rb = gl.createRenderbuffer(); gl.bindRenderbuffer(gl.RENDERBUFFER, rb);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
    const fb1 = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb1);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, c1, 0);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, rb);
    const fb2 = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb2);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, c2, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    G.lay = {w, h, rb, fb1, fb2, c1, c2};
    S.gpu.layers = w * h * (4 + 3 + 1);
    return G.lay;
  }

  function uploadMesh(){
    if (G.vao){ gl.deleteVertexArray(G.vao); gl.deleteBuffer(G.vbo); gl.deleteBuffer(G.ibo); }
    G.vao = gl.createVertexArray(); gl.bindVertexArray(G.vao);
    G.vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, G.vbo);
    gl.bufferData(gl.ARRAY_BUFFER, mesh.pos, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.UNSIGNED_SHORT, true, 0, 0);
    G.ibo = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, G.ibo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, mesh.idx, gl.STATIC_DRAW);
    G.idxType = mesh.u32 ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT;
    S.gpu.proxy = mesh.pos.byteLength + mesh.idx.byteLength;
    centre = [mesh.lo[0]+mesh.span[0]/2, mesh.lo[1]+mesh.span[1]/2, mesh.lo[2]+mesh.span[2]/2];
    diag = Math.hypot(mesh.span[0], mesh.span[1], mesh.span[2]) || 1;
    zmax = diag * 2;
  }
  function meshUniforms(prog){
    gl.uniform3f(prog.u.uLo, mesh.lo[0], mesh.lo[1], mesh.lo[2]);
    gl.uniform3f(prog.u.uSpan, mesh.span[0], mesh.span[1], mesh.span[2]);
  }
  function drawMesh(){ gl.bindVertexArray(G.vao); gl.drawElements(gl.TRIANGLES, mesh.nI, G.idxType, 0); }

  /* Texture arrays are allocated ONCE, at capacity: a WebGL2 array cannot
     grow, and compressed layers cannot be copied on the GPU. Live builds
     overwrite layers in place. */
  function allocateLayers(){
    if (G.col){ gl.deleteTexture(G.col); gl.deleteTexture(G.dep); }
    const astcFormat = 0x93B4;   // COMPRESSED_RGBA_ASTC_6x6_KHR
    G.col = gl.createTexture(); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D_ARRAY, G.col);
    gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, encoding === "astc-6x6-rgba" ? astcFormat : gl.RGBA8, KW, KH, capacity);
    for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR],
                          [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]])
      gl.texParameteri(gl.TEXTURE_2D_ARRAY, k, v);
    G.dep = gl.createTexture(); gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D_ARRAY, G.dep);
    gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.R16UI, DW, DH, capacity);
    for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.NEAREST], [gl.TEXTURE_MAG_FILTER, gl.NEAREST],
                          [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]])
      gl.texParameteri(gl.TEXTURE_2D_ARRAY, k, v);
    const err = gl.getError();
    if (err !== gl.NO_ERROR) throw new Error("the texture arrays could not be allocated (GL error " + err + ")");
    S.gpu.colour = encoding === "astc-6x6-rgba"
      ? Math.ceil(KW / 6) * Math.ceil(KH / 6) * 16 * capacity : KW * KH * 4 * capacity;
    S.gpu.depth = DW * DH * 2 * capacity;
  }
  function gpuTotal(){
    S.gpu.probe = G ? G.probeW * G.probeH * 7 : 0;
    S.gpuBytes = (S.gpu.colour || 0) + (S.gpu.depth || 0) + (S.gpu.proxy || 0) + (S.gpu.probe || 0);
    S.gpu.drawingBuffer = canvas.width * canvas.height * 7;   // RGBA8 + depth24, not counted above
    return S.gpuBytes;
  }

  /* -------- source depth, generated on the device ----------------------- */
  function renderSourceDepth(list){
    if (!list.length) return;
    const t = performance.now();
    const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texStorage2D(gl.TEXTURE_2D, 1, gl.R16UI, KW, KH);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    const rb = gl.createRenderbuffer(); gl.bindRenderbuffer(gl.RENDERBUFFER, rb);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, KW, KH);
    const fbSrc = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fbSrc);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, rb);
    const fbDst = gl.createFramebuffer();
    gl.disable(gl.BLEND); gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LESS); gl.depthMask(true);
    gl.colorMask(true, true, true, true);
    const R = new Float32Array(9), clear = new Uint32Array([65535, 0, 0, 0]);
    for (const L of list){
      const kf = L.kf;
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbSrc); gl.viewport(0, 0, KW, KH);
      gl.clearBufferuiv(gl.COLOR, 0, clear); gl.clear(gl.DEPTH_BUFFER_BIT);
      gl.useProgram(G.source.p); meshUniforms(G.source);
      for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) R[c * 3 + r] = kf.rotation[r * 3 + c];
      gl.uniformMatrix3fv(G.source.u.uR, false, R);
      gl.uniform3f(G.source.u.uT, kf.translation[0], kf.translation[1], kf.translation[2]);
      const I = kf.intrinsics;
      gl.uniform4f(G.source.u.uIntr, I.fx, I.fy, I.cx, I.cy);
      gl.uniform2f(G.source.u.uWH, KW, KH);
      gl.uniform2f(G.source.u.uNF, 0.02, zmax);
      gl.uniform1f(G.source.u.uZmax, zmax);
      drawMesh();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbDst);
      gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, G.dep, 0, L.index);
      gl.viewport(0, 0, DW, DH);
      gl.disable(gl.DEPTH_TEST);
      gl.useProgram(G.pool.p);
      gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.uniform1i(G.pool.u.uSrc, 2); gl.uniform2i(G.pool.u.uSrcSize, KW, KH);
      gl.bindVertexArray(null);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.enable(gl.DEPTH_TEST);
      L.depthReady = true;
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.deleteFramebuffer(fbSrc); gl.deleteFramebuffer(fbDst);
    gl.deleteTexture(tex); gl.deleteRenderbuffer(rb);
    S.timing.sourceDepthMs = (S.timing.sourceDepthMs || 0) + performance.now() - t;
  }

  /* -------- loading and live append ------------------------------------- */
  const R = CONFIG.routes;
  function chooseEncoding(man){
    const encs = man.encodings || {};
    const astcChunks = (man.chunks || []).some(c => c.encoding === "astc-6x6-rgba" && c.tier === "phone");
    if (ext && !OPT.forceWebp && encs["astc-6x6-rgba"] && encs["astc-6x6-rgba"].available !== false && astcChunks)
      return "astc-6x6-rgba";
    return "webp-rgba";
  }
  function phoneKeyframes(man){
    return (man.keyframes || []).filter(k => k.tier === "phone" && k.chunks && k.chunks[encoding])
      .sort((a, b) => (a.rank ?? 1e9) - (b.rank ?? 1e9));
  }

  async function uploadSlot(chunk, slot, L){
    const bytes = chunk.slots[slot];
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D_ARRAY, G.col);
    if (encoding === "astc-6x6-rgba"){
      if (chunk.encoding !== 1) throw new Error("expected an ASTC chunk");
      gl.compressedTexSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, L.index, KW, KH, 1, 0x93B4, bytes);
    } else {
      if (chunk.encoding !== 2) throw new Error("expected a WebP chunk");
      const bmp = await createImageBitmap(new Blob([bytes], {type: "image/webp"}),
                                          {premultiplyAlpha: "none", colorSpaceConversion: "none"});
      if (!G) { bmp.close(); return; }
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D_ARRAY, G.col);
      gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
      gl.texSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, L.index, KW, KH, 1, gl.RGBA, gl.UNSIGNED_BYTE, bmp);
      bmp.close();
    }
  }

  function samePose(a, b){
    if (!a || !b) return false;
    for (let i = 0; i < 9; i++) if (a.rotation[i] !== b.rotation[i]) return false;
    for (let i = 0; i < 3; i++) if (a.translation[i] !== b.translation[i]) return false;
    return true;
  }

  /* Bring the layers in line with a manifest. The camera is never touched. */
  async function applyManifest(man, generation){
    if (!man || man.format !== "wb-appearance-keyframes/1") throw new Error("the appearance manifest is not in a format this page reads");
    const first = !manifest;

    gl.uniform2f(P.u.uVig, +vig[0] || 0, +vig[1] || 0);
    gl.uniform2f(P.u.uRes, w, h);
    gl.uniform1f(P.u.uTemp, OPT.temp); gl.uniform1f(P.u.uConsensus, OPT.consensus);
    gl.uniform1f(P.u.uBorder, OPT.border);
    gl.uniform1f(P.u.uKnee, OPT.knee);
    gl.uniform1fv(P.u.uLayer, U1); gl.uniformMatrix3fv(P.u.uR, false, U9);
    gl.uniform3fv(P.u.uT, U3a); gl.uniform3fv(P.u.uC, U3b); gl.uniform3fv(P.u.uGain, U3c);
    gl.uniform4fv(P.u.uIntr, U4); gl.uniform1fv(P.u.uQ, UQ);
    gl.uniform2f(P.u.uWH, KW, KH); gl.uniform2i(P.u.uDWH, DW, DH);
    gl.uniform1f(P.u.uZmax, zmax); gl.uniform3f(P.u.uEye, cam.eye[0], cam.eye[1], cam.eye[2]);
    gl.uniform1f(P.u.uExposure, CONFIG.exposure || 1.8); gl.uniform1f(P.u.uGamma, CONFIG.gamma || 1.15);
    gl.uniform1i(P.u.uMode, mode);
    gl.uniform1f(P.u.uFar, zmax * 3);
    drawMesh();
    gl.depthMask(true); gl.depthFunc(gl.LESS);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  let pending = false, asyncProbe = null;
  function requestDraw(){
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => { pending = false; frame(); });
  }
  /* The probe is read back ASYNCHRONOUSLY on the phone: a synchronous
     readPixels stalls the GPU every drag frame. The frame draws with the
     previous choice and redraws once the new one is known. */
  function startAsyncProbe(cam, MVP){
    if (asyncProbe) return true;
    if (G.noAsync || typeof gl.fenceSync !== "function") return false;
    renderProbe(cam, MVP);
    if (!G.pbo){ G.pbo = gl.createBuffer(); gl.bindBuffer(gl.PIXEL_PACK_BUFFER, G.pbo);
                 gl.bufferData(gl.PIXEL_PACK_BUFFER, G.probeW * G.probeH * 4, gl.STREAM_READ); }
    gl.bindBuffer(gl.PIXEL_PACK_BUFFER, G.pbo);
    gl.readPixels(0, 0, G.probeW, G.probeH, gl.RGBA, gl.UNSIGNED_BYTE, 0);
    gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    const sync = gl.fenceSync(gl.SYNC_FENCE, 0);
    if (!sync){
      // Some implementations (SwiftShader here) refuse sync objects: read
      // synchronously from now on.
      gl.getError(); G.noAsync = true; return false;
    }
    asyncProbe = {sync, cam, key: camKey(cam)};
    const poll = () => {
      if (!G || !asyncProbe) return;
      const st = gl.clientWaitSync(asyncProbe.sync, 0, 0);
      if (st === gl.TIMEOUT_EXPIRED){ setTimeout(poll, 4); return; }
      if (st === gl.WAIT_FAILED){ gl.deleteSync(asyncProbe.sync); asyncProbe = null; return; }
      gl.deleteSync(asyncProbe.sync);
      const px = new Uint8Array(G.probeW * G.probeH * 4);
      gl.bindBuffer(gl.PIXEL_PACK_BUFFER, G.pbo);
      gl.getBufferSubData(gl.PIXEL_PACK_BUFFER, 0, px);
      gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
      const probe = asyncProbe; asyncProbe = null;
      const next = choose(probe.cam, probePoints(probe.cam, px));
      const changed = next.length !== chosen.length || next.some((L, i) => L !== chosen[i]);
      chosen = next; chosenFor = probe.key; setChosen(next, !active.size);
      if (changed || camKey(currentCamera()) !== probe.key) requestDraw();
    };
    setTimeout(poll, 0);
    return true;
  }
  function camKey(cam){ return [...cam.eye, ...cam.at, cam.fy, cam.aspect].map(v => v.toFixed(4)).join(","); }
  function chooseSync(cam, MVP, sticky = true){
    renderProbe(cam, MVP);
    const px = new Uint8Array(G.probeW * G.probeH * 4);
    gl.readPixels(0, 0, G.probeW, G.probeH, gl.RGBA, gl.UNSIGNED_BYTE, px);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return choose(cam, probePoints(cam, px), sticky);
  }
  function frame(sync){
    if (!G || gl.isContextLost() || !mesh || !G.col) return;
    resize();
    const cam = currentCamera(), MVP = matrices(cam), key = camKey(cam);
    const now = performance.now();
    const dt = clockMs !== null ? clockMs : (lastFrameT ? Math.min(100, now - lastFrameT) : 0);
    lastFrameT = now;
    // A verification hook without a clock asks for the settled picture.
    const instant = (sync && clockMs === null) || !active.size;
    if (sync || !chosen.length){ chosen = chooseSync(cam, MVP); chosenFor = key; setChosen(chosen, instant); }
    else if (chosenFor !== key && !startAsyncProbe(cam, MVP)){
      chosen = chooseSync(cam, MVP); chosenFor = key; setChosen(chosen, instant);
    }
    const fading = updatePresence(dt);
    drawBlend(cam, MVP, bound());
    if (fading && !sync) requestDraw();
    S.choice = chosen.map(L => L.kf && L.kf.ki);
    S.bound = bound().map(({L, p}) => [L.kf && L.kf.ki, +p.toFixed(3)]);
    $("pos").textContent = !override && mode === "walk" && cams.length ? (ci + 1) + " / " + cams.length : "";
    if (S.timing.firstFrameMs === undefined && S.layers > 0) S.timing.firstFrameMs = performance.now() - T0;
  }

  /* How much of a small render of `cam`, at the canvas's own aspect, is DRAWN:
     the mean of the evidence alpha, and the
     mean viewing distance of what is drawn. */
  function drawnFraction(cam, w, h){
    const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, w, h);
    const rb = gl.createRenderbuffer(); gl.bindRenderbuffer(gl.RENDERBUFFER, rb);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
    const fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, rb);
    const MVP = matrices(cam);
    const picks = chooseSync(cam, MVP, false).map(L => ({L, p: 1}));
    drawBlend(cam, MVP, picks, 3, {fb, w, h});
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    const px = new Uint8Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.deleteFramebuffer(fb); gl.deleteTexture(tex); gl.deleteRenderbuffer(rb);
    let drawn = 0, dsum = 0;
    const far = zmax * 3;
    for (let i = 0; i < px.length; i += 4){
      const a = px[i] / 255;
      if (a <= 0) continue;
      drawn += a; dsum += a * (px[i+1] * 256 + px[i+2]) / 65535 * far;
    }
    return {drawn: drawn / (w * h), distance: drawn > 0 ? dsum / drawn : 0};
  }
  /* The opening view: the recorded pose whose rendered frame is most DRAWN,
     with a mild preference (at most 15%) for wider content -- a view of the
     room over a close-up of one shelf. Scored at the canvas's real aspect;
     coarse over the walk, then refined around the best. */
  function openingScore(r){
    const ref = CONFIG.median_scene_depth || diag * 0.25;
    const wide = Math.max(0, Math.min(1, r.distance / (2.5 * ref)));
    return r.drawn * (0.85 + 0.15 * wide);
  }
  function chooseOpening(){
    if (!cams.length) return -1;
    const t = performance.now();
    const aspect = canvas.width / Math.max(1, canvas.height) || 390 / 844;
    const w = aspect >= 1 ? 64 : Math.max(24, Math.round(64 * aspect));
    const h = aspect >= 1 ? Math.max(24, Math.round(64 / aspect)) : 64;
    const step = Math.max(1, Math.ceil(cams.length / 32));
    const saveMode = mode, saveOverride = override;
    override = null; mode = "walk";
    const seen = new Map();
    const score = i => {
      if (!seen.has(i)){
        ci = i; look.yaw = 0; look.pitch = 0;
        const r = drawnFraction(currentCamera(aspect), w, h);
        seen.set(i, {score: openingScore(r), drawn: r.drawn, distance: r.distance});
      }
      return seen.get(i).score;
    };
    let best = -1, bestScore = -1;
    for (let i = 0; i < cams.length; i += step){ const s = score(i); if (s > bestScore){ bestScore = s; best = i; } }
    const fine = Math.max(1, Math.round(step / 3));
    for (let i = Math.max(0, best - step + fine); i <= Math.min(cams.length - 1, best + step - fine); i += fine){
      const s = score(i); if (s > bestScore){ bestScore = s; best = i; }
    }
    mode = saveMode; override = saveOverride;
    S.timing.openingMs = performance.now() - t;
    const b = seen.get(best) || {};
    S.opening = {index: best, step, fine, tested: seen.size, score: bestScore,
                 drawn: b.drawn, distance: b.distance, size: [w, h]};
    return best;
  }

  /* -------- context loss ---------------------------------------------------- */
  /* WebKit often never fires `webglcontextrestored` after a real loss (review 1,
     m8). So: ask for the context back after RESTORE_ASK_MS, and reload the page
     after RESTORE_RELOAD_MS -- the app lets exactly this page reload itself
     (WORLD-BUILDER-IOS.md §10) -- rather than sit on "Restoring…" for good. */
  const RESTORE_ASK_MS = 3000, RESTORE_RELOAD_MS = 10000;
  let restoreTimers = [];
  function clearRestoreTimers(){ for (const t of restoreTimers) clearTimeout(t); restoreTimers = []; }
  canvas.addEventListener("webglcontextlost", e => {
    e.preventDefault();
    S.contextLosses++;
    loadGeneration++;
    G = null; asyncProbe = null; chosen = []; active.clear();
    for (const L of layers){ L.ready = false; L.depthReady = false; L.digest = null; }
    S.layers = 0;
    const m = $("msg");
    m.textContent = "The graphics context was taken away (usually memory pressure). Restoring…";
    m.classList.add("on");
    clearRestoreTimers();
    restoreTimers.push(setTimeout(() => {
      try { if (loseExt) loseExt.restoreContext(); } catch (_) { /* not lost any more, or not allowed */ }
    }, RESTORE_ASK_MS));
    restoreTimers.push(setTimeout(() => {
      if (G) return;
      S.reloadRequested = true;
      location.reload();
    }, RESTORE_RELOAD_MS));
  }, false);
  canvas.addEventListener("webglcontextrestored", () => {
    clearRestoreTimers();
    // Imagery is not kept in page memory, and neither is the MANIFEST: it is
    // fetched again, through the same transport and the same redaction check
    // (a label changed or a purge while the context was gone is honoured, and
    // so is a build that published meanwhile), and the camera stays where it
    // was. Reapplying the old in-page manifest skipped that check and 404ed on
    // every chunk a newer build had replaced (review 1, M4 and M5).
    manifest = null;
    layers.length = 0;
    serial(async () => {
      try {
        buildGL();
        await loadRevision(S.revision);
        if (S.phase !== "withdrawn") $("msg").classList.remove("on");
        requestDraw();
      } catch (e){
        if (e && e.absent){
          dropAppearance("These images are no longer served for this world (its redaction record "
                         + "changed, or its imagery was removed). This view will show them again if "
                         + "they are rebuilt.");
          return;
        }
        fail("The graphics context came back but the images could not be placed again: " + e.message);
      }
    });
  }, false);

  /* -------- input ------------------------------------------------------------ */
  const pts = new Map();
  let gesture = null, walkSwipe = 0;
  function two(){ const v = [...pts.values()];
    return {d: Math.hypot(v[0].x-v[1].x, v[0].y-v[1].y), x:(v[0].x+v[1].x)/2, y:(v[0].y+v[1].y)/2}; }
  canvas.addEventListener("pointerdown", e => {
    try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* synthetic */ }
    pts.set(e.pointerId, {x: e.clientX, y: e.clientY});
    gesture = pts.size >= 2 ? two() : null; walkSwipe = 0;
    e.preventDefault();
  }, {passive: false});
  canvas.addEventListener("pointermove", e => {
    const p = pts.get(e.pointerId);
    if (!p) return;
    override = null;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (pts.size === 1){
      if (mode === "walk"){
        look.yaw -= dx * 0.005;
        look.pitch = Math.max(-1.3, Math.min(1.3, look.pitch - dy * 0.005));
      } else {
        orbit.yaw -= dx * 0.008;
        orbit.pitch = Math.max(-1.45, Math.min(1.45, orbit.pitch - dy * 0.008));
      }
    } else if (pts.size >= 2 && gesture){
      const g = two();
      if (mode === "orbit"){
        orbit.dist = Math.max(diag*0.01, Math.min(diag*6, orbit.dist * (gesture.d / Math.max(1, g.d))));
        const cam = currentCamera();
        const f = norm3([cam.at[0]-cam.eye[0], cam.at[1]-cam.eye[1], cam.at[2]-cam.eye[2]]);
        const r = norm3(cross3(f, UP)), u = cross3(r, f);
        const k = orbit.dist * 0.0022, mx = g.x - gesture.x, my = g.y - gesture.y;
        for (let i = 0; i < 3; i++) orbit.target[i] += (-r[i]*mx + u[i]*my) * k;
      } else {
        fovScale = Math.max(0.5, Math.min(1.4, fovScale * (gesture.d / Math.max(1, g.d))));
        walkSwipe += g.x - gesture.x;
        while (Math.abs(walkSwipe) >= 70){ step(walkSwipe < 0 ? 1 : -1); walkSwipe -= Math.sign(walkSwipe) * 70; }
      }
      gesture = g;
    }
    requestDraw(); e.preventDefault();
  }, {passive: false});
  function up(e){ pts.delete(e.pointerId); gesture = pts.size >= 2 ? two() : null; requestDraw(); }
  canvas.addEventListener("pointerup", up);
  canvas.addEventListener("pointercancel", up);
  canvas.addEventListener("lostpointercapture", up);
  canvas.addEventListener("touchmove", e => e.preventDefault(), {passive: false});
  for (const n of ["gesturestart", "gesturechange", "gestureend"])
    document.addEventListener(n, e => e.preventDefault(), {passive: false});
  canvas.addEventListener("wheel", e => {
    override = null;
    if (mode === "orbit") orbit.dist = Math.max(diag*0.01, Math.min(diag*6, orbit.dist * Math.exp(e.deltaY * 0.0012)));
    else fovScale = Math.max(0.5, Math.min(1.4, fovScale * Math.exp(e.deltaY * 0.001)));
    requestDraw(); e.preventDefault();
  }, {passive: false});
  addEventListener("keydown", e => {
    if (e.key === "ArrowRight") step(1); else if (e.key === "ArrowLeft") step(-1);
  });

  function step(d){
    if (!cams.length) return;
    override = null; ci = Math.max(0, Math.min(cams.length-1, ci + d));
    look.yaw = 0; look.pitch = 0; requestDraw();
  }
  function setMode(m){
    override = null; mode = m;
    $("bOrbit").setAttribute("aria-pressed", String(m === "orbit"));
    $("bWalk").setAttribute("aria-pressed", String(m === "walk"));
    if (m === "orbit") resetOrbitToCamera();
    look.yaw = 0; look.pitch = 0; fovScale = 1;
    requestDraw();
  }
  function reset(){
    override = null; ci = opening >= 0 ? opening : 0;
    look.yaw = 0; look.pitch = 0; fovScale = 1;
    resetOrbitToCamera(); setMode(cams.length ? "walk" : "orbit");
  }
  $("bOrbit").onclick = () => setMode("orbit");
  $("bWalk").onclick = () => { if (cams.length) setMode("walk"); };
  $("bPrev").onclick = () => { if (mode === "walk") step(-1); };
  $("bNext").onclick = () => { if (mode === "walk") step(1); };
  $("bReset").onclick = reset;
  if (!cams.length){ $("bWalk").disabled = true; $("bPrev").disabled = true; $("bNext").disabled = true; }
  addEventListener("resize", requestDraw);

  /* -------- caption: exactly what this is ---------------------------------- */
  function updateCaption(){
    const cap = $("caption");
    cap.textContent = "";
    const head = document.createElement("b");
    head.textContent = "Captured images on reconstructed geometry";
    const bits = [];
    if (manifest){
      bits.push(S.layers + " of " + S.keyframesInManifest + " keyframes shown");
      if (S.holding) bits.push("finishing the world: these are the walk's images until the final ones arrive");
      else if (manifest.quality === "live") bits.push("still building as you walk");
    }
    if (CONFIG.current === false){
      const reason = manifest && manifest.currency && manifest.currency.reason || CONFIG.currency_reason;
      bits.push(reason ? String(reason) : "built from an earlier reconstruction");
    }
    if (encoding === "webp-rgba") bits.push("reduced set: this device has no compressed-texture support");
    let note = "These are the camera's own frames, with faces redacted, placed on the reconstructed room. "
      + "Dark areas are places no kept frame saw, or that were masked as unreliable (redaction, hands, "
      + "views that disagreed); nothing there is filled in. Where the geometry underneath is wrong, "
      + "images smear or double.";
    if ((CONFIG.scale_state || "unknown") === "unknown") note += " Scale is unknown, so distances are relative.";
    cap.append(head, bits.length ? " · " + bits.join(" · ") : "", document.createElement("br"), note);
  }

  /* -------- verification hooks (read-only, and harmless on the phone) ------- */
  S.setView = (v) => { override = {eye: v.eye, target: v.target, up: v.up ? norm3(v.up) : null,
    fovY: (v.fovYDeg || 70) * Math.PI / 180}; frame(true); return S.choice; };
  S.walk = (i, yawDeg = 0, pitchDeg = 0) => { override = null; mode = "walk"; ci = i; look.yaw = yawDeg * Math.PI / 180;
    look.pitch = pitchDeg * Math.PI / 180; fovScale = 1; frame(true); return {index: ci, of: cams.length}; };
  S.orbitView = (yawDeg, pitchDeg, distScale = 1, around = null) => { override = null; mode = "orbit";
    ci = around !== null ? around : (opening >= 0 ? opening : 0);
    resetOrbitToCamera(); orbit.yaw += yawDeg * Math.PI / 180; orbit.pitch = Math.max(-1.45, Math.min(1.45, orbit.pitch + pitchDeg * Math.PI / 180));
    orbit.dist *= distScale; frame(true); return true; };
  S.reset = () => { reset(); frame(true); };
  S.coverage = () => {
    const cam = currentCamera(), MVP = matrices(cam);
    const w = canvas.width, h = canvas.height, px = new Uint8Array(w * h * 4);
    drawBlend(cam, MVP, bound(), 2);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
    let obs = 0, un = 0;
    for (let i = 0; i < px.length; i += 4){
      if (px[i] === 255 && px[i+1] === 255) obs++; else if (px[i] === 255 && px[i+1] === 0) un++;
    }
    drawBlend(cam, MVP, bound(), 3);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
    let drawn = 0;
    for (let i = 0; i < px.length; i += 4) drawn += px[i];
    drawBlend(cam, MVP, bound());
    return {observed: obs / (w*h), unobserved: un / (w*h), background: 1 - (obs + un) / (w*h),
            drawn: drawn / 255 / (w*h)};
  };
  // Verification only: the camera as drawn, one debug mode as an image, and a
  // fixed frame clock so a captured sequence shows the crossfades a phone would.
  S.camera = () => { const c = currentCamera(); return {eye: c.eye, at: c.at, up: c.up || UP, fy: c.fy,
    aspect: c.aspect, near: c.near, far: c.far, zfar: zmax * 3, w: canvas.width, h: canvas.height}; };
  S.shotMode = (m) => { const cam = currentCamera(), MVP = matrices(cam);
    drawBlend(cam, MVP, bound(), m); const u = canvas.toDataURL("image/png");
    drawBlend(cam, MVP, bound()); return u; };
  S.clock = (ms) => { clockMs = ms === null || ms === undefined ? null : +ms; return clockMs; };
  S.snapshot = () => { frame(true); return canvas.toDataURL("image/png"); };

  /* -------- start ------------------------------------------------------------ */
  try {
    buildGL();
    basis();
    S.phase = "loading";
    status("Loading the images…");
    await serial(() => loadRevision(CONFIG.appearance_revision || null));
    if (S.phase === "failed") return;
    if (!S.layers){ fail("No image of this world could be placed."); return; }
    resize();
    opening = chooseOpening();
    ci = opening >= 0 ? opening : 0;
    resetOrbitToCamera();
    updateCaption();
    setMode(cams.length ? "walk" : "orbit");
    frame(true);
    S.phase = "ready";
    S.timing.bootMs = performance.now() - T0;
    gpuTotal();
    follow();
  } catch (e){
    if (S.phase !== "failed") fail("The images could not be placed: " + (e && e.message ? e.message : e));
  }
}

main().catch(e => fail("The world viewer failed to start: " + (e && e.message ? e.message : e)));
</script>
</body>
</html>
