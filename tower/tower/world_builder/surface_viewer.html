<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="wb-representation" content="surface">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>World</title>
<style>
:root{
  --bg:#0b0d10; --ink:#e8e9ec; --dim:#9aa0a8; --line:#23262c; --accent:#64d2ff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior:none}
/* The page must not scroll or rubber-band under the canvas on a phone. */
body{overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none;background:var(--bg)}
#wrap{position:fixed;inset:0}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(11,13,16,.96),rgba(11,13,16,0));
  display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{appearance:none;border:1px solid var(--line);background:#14171c;color:var(--ink);
  border-radius:8px;padding:8px 11px;font:inherit;font-size:13px;min-height:38px}
button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
#caption{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
  background:linear-gradient(to bottom,rgba(11,13,16,.96),rgba(11,13,16,0));
  font-size:12px;color:var(--dim)}
#caption b{color:var(--ink);font-weight:600}
#msg{position:fixed;inset:0;display:none;place-content:center;padding:28px;text-align:center;color:var(--dim)}
#msg.on{display:grid}
.spacer{flex:1}
#pos{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="caption"></div>
<div id="bar">
  <button id="bOrbit" aria-pressed="true">Orbit</button>
  <button id="bWalk" aria-pressed="false">Walk</button>
  <button id="bPrev">&#8592;</button>
  <button id="bNext">&#8594;</button>
  <span id="pos"></span>
  <span class="spacer"></span>
  <button id="bReset">Reset</button>
</div>
<div id="msg"></div>
<script>
"use strict";
const CONFIG = __WB_SURFACE_CONFIG__;
const MESH_B64 = "__WB_SURFACE_MESH__";

function fail(text){
  const m = document.getElementById("msg");
  m.textContent = text; m.classList.add("on");
  document.getElementById("wrap").style.display = "none";
  document.getElementById("bar").style.display = "none";
}

/* ---------- decode wb-surface-mesh/1 ---------------------------------- */
function b64bytes(s){
  const bin = atob(s), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function decodeMesh(bytes){
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let magic = "";
  for (let i = 0; i < 8; i++) magic += String.fromCharCode(dv.getUint8(i));
  if (magic !== "WBSURF01") throw new Error("not a surface mesh");
  const nV = dv.getUint32(8, true), nI = dv.getUint32(12, true);
  const flags = dv.getUint32(16, true);
  const lo = [dv.getFloat32(24,true), dv.getFloat32(28,true), dv.getFloat32(32,true)];
  const hi = [dv.getFloat32(36,true), dv.getFloat32(40,true), dv.getFloat32(44,true)];
  const hasN = (flags & 1) !== 0, u16 = (flags & 2) !== 0;
  let off = 48;
  const need = off + nV * (6 + 3 + (hasN ? 3 : 0)) + nI * (u16 ? 2 : 4);
  if (bytes.byteLength !== need) throw new Error("surface mesh length mismatch");

  const q = new Uint16Array(nV * 3);
  for (let i = 0; i < nV * 3; i++) q[i] = dv.getUint16(off + i * 2, true);
  off += nV * 6;
  const col = bytes.subarray(off, off + nV * 3); off += nV * 3;
  let nrm = null;
  if (hasN){ nrm = new Int8Array(bytes.buffer, bytes.byteOffset + off, nV * 3); off += nV * 3; }
  const idx = u16 ? new Uint16Array(nI) : new Uint32Array(nI);
  for (let i = 0; i < nI; i++) idx[i] = u16 ? dv.getUint16(off + i*2, true) : dv.getUint32(off + i*4, true);

  const span = [hi[0]-lo[0] || 1e-9, hi[1]-lo[1] || 1e-9, hi[2]-lo[2] || 1e-9];
  const pos = new Float32Array(nV * 3);
  for (let i = 0; i < nV; i++)
    for (let k = 0; k < 3; k++)
      pos[i*3+k] = lo[k] + (q[i*3+k] / 65535) * span[k];

  const nf = new Float32Array(nV * 3);
  if (nrm){ for (let i = 0; i < nV*3; i++) nf[i] = nrm[i] / 127; }
  const cf = new Float32Array(nV * 3);
  for (let i = 0; i < nV*3; i++) cf[i] = col[i] / 255;
  return {pos, nrm: nf, col: cf, idx, lo, hi, nV, nI, u32: !u16};
}

/* ---------- tiny matrix helpers --------------------------------------- */
const M = {
  mul(a,b){const o=new Float32Array(16);
    for(let r=0;r<4;r++)for(let c=0;c<4;c++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}return o;},
  persp(fy,asp,n,f){const t=1/Math.tan(fy/2),o=new Float32Array(16);
    o[0]=t/asp;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o;},
  look(eye,at,up){
    let z=[eye[0]-at[0],eye[1]-at[1],eye[2]-at[2]];let l=Math.hypot(...z)||1;z=z.map(v=>v/l);
    let x=[up[1]*z[2]-up[2]*z[1],up[2]*z[0]-up[0]*z[2],up[0]*z[1]-up[1]*z[0]];
    l=Math.hypot(...x)||1;x=x.map(v=>v/l);
    const y=[z[1]*x[2]-z[2]*x[1],z[2]*x[0]-z[0]*x[2],z[0]*x[1]-z[1]*x[0]];
    const o=new Float32Array(16);
    o[0]=x[0];o[4]=x[1];o[8]=x[2];o[1]=y[0];o[5]=y[1];o[9]=y[2];o[2]=z[0];o[6]=z[1];o[10]=z[2];
    o[12]=-(x[0]*eye[0]+x[1]*eye[1]+x[2]*eye[2]);
    o[13]=-(y[0]*eye[0]+y[1]*eye[1]+y[2]*eye[2]);
    o[14]=-(z[0]*eye[0]+z[1]*eye[1]+z[2]*eye[2]);
    o[15]=1;return o;}
};

const VS = `#version 300 es
in vec3 aPos; in vec3 aNrm; in vec3 aCol;
uniform mat4 uMVP; uniform mat4 uMV;
out vec3 vN; out vec3 vC; out vec3 vP;
void main(){ vN = mat3(uMV) * aNrm; vC = aCol; vP = (uMV * vec4(aPos,1.0)).xyz;
  gl_Position = uMVP * vec4(aPos,1.0); }`;

/* The capture is a dim room -- most of its frames average under 80 of 255 --
   so a shader that just multiplies by vertex colour renders mud. Exposure and
   a gentle gamma are display controls: they move no vertex and invent no
   surface. The wrap term keeps surfaces facing away from the viewer readable
   instead of black, which matters because a room is mostly seen obliquely. */
const FS = `#version 300 es
precision highp float;
in vec3 vN; in vec3 vC; in vec3 vP;
uniform float uExposure; uniform float uGamma;
out vec4 frag;
void main(){
  vec3 n = normalize(vN);
  vec3 v = normalize(-vP);
  float head = abs(dot(n, v));
  float wrap = clamp((dot(n, normalize(vec3(0.35,-0.8,0.45))) + 1.0) * 0.5, 0.0, 1.0);
  float lit = 0.34 + 0.50 * head + 0.16 * wrap;
  vec3 c = pow(clamp(vC * uExposure * lit, 0.0, 1.0), vec3(1.0 / uGamma));
  frag = vec4(c, 1.0);
}`;

function compile(gl, type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}

function main(){
  const canvas = document.getElementById("c");
  const gl = canvas.getContext("webgl2", {antialias:true, depth:true});
  if (!gl){
    fail("This world is a 3-D surface and needs WebGL 2, which this viewer "
       + "could not start. The sparse diagnostic view still works.");
    return;
  }
  let mesh;
  try { mesh = decodeMesh(b64bytes(MESH_B64)); }
  catch (e){ fail("The surface could not be read: " + e.message); return; }
  if (mesh.nI === 0){ fail("Nothing was reconstructed for this session yet."); return; }

  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl, gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl, gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)){ fail(gl.getProgramInfoLog(prog)); return; }
  gl.useProgram(prog);

  const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  function buf(data, loc, size){
    const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    const l = gl.getAttribLocation(prog, loc);
    gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, size, gl.FLOAT, false, 0, 0);
  }
  buf(mesh.pos, "aPos", 3); buf(mesh.nrm, "aNrm", 3); buf(mesh.col, "aCol", 3);
  const ib = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, mesh.idx, gl.STATIC_DRAW);
  const idxType = mesh.u32 ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT;

  gl.enable(gl.DEPTH_TEST);
  gl.clearColor(0.043, 0.051, 0.063, 1);
  const uMVP = gl.getUniformLocation(prog, "uMVP");
  const uMV = gl.getUniformLocation(prog, "uMV");
  gl.uniform1f(gl.getUniformLocation(prog, "uExposure"), 2.2);
  gl.uniform1f(gl.getUniformLocation(prog, "uGamma"), 1.25);

  const centre = [(mesh.lo[0]+mesh.hi[0])/2, (mesh.lo[1]+mesh.hi[1])/2, (mesh.lo[2]+mesh.hi[2])/2];
  const diag = Math.hypot(mesh.hi[0]-mesh.lo[0], mesh.hi[1]-mesh.lo[1], mesh.hi[2]-mesh.lo[2]) || 1;
  // +Y is down in the capture's frame, so world up is -Y.
  const UP = [0,-1,0];

  const cams = CONFIG.cameras || [];
  let mode = cams.length ? "walk" : "orbit";
  let ci = Math.floor(cams.length / 2);
  const view = {yaw: 0.6, pitch: -0.35, dist: diag * 0.9, target: centre.slice(),
                pan: [0,0,0]};

  function reset(){
    view.yaw = 0.6; view.pitch = -0.35; view.dist = diag * 0.9;
    view.target = centre.slice(); view.pan = [0,0,0];
    ci = Math.floor(cams.length / 2);
    draw();
  }

  function eyeAt(){
    if (mode === "walk" && cams.length){
      const c = cams[Math.max(0, Math.min(cams.length-1, ci))];
      const back = diag * 0.06;
      const eye = [c[0]-c[3]*back, c[1]-c[4]*back, c[2]-c[5]*back];
      const at = [c[0]+c[3]*diag, c[1]+c[4]*diag, c[2]+c[5]*diag];
      return [eye, at];
    }
    const cp = Math.cos(view.pitch), sp = Math.sin(view.pitch);
    const t = [view.target[0]+view.pan[0], view.target[1]+view.pan[1], view.target[2]+view.pan[2]];
    const eye = [t[0] + view.dist*cp*Math.cos(view.yaw),
                 t[1] + view.dist*sp,
                 t[2] + view.dist*cp*Math.sin(view.yaw)];
    return [eye, t];
  }

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
    if (canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; }
    gl.viewport(0, 0, canvas.width, canvas.height);
  }

  function draw(){
    resize();
    const [eye, at] = eyeAt();
    const V = M.look(eye, at, UP);
    const P = M.persp(mode === "walk" ? 1.25 : 0.95,
                      canvas.width / Math.max(1, canvas.height),
                      diag * 0.0015, diag * 12);
    gl.uniformMatrix4fv(uMV, false, V);
    gl.uniformMatrix4fv(uMVP, false, M.mul(P, V));
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.drawElements(gl.TRIANGLES, mesh.nI, idxType, 0);
    document.getElementById("pos").textContent =
      mode === "walk" && cams.length ? (ci + 1) + " / " + cams.length : "";
  }

  /* ---------- input: one finger orbits, two pan and pinch -------------- */
  let drag = null, pinch = null;
  function xy(t){ return {x: t.clientX, y: t.clientY}; }
  canvas.addEventListener("pointerdown", e => {
    canvas.setPointerCapture(e.pointerId); drag = xy(e); e.preventDefault();
  });
  canvas.addEventListener("pointermove", e => {
    if (!drag || pinch) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag = xy(e);
    if (mode === "walk"){
      if (Math.abs(dx) > 6){ ci = Math.max(0, Math.min(cams.length-1, ci + (dx < 0 ? 1 : -1))); }
    } else {
      view.yaw -= dx * 0.008;
      view.pitch = Math.max(-1.45, Math.min(1.45, view.pitch - dy * 0.008));
    }
    draw(); e.preventDefault();
  });
  canvas.addEventListener("pointerup", e => { drag = null; e.preventDefault(); });
  canvas.addEventListener("pointercancel", () => { drag = null; });

  canvas.addEventListener("touchstart", e => {
    if (e.touches.length === 2){
      drag = null;
      pinch = {d: Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                             e.touches[0].clientY-e.touches[1].clientY),
               x:(e.touches[0].clientX+e.touches[1].clientX)/2,
               y:(e.touches[0].clientY+e.touches[1].clientY)/2};
    }
    e.preventDefault();
  }, {passive:false});
  canvas.addEventListener("touchmove", e => {
    if (pinch && e.touches.length === 2){
      const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                           e.touches[0].clientY-e.touches[1].clientY);
      const cx = (e.touches[0].clientX+e.touches[1].clientX)/2;
      const cy = (e.touches[0].clientY+e.touches[1].clientY)/2;
      if (mode === "orbit"){
        view.dist = Math.max(diag*0.03, Math.min(diag*6, view.dist * (pinch.d / Math.max(1,d))));
        const k = view.dist * 0.0022;
        view.pan[0] -= (cx - pinch.x) * k * Math.cos(view.yaw + Math.PI/2);
        view.pan[2] -= (cx - pinch.x) * k * Math.sin(view.yaw + Math.PI/2);
        view.pan[1] -= (cy - pinch.y) * k;
      }
      pinch = {d, x:cx, y:cy};
      draw();
    }
    e.preventDefault();
  }, {passive:false});
  canvas.addEventListener("touchend", e => { if (e.touches.length < 2) pinch = null; }, {passive:false});
  canvas.addEventListener("wheel", e => {
    if (mode === "orbit"){
      view.dist = Math.max(diag*0.03, Math.min(diag*6, view.dist * Math.exp(e.deltaY * 0.0012)));
      draw();
    }
    e.preventDefault();
  }, {passive:false});

  function setMode(m){
    mode = m;
    document.getElementById("bOrbit").setAttribute("aria-pressed", String(m === "orbit"));
    document.getElementById("bWalk").setAttribute("aria-pressed", String(m === "walk"));
    draw();
  }
  document.getElementById("bOrbit").onclick = () => setMode("orbit");
  document.getElementById("bWalk").onclick = () => { if (cams.length) setMode("walk"); };
  document.getElementById("bPrev").onclick = () => { if (mode==="walk"){ ci = Math.max(0, ci-1); draw(); } };
  document.getElementById("bNext").onclick = () => { if (mode==="walk"){ ci = Math.min(cams.length-1, ci+1); draw(); } };
  document.getElementById("bReset").onclick = reset;
  if (!cams.length){ document.getElementById("bWalk").disabled = true;
                     document.getElementById("bPrev").disabled = true;
                     document.getElementById("bNext").disabled = true; }
  addEventListener("resize", draw);

  /* ---------- the caption says exactly what this is -------------------- */
  const used = CONFIG.frames_used, offered = CONFIG.frames_offered;
  const bits = [];
  bits.push("<b>Reconstructed surface</b>");
  bits.push(CONFIG.faces.toLocaleString() + " triangles");
  if (CONFIG.quality === "live") bits.push("still building as you walk");
  if (used && offered) bits.push(used + " of " + offered + " keyframes");
  if (!CONFIG.current && CONFIG.currency_reason) bits.push(CONFIG.currency_reason);
  let note = "Surfaces appear only where cameras measured them, so gaps are "
           + "places nothing looked, not walls that are missing.";
  if ((CONFIG.scale_state || "unknown") === "unknown")
    note += " Scale is unknown, so distances here are relative.";
  document.getElementById("caption").innerHTML =
    bits.join(" &middot; ") + "<br>" + note;

  setMode(mode);
  draw();
}

try { main(); }
catch (e){ fail("The world viewer failed to start: " + (e && e.message ? e.message : e)); }
</script>
</body>
</html>
